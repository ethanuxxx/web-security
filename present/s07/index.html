決定。自動化掃描工具能看出某個頁面沒有檢查，卻看不出這個頁面該不該有人擋，因為它不知道網站打算讓誰使用。要判斷什麼算越權，得先知道網站原本的權限設計，例如一般會員預期不能進管理頁。\u003c/p\u003e\n\n\u003ch2 id=\"rule-models\"\u003e\u003cspan class=\"num\"\u003e3.2.2\u003c/span\u003e 權限規則的存放與判斷\u003c/h2\u003e\n\u003cp\u003e「誰能對什麼做什麼」的規則，可以由作業系統、資料庫或網站程式執行，常見的做法歸納成幾種安全模型（security model）。這些模型說明網站的權限規則怎麼設計，也用來對照前面的\u003ca href=\"#login-not-enough\"\u003e垂直與水平越權\u003c/a\u003e各靠哪一種檢查擋下。區分模型有兩個角度：規則存放在哪裡、怎麼查；權限怎麼分配，也就是誰能授權、權限掛在誰身上。\u003c/p\u003e\n\u003cp\u003e規則的存放方式，常見的是程式內的權限矩陣（programmatic access control）：把一張記錄權限的表存在資料庫，內容是使用者、群組或角色對各動作的許可，程式處理每個請求時去查。售票平台把兩個角色能做的動作列成下表，程式每次都查這張表。alice、bob 屬於會員，admin 帳號屬於管理員：\u003c/p\u003e\n\u003cdiv class=\"tbl-wrap\"\u003e\u003ctable id=\"ac-matrix\"\u003e\n\u003ccaption\u003e\u003cspan class=\"tbl-num\"\u003e表 3.2.2-1\u003c/span\u003e 售票平台的權限矩陣\u003c/caption\u003e\n\u003cthead\u003e\u003ctr\u003e\u003cth\u003e動作\u003c/th\u003e\u003cth\u003e會員\u003c/th\u003e\u003cth\u003e管理員\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\u003ctd\u003e看自己的訂單\u003c/td\u003e\u003ctd\u003e✓ 可\u003c/td\u003e\u003ctd\u003e✓ 可\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e看他人的訂單\u003c/td\u003e\u003ctd\u003e✗ 不可\u003c/td\u003e\u003ctd\u003e✓ 可\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e進管理頁\u003c/td\u003e\u003ctd\u003e✗ 不可\u003c/td\u003e\u003ctd\u003e✓ 可\u003c/td\u003e\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e權限的分配有三種模型：\u003c/p\u003e\n\u003cul\u003e\n  \u003cli\u003e\u003cstrong\u003eDAC\u003c/strong\u003e（discretionary access control，自主存取控制）：權限依使用者或群組授予，資源的擁有者可以自行把權限授予別人。雲端文件的共用設定就是這樣：文件的擁有者想分享給誰就分享給誰，系統照擁有者的設定放行。\u003c/li\u003e\n  \u003cli\u003e\u003cstrong\u003eMAC\u003c/strong\u003e（mandatory access control，強制存取控制）：由一個中央管理者統一規定，資源的擁有者和使用者都不能自行授權或修改。軍方的機密文件是典型例子：每個人有許可等級，每份資料有機密標籤，由系統比對兩者，文件的作者也不能把它交給許可等級不夠的人。\u003c/li\u003e\n  \u003cli\u003e\u003cstrong\u003eRBAC\u003c/strong\u003e（role-based access control，角色型存取控制）：權限授予角色，由管理者把使用者指派到一個或多個角色，使用者就有該角色的權限。售票平台的某位會員要改當活動主辦方，只要換他的角色；要新增客服這類身分，就多開一個角色，都不必逐項改權限。\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cfigure id=\"ac-models\"\u003e\n  \u003csvg viewBox=\"0 0 720 182\" role=\"img\" aria-labelledby=\"ac-models-t\" style=\"color:var(--text)\"\u003e\n    \u003ctitle id=\"ac-models-t\"\u003eDAC 由資源的擁有者授權給別人，MAC 由系統比對使用者的許可等級與資料的標籤，RBAC 把權限給角色、使用者歸屬某個角色\u003c/title\u003e\n    \u003cdefs\u003e\n      \u003cmarker id=\"ac-models-a\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"\u003e\n        \u003cpath d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\"/\u003e\n      \u003c/marker\u003e\n    \u003c/defs\u003e\n    \u003cg transform=\"translate(0,26)\"\u003e\u003ctext x=\"112\" y=\"-10\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003eDAC：擁有者授權\u003c/text\u003e\u003crect x=\"0\" y=\"0\" width=\"224\" height=\"142\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003cuse href=\"#icon-user\" x=\"22\" y=\"26\" width=\"44\" height=\"44\" style=\"color:var(--text)\"/\u003e\u003ctext x=\"44\" y=\"92\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003ealice\u003c/text\u003e\u003cuse href=\"#icon-user\" x=\"158\" y=\"26\" width=\"44\" height=\"44\" style=\"color:var(--text)\"/\u003e\u003ctext x=\"180\" y=\"92\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003ebob\u003c/text\u003e\u003ctext x=\"112\" y=\"44\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e擁有者授權\u003c/text\u003e\u003cpath d=\"M72 54 H152\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-models-a)\"/\u003e\u003c/g\u003e\n    \u003cg transform=\"translate(248,26)\"\u003e\u003ctext x=\"112\" y=\"-10\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003eMAC：系統標籤決定\u003c/text\u003e\u003crect x=\"0\" y=\"0\" width=\"224\" height=\"142\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003cuse href=\"#icon-user\" x=\"14\" y=\"26\" width=\"40\" height=\"40\" style=\"color:var(--text)\"/\u003e\u003ctext x=\"34\" y=\"88\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e許可等級\u003c/text\u003e\u003cuse href=\"#icon-server\" x=\"92\" y=\"26\" width=\"40\" height=\"40\" style=\"color:var(--text)\"/\u003e\u003ctext x=\"112\" y=\"88\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e系統比對\u003c/text\u003e\u003cuse href=\"#icon-document\" x=\"170\" y=\"26\" width=\"40\" height=\"40\" style=\"color:var(--text)\"/\u003e\u003ctext x=\"190\" y=\"88\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e機密標籤\u003c/text\u003e\u003cpath d=\"M58 54 H88\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-models-a)\"/\u003e\u003cpath d=\"M136 54 H166\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-models-a)\"/\u003e\u003c/g\u003e\n    \u003cg transform=\"translate(496,26)\"\u003e\u003ctext x=\"112\" y=\"-10\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003eRBAC：權限掛在角色\u003c/text\u003e\u003crect x=\"0\" y=\"0\" width=\"224\" height=\"142\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003cuse href=\"#icon-user\" x=\"8\" y=\"14\" width=\"36\" height=\"36\" style=\"color:var(--text)\"/\u003e\u003ctext x=\"26\" y=\"64\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003ealice\u003c/text\u003e\u003cuse href=\"#icon-admin\" x=\"8\" y=\"76\" width=\"36\" height=\"36\" style=\"color:var(--text)\"/\u003e\u003ctext x=\"26\" y=\"126\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003eadmin\u003c/text\u003e\u003crect x=\"62\" y=\"14\" width=\"56\" height=\"36\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"90\" y=\"36\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e會員\u003c/text\u003e\u003crect x=\"138\" y=\"14\" width=\"78\" height=\"36\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"177\" y=\"36\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e自己的訂單\u003c/text\u003e\u003cpath d=\"M46 32 H60\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-models-a)\"/\u003e\u003cpath d=\"M120 32 H136\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-models-a)\"/\u003e\u003crect x=\"62\" y=\"76\" width=\"56\" height=\"36\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"90\" y=\"98\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e管理員\u003c/text\u003e\u003crect x=\"138\" y=\"76\" width=\"78\" height=\"36\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"177\" y=\"98\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e管理頁\u003c/text\u003e\u003cpath d=\"M46 94 H60\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-models-a)\"/\u003e\u003cpath d=\"M120 94 H136\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-models-a)\"/\u003e\u003c/g\u003e\n  \u003c/svg\u003e\n  \u003cfigcaption\u003e\u003cspan class=\"fig-num\"\u003e圖 3.2.2-1\u003c/span\u003e 三種存取控制模型怎麼分配權限\u003c/figcaption\u003e\n\u003c/figure\u003e\n\n\u003cp\u003e規則的存放方式與權限的分配模型彼此獨立，所以可以並用。售票平台的規則存放在程式內的權限矩陣，矩陣以角色為欄位，代表權限掛在角色上，這就是 RBAC：會員與管理員是兩個角色，每個使用者歸屬其中一個。RBAC 的角色數量要適中：角色太少，分不出不同的權限；角色太多，規則又難以管理。\u003c/p\u003e\n\u003cp\u003e垂直越權擋的是角色：一般會員不能進管理頁，由 RBAC 的角色檢查負責。\u003c/p\u003e\n\u003cp\u003e水平越權只靠角色擋不住：alice 和 bob 都是會員，角色檢查對兩人的請求都放行，所以還要檢查這筆資料屬於誰。這個擁有者檢查不是 DAC：alice 不能把自己的訂單授權給 bob 看。它和 MAC 一樣由網站統一規定、擁有者不能自行授權，但它不比對許可等級與標籤，而是比對資料的擁有者是不是登入的人，所以也不是典型的 MAC。\u003c/p\u003e\n\u003cp\u003e不論用哪個模型，判斷都得在伺服器端做，依據是伺服器自己記的資料：用 session 認出使用者，再查出這個使用者的角色。請求進來後，網站依下圖的順序判斷：\u003c/p\u003e\n\n\u003cfigure id=\"ac-server-check\"\u003e\n  \u003csvg viewBox=\"0 0 720 270\" role=\"img\" aria-labelledby=\"ac-server-check-t\" style=\"color:var(--text)\"\u003e\n    \u003ctitle id=\"ac-server-check-t\"\u003e請求進來後，伺服器依 session 查出使用者與角色，依使用者的角色決定放行或回 403；請求裡自帶的角色旗標與角色欄位不應採用。這些值以虛線框和底色標示為使用者可控的部分\u003c/title\u003e\n    \u003cdefs\u003e\n      \u003cmarker id=\"ac-server-check-a\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"\u003e\n        \u003cpath d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\"/\u003e\n      \u003c/marker\u003e\n    \u003c/defs\u003e\n    \u003ctext x=\"100\" y=\"22\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\" style=\"font-family:var(--font-mono)\"\u003ePOST /account/update\u003c/text\u003e\u003crect x=\"0\" y=\"34\" width=\"200\" height=\"206\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"100\" y=\"54\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003eCookie\u003c/text\u003e\u003crect x=\"14\" y=\"62\" width=\"172\" height=\"28\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"100\" y=\"81\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003esession=a1b2…\u003c/text\u003e\u003ctext x=\"100\" y=\"116\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e請求自己帶的角色值\u003c/text\u003e\u003crect x=\"14\" y=\"124\" width=\"172\" height=\"28\" rx=\"8\" fill=\"var(--accent-soft)\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/\u003e\u003ctext x=\"100\" y=\"143\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003eCookie 的角色旗標\u003c/text\u003e\u003crect x=\"14\" y=\"162\" width=\"172\" height=\"28\" rx=\"8\" fill=\"var(--accent-soft)\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/\u003e\u003ctext x=\"100\" y=\"181\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e表單的角色欄位\u003c/text\u003e\u003crect x=\"290\" y=\"60\" width=\"150\" height=\"96\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003cuse href=\"#icon-server\" x=\"300\" y=\"66\" width=\"40\" height=\"40\" style=\"color:var(--text)\"/\u003e\u003ctext x=\"372\" y=\"92\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e網站程式\u003c/text\u003e\u003ctext x=\"372\" y=\"112\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e依角色判斷\u003c/text\u003e\u003ctext x=\"365\" y=\"146\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e依 session 查出身分\u003c/text\u003e\u003crect x=\"276\" y=\"186\" width=\"178\" height=\"70\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003cuse href=\"#icon-database\" x=\"298\" y=\"194\" width=\"34\" height=\"34\" style=\"color:var(--text)\"/\u003e\u003ctext x=\"376\" y=\"212\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003eusers 表\u003c/text\u003e\u003ctext x=\"365\" y=\"244\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003eid 7 · alice · member\u003c/text\u003e\u003cpath d=\"M202 76 H288\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-server-check-a)\"/\u003e\u003cpath d=\"M202 138 L288 120\" fill=\"none\" stroke=\"var(--warning)\" stroke-width=\"1.6\" stroke-dasharray=\"5 4\" marker-end=\"url(#ac-server-check-a)\"/\u003e\u003cuse href=\"#icon-cross\" x=\"230\" y=\"118\" width=\"22\" height=\"22\" style=\"color:var(--text)\"/\u003e\u003ctext x=\"245\" y=\"168\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e不應採用\u003c/text\u003e\u003cpath d=\"M365 158 V184\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-server-check-a)\"/\u003e\u003crect x=\"540\" y=\"54\" width=\"170\" height=\"50\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"625\" y=\"84\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e放行：200\u003c/text\u003e\u003crect x=\"540\" y=\"150\" width=\"170\" height=\"50\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"625\" y=\"180\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\" style=\"font-family:var(--font-mono)\"\u003e403 Forbidden\u003c/text\u003e\u003cpath d=\"M442 92 L538 80\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-server-check-a)\"/\u003e\u003ctext x=\"500\" y=\"70\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e角色符合\u003c/text\u003e\u003cpath d=\"M442 120 L538 172\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-server-check-a)\"/\u003e\u003ctext x=\"470\" y=\"172\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e角色不符\u003c/text\u003e\n    \u003cuse href=\"#legend-input\" x=\"470\" y=\"236\"/\u003e\n  \u003c/svg\u003e\n  \u003cfigcaption\u003e\u003cspan class=\"fig-num\"\u003e圖 3.2.2-2\u003c/span\u003e 授權依伺服器端查到的角色判斷，請求內的角色值不是依據\u003c/figcaption\u003e\n\u003c/figure\u003e\n\n\u003cp\u003e上圖中，請求自己帶的角色旗標與角色欄位都在使用者手上，改成別的值就是另一個角色。這些值由使用者決定，不能拿來當權限依據；依據是伺服器端存的身分：session 對應到哪個使用者，資料庫裡這個使用者是什麼角色。\u003c/p\u003e\n\n\u003ch2 id=\"unprotected-admin\"\u003e\u003cspan class=\"num\"\u003e3.2.3\u003c/span\u003e 未受保護的管理功能\u003c/h2\u003e\n\u003cp\u003e垂直越權最直接的一種：管理功能沒有任何檢查（unprotected functionality）。管理頁有網址，網站卻沒有在這個網址上確認來訪者是不是管理員，知道網址的人都進得去。\u003c/p\u003e\n\u003cp\u003e管理頁的網址可能從 \u003ccode\u003erobots.txt\u003c/code\u003e、網站載入的 JavaScript 洩漏，也可能被一份常見管理頁網址的清單猜中：清單裡的某個網址有回應，就表示該網址存在。\u003c/p\u003e\n\u003cp\u003e第一個例子，網址就列在 \u003ccode\u003erobots.txt\u003c/code\u003e。\u003ca href=\"../../web-http/information-disclosure/index.html\"\u003e資訊揭露\u003c/a\u003e一節看過 tickets.example.com 的 \u003ccode\u003erobots.txt\u003c/code\u003e 把管理頁（網址 \u003ccode\u003e/admin-panel\u003c/code\u003e）列為不讓搜尋引擎收錄的路徑。alice 是一般會員，她直接把這個網址輸入瀏覽器。下圖比較兩種結果，差別只在伺服器有沒有做這道檢查：\u003c/p\u003e\n\n\u003cfigure id=\"ac-admin-panel\"\u003e\n  \u003csvg viewBox=\"0 0 720 290\" role=\"img\" aria-labelledby=\"ac-admin-panel-t\" style=\"color:var(--text)\"\u003e\n    \u003ctitle id=\"ac-admin-panel-t\"\u003ealice 直接送出 GET /admin-panel：網站程式沒有任何檢查時回 200 管理頁，有檢查角色時回 403\u003c/title\u003e\n    \u003cdefs\u003e\n      \u003cmarker id=\"ac-admin-panel-a\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"\u003e\n        \u003cpath d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\"/\u003e\n      \u003c/marker\u003e\n    \u003c/defs\u003e\n    \u003ctext x=\"10\" y=\"26\" font-size=\"12.5\" text-anchor=\"start\" fill=\"currentColor\" font-weight=\"700\"\u003e沒有檢查\u003c/text\u003e\u003cuse href=\"#icon-user\" x=\"10\" y=\"48\" width=\"44\" height=\"44\" style=\"color:var(--text)\"/\u003e\u003ctext x=\"32\" y=\"108\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003ealice\u003c/text\u003e\u003cpath d=\"M66 70 H258\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-admin-panel-a)\"/\u003e\u003ctext x=\"162\" y=\"60\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003eGET /admin-panel\u003c/text\u003e\u003crect x=\"260\" y=\"36\" width=\"170\" height=\"68\" rx=\"8\" fill=\"none\" stroke=\"var(--warning)\" stroke-width=\"1.6\" stroke-dasharray=\"5 3\"/\u003e\u003cuse href=\"#icon-server\" x=\"268\" y=\"48\" width=\"40\" height=\"40\" style=\"color:var(--text)\"/\u003e\u003ctext x=\"366\" y=\"66\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e網站程式\u003c/text\u003e\u003ctext x=\"366\" y=\"84\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e沒有任何檢查\u003c/text\u003e\u003cpath d=\"M432 70 H518\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-admin-panel-a)\"/\u003e\u003crect x=\"520\" y=\"44\" width=\"190\" height=\"52\" rx=\"8\" fill=\"var(--warning-bg)\" stroke=\"var(--warning)\" stroke-width=\"1.4\"/\u003e\u003ctext x=\"615\" y=\"74\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e200 OK：管理頁\u003c/text\u003e\u003ctext x=\"10\" y=\"172\" font-size=\"12.5\" text-anchor=\"start\" fill=\"currentColor\" font-weight=\"700\"\u003e有檢查\u003c/text\u003e\u003cuse href=\"#icon-user\" x=\"10\" y=\"194\" width=\"44\" height=\"44\" style=\"color:var(--text)\"/\u003e\u003ctext x=\"32\" y=\"254\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003ealice\u003c/text\u003e\u003cpath d=\"M66 216 H258\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-admin-panel-a)\"/\u003e\u003ctext x=\"162\" y=\"206\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003eGET /admin-panel\u003c/text\u003e\u003crect x=\"260\" y=\"182\" width=\"170\" height=\"68\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003cuse href=\"#icon-server\" x=\"268\" y=\"194\" width=\"40\" height=\"40\" style=\"color:var(--text)\"/\u003e\u003ctext x=\"366\" y=\"212\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e網站程式\u003c/text\u003e\u003ctext x=\"366\" y=\"230\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e檢查角色：member\u003c/text\u003e\u003cpath d=\"M432 216 H518\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-admin-panel-a)\"/\u003e\u003crect x=\"520\" y=\"190\" width=\"190\" height=\"52\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"615\" y=\"220\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003e403 Forbidden\u003c/text\u003e\n    \n  \u003c/svg\u003e\n  \u003cfigcaption\u003e\u003cspan class=\"fig-num\"\u003e圖 3.2.3-1\u003c/span\u003e 同一個請求，管理頁有沒有檢查的兩種結果\u003c/figcaption\u003e\n\u003c/figure\u003e\n\n\u003cp\u003e沒有檢查時，alice 打開 \u003ccode\u003e/admin-panel\u003c/code\u003e 看到的畫面：使用者清單，每個會員旁邊都有刪除按鈕。\u003c/p\u003e\n\u003cfigure id=\"ac-admin-panel-shot\" class=\"shot\"\u003e\n\u003cimg src=\"../../assets/shots/access-control/admin-panel-list.png?v=6ecb5adc\" alt=\"管理後台的使用者清單：admin（編號 1，管理員）、bob（3）、alice（7）、carol（9）、reader（12）為會員，會員列各有「刪除」按鈕\" width=\"493\" height=\"370\"\u003e\n\u003cfigcaption\u003e\u003cspan class=\"fig-num\"\u003e圖 3.2.3-2\u003c/span\u003e alice 打開管理頁：可以刪除使用者\u003c/figcaption\u003e\n\u003c/figure\u003e\n\n\u003cp\u003e第二個例子，路徑不在 \u003ccode\u003erobots.txt\u003c/code\u003e：管理頁的網址是一串難猜的字（\u003ccode\u003e/admin-x7k2q9\u003c/code\u003e），看起來猜不到。但網站載入的 JavaScript 檔（\u003ccode\u003e/static/app.js\u003c/code\u003e）在程式碼裡寫了這個網址，瀏覽器載入這個檔案時就拿到了：\u003c/p\u003e\n\n\u003cfigure id=\"ac-js-leak\"\u003e\n  \u003csvg viewBox=\"0 0 720 260\" role=\"img\" aria-labelledby=\"ac-js-leak-t\" style=\"color:var(--text)\"\u003e\n    \u003ctitle id=\"ac-js-leak-t\"\u003e瀏覽器載入前端 JavaScript，程式碼裡寫著管理頁網址 /admin-x7k2q9，讀到網址後直接開管理頁\u003c/title\u003e\n    \u003cdefs\u003e\n      \u003cmarker id=\"ac-js-leak-a\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"\u003e\n        \u003cpath d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\"/\u003e\n      \u003c/marker\u003e\n    \u003c/defs\u003e\n    \u003cuse href=\"#icon-browser\" x=\"24\" y=\"54\" width=\"56\" height=\"56\" style=\"color:var(--text)\"/\u003e\u003ctext x=\"52\" y=\"128\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e瀏覽器（alice）\u003c/text\u003e\u003cuse href=\"#icon-code-file\" x=\"338\" y=\"34\" width=\"44\" height=\"44\" style=\"color:var(--text)\"/\u003e\u003ctext x=\"360\" y=\"94\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003e/static/app.js\u003c/text\u003e\u003crect x=\"256\" y=\"104\" width=\"210\" height=\"30\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"361\" y=\"124\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003eadminUrl = \"/admin-x7k2q9\"\u003c/text\u003e\u003crect x=\"560\" y=\"44\" width=\"150\" height=\"100\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003cuse href=\"#icon-document\" x=\"590\" y=\"50\" width=\"40\" height=\"40\" style=\"color:var(--text)\"/\u003e\u003ctext x=\"635\" y=\"106\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e管理頁\u003c/text\u003e\u003ctext x=\"635\" y=\"128\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003e/admin-x7k2q9\u003c/text\u003e\u003cpath d=\"M92 74 H252\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-js-leak-a)\"/\u003e\u003ctext x=\"172\" y=\"64\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003e① GET /static/app.js\u003c/text\u003e\u003cpath d=\"M252 112 H92\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-js-leak-a)\"/\u003e\u003ctext x=\"172\" y=\"132\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e② 程式碼裡有這個網址\u003c/text\u003e\u003cpath d=\"M52 142 V232 H635 V148\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-js-leak-a)\"/\u003e\u003crect x=\"205.0\" y=\"223.0\" width=\"270\" height=\"18\" rx=\"4\" fill=\"var(--surface)\"/\u003e\u003ctext x=\"340\" y=\"236\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003e③ 直接開 GET /admin-x7k2q9\u003c/text\u003e\n    \n  \u003c/svg\u003e\n  \u003cfigcaption\u003e\u003cspan class=\"fig-num\"\u003e圖 3.2.3-3\u003c/span\u003e 難猜的管理頁網址從前端 JavaScript 洩漏\u003c/figcaption\u003e\n\u003c/figure\u003e\n\n\u003cp\u003e瀏覽器端的程式碼人人讀得到：網址沒有連結出來，仍然可以存取；網址既然寫在瀏覽器載入的 JavaScript 檔裡，任何人用 DevTools 的 Sources 分頁，在檔案裡搜尋 \u003ccode\u003eadmin\u003c/code\u003e 之類的字就找得到。難猜的網址只是 security by obscurity，安全建立在沒人知道這件事上，不是存取控制，被讀出來之後就沒有任何東西擋著。\u003c/p\u003e\n\n\u003caside class=\"practice\" aria-label=\"Lab 練習\"\u003e\n\u003cp\u003ePortSwigger Academy 的對應練習（主題頁 \u003ca href=\"https://portswigger.net/web-security/access-control\"\u003eAccess control vulnerabilities and privilege escalation\u003c/a\u003e）：\u003c/p\u003e\n\u003cul\u003e\n  \u003cli\u003e\u003ca href=\"https://portswigger.net/web-security/access-control/lab-unprotected-admin-functionality\"\u003eUnprotected admin functionality\u003c/a\u003e：管理頁的位置寫在 \u003ccode\u003erobots.txt\u003c/code\u003e，沒有任何檢查，對應上面 robots.txt 列出管理頁網址的例子。Lab 的 carlos 相當於正文的 bob，要用管理頁上的刪除使用者功能刪掉他。\u003c/li\u003e\n  \u003cli\u003e\u003ca href=\"https://portswigger.net/web-security/access-control/lab-unprotected-admin-functionality-with-unpredictable-url\"\u003eUnprotected admin functionality with unpredictable URL\u003c/a\u003e：管理頁的網址難猜，卻出現在首頁的 JavaScript 裡，對應上面網址只出現在前端 JavaScript 的例子。要觀察網址在哪段程式碼出現。\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/aside\u003e\n\n\u003ch2 id=\"role-in-request\"\u003e\u003cspan class=\"num\"\u003e3.2.4\u003c/span\u003e 由使用者控制的角色\u003c/h2\u003e\n\u003cp\u003e網站得記得「這個人是不是管理員」。有些網站把答案放在請求裡，讓瀏覽器每次帶回來：Cookie、query string 裡的 \u003ccode\u003e?admin=true\u003c/code\u003e 之類的參數，或隱藏的表單欄位（網頁表單上有、畫面不顯示的欄位，送出時值照樣隨請求送出）。這種做法稱為 parameter-based access control。放在請求裡的值，使用者自己改了，就能提升自己的權限。\u003c/p\u003e\n\u003cp\u003e先看 Cookie。tickets.example.com 的帳號頁依 Cookie 裡的 \u003ccode\u003eadmin\u003c/code\u003e 旗標決定要不要多顯示管理功能的入口。Cookie 存在瀏覽器裡，使用者自己就改得到。下面兩個請求的 session 相同，只差在 \u003ccode\u003eadmin\u003c/code\u003e 的值，回應就不一樣：\u003c/p\u003e\n\u003cdiv class=\"rr\" id=\"ac-cookie-rr\"\u003e\u003cdiv class=\"rr-pt\"\u003ealice 的原始 Cookie\u003c/div\u003e\u003cdiv class=\"rr-frame\"\u003e\u003cdiv class=\"rr-pane rr-req\"\u003e\u003cdiv class=\"rr-ph\"\u003eRequest\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-method\"\u003eGET\u003c/span\u003e \u003cspan class=\"tok-path\"\u003e/account\u003c/span\u003e \u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eHost\u003c/span\u003e: \u003cspan class=\"tok-host\"\u003etickets.example.com\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eCookie\u003c/span\u003e: \u003cspan class=\"tok-attr\"\u003esession\u003c/span\u003e=\u003cspan class=\"tok-value\"\u003ea1b2…\u003c/span\u003e; \u003cspan class=\"tok-attr\"\u003eadmin\u003c/span\u003e=\u003cspan class=\"tok-value\"\u003efalse\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003cdiv class=\"rr-pane rr-res\"\u003e\u003cdiv class=\"rr-ph\"\u003eResponse\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e \u003cspan class=\"tok-status\"\u003e200\u003c/span\u003e OK\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eContent-Type\u003c/span\u003e: text/html\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-placeholder\"\u003e[alice 的帳號頁]\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cdiv class=\"rr rr-alt\" id=\"ac-cookie-alt-rr\"\u003e\u003cdiv class=\"rr-pt\"\u003eadmin 旗標被改成 true\u003c/div\u003e\u003cdiv class=\"rr-frame\"\u003e\u003cdiv class=\"rr-pane rr-req\"\u003e\u003cdiv class=\"rr-ph\"\u003eRequest\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-method\"\u003eGET\u003c/span\u003e \u003cspan class=\"tok-path\"\u003e/account\u003c/span\u003e \u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eHost\u003c/span\u003e: \u003cspan class=\"tok-host\"\u003etickets.example.com\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eCookie\u003c/span\u003e: \u003cspan class=\"tok-attr\"\u003esession\u003c/span\u003e=\u003cspan class=\"tok-value\"\u003ea1b2…\u003c/span\u003e; \u003cspan class=\"tok-attr\"\u003eadmin\u003c/span\u003e=\u003cspan class=\"tok-value\"\u003etrue\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003cdiv class=\"rr-pane rr-res\"\u003e\u003cdiv class=\"rr-ph\"\u003eResponse\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e \u003cspan class=\"tok-status\"\u003e200\u003c/span\u003e OK\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eContent-Type\u003c/span\u003e: text/html\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-placeholder\"\u003e[多出管理功能入口的帳號頁]\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cp\u003esession 與其他欄位都沒動，回應就多出管理功能。網站沒有查「alice 是不是管理員」，它只讀了請求自己帶的值。下面是這兩個回應畫出來的帳號頁：\u003c/p\u003e\n\u003cfigure id=\"ac-admin-cookie-shots\" class=\"shot shot-pair\"\u003e\n\u003cdiv class=\"shot-cell\"\u003e\u003cimg src=\"../../assets/shots/access-control/account-admin-false.png?v=9208d7ee\" alt=\"alice 帳號頁的連結列：「站內信箱」「變更密碼」「客服對話紀錄」\" width=\"393\" height=\"47\"\u003e\u003cspan class=\"shot-label\"\u003eadmin=false\u003c/span\u003e\u003c/div\u003e\n\u003cdiv class=\"shot-cell\"\u003e\u003cspan class=\"shot-frame\"\u003e\u003cimg src=\"../../assets/shots/access-control/account-admin-true.png?v=d3d088b4\" alt=\"alice 帳號頁的連結列，最後多出「管理後台」，以虛線框標出\" width=\"393\" height=\"47\"\u003e\u003cspan class=\"shot-mark\" style=\"left:70%;top:20%;width:20%;height:58%\"\u003e\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"shot-label\"\u003eadmin=true\u003c/span\u003e\u003c/div\u003e\n\u003cfigcaption\u003e\u003cspan class=\"fig-num\"\u003e圖 3.2.4-1\u003c/span\u003e Cookie 的 admin 旗標改成 true 後，帳號頁的連結列多出「管理後台」（虛線框）\u003c/figcaption\u003e\n\u003c/figure\u003e\n\u003cp\u003e第二種是個人資料更新。帳號頁的表單上沒有角色欄位，送出時另外帶著記錄帳號編號的隱藏欄位 \u003ccode\u003eid\u003c/code\u003e；伺服器則把請求裡所有欄位都收下，不論欄位是否出現在表單上。如果你在請求本體多送一個 \u003ccode\u003eroleid\u003c/code\u003e，伺服器也把它寫進資料庫，角色就被改了：\u003c/p\u003e\n\u003cdiv class=\"rr\" id=\"ac-profile-update-rr\"\u003e\u003cdiv class=\"rr-pt\"\u003e一般的個人資料更新\u003c/div\u003e\u003cdiv class=\"rr-frame\"\u003e\u003cdiv class=\"rr-pane rr-req\"\u003e\u003cdiv class=\"rr-ph\"\u003eRequest\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-method\"\u003ePOST\u003c/span\u003e \u003cspan class=\"tok-path\"\u003e/account/update\u003c/span\u003e \u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eHost\u003c/span\u003e: \u003cspan class=\"tok-host\"\u003etickets.example.com\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eCookie\u003c/span\u003e: \u003cspan class=\"tok-attr\"\u003esession\u003c/span\u003e=\u003cspan class=\"tok-value\"\u003ea1b2…\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eContent-Type\u003c/span\u003e: application/x-www-form-urlencoded\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-param\"\u003eemail\u003c/span\u003e=\u003cspan class=\"tok-value\"\u003ealice%40tickets.example.com\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-value\"\u003e\u003c/span\u003e\u0026amp;\u003cspan class=\"tok-param\"\u003eid\u003c/span\u003e=\u003cspan class=\"tok-value\"\u003e7\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003cdiv class=\"rr-pane rr-res\"\u003e\u003cdiv class=\"rr-ph\"\u003eResponse\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e \u003cspan class=\"tok-status\"\u003e200\u003c/span\u003e OK\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eContent-Type\u003c/span\u003e: text/html\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-placeholder\"\u003e[個人資料已更新，頁面列出帳號欄位：\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-placeholder\"\u003eid=7、email=alice@tickets.example.com、roleid=member]\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cdiv class=\"rr rr-alt\" id=\"ac-profile-update-alt-rr\"\u003e\u003cdiv class=\"rr-pt\"\u003e多送一個 roleid 欄位\u003c/div\u003e\u003cdiv class=\"rr-frame\"\u003e\u003cdiv class=\"rr-pane rr-req\"\u003e\u003cdiv class=\"rr-ph\"\u003eRequest\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-method\"\u003ePOST\u003c/span\u003e \u003cspan class=\"tok-path\"\u003e/account/update\u003c/span\u003e \u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eHost\u003c/span\u003e: \u003cspan class=\"tok-host\"\u003etickets.example.com\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eCookie\u003c/span\u003e: \u003cspan class=\"tok-attr\"\u003esession\u003c/span\u003e=\u003cspan class=\"tok-value\"\u003ea1b2…\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eContent-Type\u003c/span\u003e: application/x-www-form-urlencoded\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-param\"\u003eemail\u003c/span\u003e=\u003cspan class=\"tok-value\"\u003ealice%40tickets.example.com\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-value\"\u003e\u003c/span\u003e\u0026amp;\u003cspan class=\"tok-param\"\u003eid\u003c/span\u003e=\u003cspan class=\"tok-value\"\u003e7\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-value\"\u003e\u003c/span\u003e\u0026amp;\u003cspan class=\"tok-param\"\u003eroleid\u003c/span\u003e=\u003cspan class=\"tok-placeholder\"\u003e[管理員角色]\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003cdiv class=\"rr-pane rr-res\"\u003e\u003cdiv class=\"rr-ph\"\u003eResponse\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e \u003cspan class=\"tok-status\"\u003e200\u003c/span\u003e OK\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eContent-Type\u003c/span\u003e: text/html\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-placeholder\"\u003e[頁面列出的帳號欄位中，roleid 變成管理員角色]\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cp\u003e表單上沒有這個欄位，但使用者能從第一個請求的回應得知它的名字：更新成功後，回應列出帳號的所有欄位，因此 \u003ccode\u003eroleid\u003c/code\u003e 這個欄位名稱對使用者是可見的。伺服器收下請求中的所有欄位，多帶 \u003ccode\u003eroleid\u003c/code\u003e 就會被寫入，這就是第二個請求。隱藏的表單欄位是同一類：欄位只是不顯示在畫面上，值照樣隨請求送出，使用者一樣能改。\u003c/p\u003e\n\n\u003cfigure id=\"ac-trust-compare\"\u003e\n  \u003csvg viewBox=\"0 0 720 284\" role=\"img\" aria-labelledby=\"ac-trust-compare-t\" style=\"color:var(--text)\"\u003e\n    \u003ctitle id=\"ac-trust-compare-t\"\u003e左邊伺服器信任請求內的角色值，把 admin=true 當依據而放行；右邊只依 session 查到的伺服器端角色判斷，忽略請求帶的值並回 403。角色值以虛線框和底色標示為使用者可控的部分\u003c/title\u003e\n    \u003cdefs\u003e\n      \u003cmarker id=\"ac-trust-compare-a\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"\u003e\n        \u003cpath d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\"/\u003e\n      \u003c/marker\u003e\n    \u003c/defs\u003e\n    \u003ctext x=\"175\" y=\"16\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e信任請求內的角色值\u003c/text\u003e\u003ctext x=\"545\" y=\"16\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e只信伺服器端 session 查到的角色\u003c/text\u003e\u003crect x=\"0\" y=\"26\" width=\"350\" height=\"220\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003crect x=\"370\" y=\"26\" width=\"350\" height=\"220\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003crect x=\"90\" y=\"44\" width=\"170\" height=\"28\" rx=\"8\" fill=\"var(--accent-soft)\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/\u003e\u003ctext x=\"175\" y=\"63\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\" style=\"font-family:var(--font-mono)\"\u003eCookie: admin=true\u003c/text\u003e\u003cpath d=\"M175 74 V98\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-trust-compare-a)\"/\u003e\u003crect x=\"40\" y=\"100\" width=\"270\" height=\"56\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003cuse href=\"#icon-server\" x=\"48\" y=\"108\" width=\"40\" height=\"40\" style=\"color:var(--text)\"/\u003e\u003ctext x=\"190\" y=\"124\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e讀請求帶的角色\u003c/text\u003e\u003ctext x=\"190\" y=\"142\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e值是 admin，就當管理員\u003c/text\u003e\u003cpath d=\"M175 158 V180\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-trust-compare-a)\"/\u003e\u003crect x=\"60\" y=\"182\" width=\"230\" height=\"44\" rx=\"8\" fill=\"none\" stroke=\"var(--warning)\" stroke-width=\"1.6\" stroke-dasharray=\"5 3\"/\u003e\u003ctext x=\"175\" y=\"209\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e200：進入管理功能\u003c/text\u003e\u003crect x=\"386\" y=\"44\" width=\"150\" height=\"28\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"461\" y=\"63\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003esession=a1b2…\u003c/text\u003e\u003crect x=\"546\" y=\"44\" width=\"160\" height=\"28\" rx=\"8\" fill=\"var(--accent-soft)\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/\u003e\u003ctext x=\"626\" y=\"63\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\" style=\"font-family:var(--font-mono)\"\u003eadmin=true\u003c/text\u003e\u003cuse href=\"#icon-cross\" x=\"682\" y=\"56\" width=\"22\" height=\"22\" style=\"color:var(--text)\"/\u003e\u003cpath d=\"M461 74 L461 98\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-trust-compare-a)\"/\u003e\u003crect x=\"400\" y=\"100\" width=\"290\" height=\"56\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003cuse href=\"#icon-server\" x=\"408\" y=\"108\" width=\"40\" height=\"40\" style=\"color:var(--text)\"/\u003e\u003ctext x=\"560\" y=\"124\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e查 session：alice\u003c/text\u003e\u003ctext x=\"560\" y=\"142\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e伺服器端記的角色是 member\u003c/text\u003e\u003cpath d=\"M545 158 V180\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-trust-compare-a)\"/\u003e\u003crect x=\"430\" y=\"182\" width=\"230\" height=\"44\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"545\" y=\"209\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\" style=\"font-family:var(--font-mono)\"\u003e403 Forbidden\u003c/text\u003e\n    \u003cuse href=\"#legend-input\" x=\"300\" y=\"258\"/\u003e\n  \u003c/svg\u003e\n  \u003cfigcaption\u003e\u003cspan class=\"fig-num\"\u003e圖 3.2.4-2\u003c/span\u003e 角色值放在請求，與角色只存伺服器端的對照\u003c/figcaption\u003e\n\u003c/figure\u003e\n\n\u003cp\u003e這兩種情況的原因相同：網站把角色放在請求裡，沒有改查伺服器端記的角色（見\u003ca href=\"#rule-models\"\u003e權限規則的存放與判斷\u003c/a\u003e）。\u003c/p\u003e\n\n\u003caside class=\"practice\" aria-label=\"Lab 練習\"\u003e\n\u003cp\u003ePortSwigger Academy 的對應練習（主題頁 \u003ca href=\"https://portswigger.net/web-security/access-control\"\u003eAccess control vulnerabilities and privilege escalation\u003c/a\u003e）：\u003c/p\u003e\n\u003cul\u003e\n  \u003cli\u003e\u003ca href=\"https://portswigger.net/web-security/access-control/lab-user-role-controlled-by-request-parameter\"\u003eUser role controlled by request parameter\u003c/a\u003e：角色旗標放在 Cookie，對應 \u003ccode\u003eadmin=false\u003c/code\u003e 改成 \u003ccode\u003eadmin=true\u003c/code\u003e 的例子。要觀察改值之後，頁面多了什麼功能。\u003c/li\u003e\n  \u003cli\u003e\u003ca href=\"https://portswigger.net/web-security/access-control/lab-user-role-can-be-modified-in-user-profile\"\u003eUser role can be modified in user profile\u003c/a\u003e：個人資料更新的請求可以多帶一個角色欄位，對應 \u003ccode\u003eroleid\u003c/code\u003e 的例子；Lab 的更新請求是 JSON，多送的欄位一樣是 \u003ccode\u003eroleid\u003c/code\u003e。要觀察更新請求的回應裡，有沒有出現角色欄位。\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/aside\u003e\n\n\u003ch2 id=\"idor-id\"\u003e\u003cspan class=\"num\"\u003e3.2.5\u003c/span\u003e 以編號指向的資料\u003c/h2\u003e\n\u003cp\u003e帳號頁用網址上的編號指向資料庫的一筆記錄：alice 的帳號頁網址帶著 \u003ccode\u003eid=7\u003c/code\u003e。編號是整數，一個帳號一個編號，換成別的數字（例如 3），該編號存在時就指向另一個帳號。伺服器如果只照編號查、不確認這筆記錄屬於誰，就把 bob 的資料回給 alice：\u003c/p\u003e\n\u003cdiv class=\"rr\" id=\"ac-idor-rr\"\u003e\u003cdiv class=\"rr-frame\"\u003e\u003cdiv class=\"rr-pane rr-req\"\u003e\u003cdiv class=\"rr-ph\"\u003eRequest\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-method\"\u003eGET\u003c/span\u003e \u003cspan class=\"tok-path\"\u003e/account\u003c/span\u003e?\u003cspan class=\"tok-param\"\u003eid\u003c/span\u003e=\u003cspan class=\"tok-value\"\u003e3\u003c/span\u003e \u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eHost\u003c/span\u003e: \u003cspan class=\"tok-host\"\u003etickets.example.com\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eCookie\u003c/span\u003e: \u003cspan class=\"tok-attr\"\u003esession\u003c/span\u003e=\u003cspan class=\"tok-value\"\u003ea1b2…\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003cdiv class=\"rr-pane rr-res\"\u003e\u003cdiv class=\"rr-ph\"\u003eResponse\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e \u003cspan class=\"tok-status\"\u003e200\u003c/span\u003e OK\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eContent-Type\u003c/span\u003e: text/html\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-placeholder\"\u003e[bob 的帳號頁：名稱、email、角色]\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cfigure id=\"ac-idor-shots\" class=\"shot shot-pair\"\u003e\n\u003cdiv class=\"shot-cell\"\u003e\u003cimg src=\"../../assets/shots/access-control/account-id-self.png?v=d50b4c95\" alt=\"帳號頁，名稱 alice，email alice@tickets.example.com，角色：會員\" width=\"213\" height=\"114\"\u003e\u003cspan class=\"shot-label\"\u003eid=7（alice 自己）\u003c/span\u003e\u003c/div\u003e\n\u003cdiv class=\"shot-cell\"\u003e\u003cimg src=\"../../assets/shots/access-control/account-id-other.png?v=f8eb6af1\" alt=\"帳號頁，名稱 bob，email bob@tickets.example.com，角色：會員\" width=\"207\" height=\"114\"\u003e\u003cspan class=\"shot-label\"\u003eid=3（alice 改編號後）\u003c/span\u003e\u003c/div\u003e\n\u003cfigcaption\u003e\u003cspan class=\"fig-num\"\u003e圖 3.2.5-1\u003c/span\u003e alice 的登入身分不變，只改網址上的編號，頁面就換成 bob 的\u003c/figcaption\u003e\n\u003c/figure\u003e\n\u003cp\u003e這是水平越權，也是 IDOR（insecure direct object reference，不安全的直接物件參照）的典型：使用者送來的編號，直接被拿去取得資料庫裡的一筆記錄，名稱裡的「物件」就是這筆記錄。這類問題因 OWASP 2007 年的 Top Ten 而廣為人知。\u003c/p\u003e\n\n\u003cfigure id=\"ac-idor-records\"\u003e\n  \u003csvg viewBox=\"0 0 720 290\" role=\"img\" aria-labelledby=\"ac-idor-records-t\" style=\"color:var(--text)\"\u003e\n    \u003ctitle id=\"ac-idor-records-t\"\u003ealice 送出 id=7 與 id=3 兩個請求，網站程式依 id 查資料庫的 id 7 與 id 3 兩筆記錄；沒有所有權檢查，指到 bob 那筆的請求也照樣回資料。id 以虛線框和底色標示為使用者可控的部分\u003c/title\u003e\n    \u003cdefs\u003e\n      \u003cmarker id=\"ac-idor-records-a\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"\u003e\n        \u003cpath d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\"/\u003e\n      \u003c/marker\u003e\n    \u003c/defs\u003e\n    \u003cuse href=\"#icon-user\" x=\"12\" y=\"112\" width=\"48\" height=\"48\" style=\"color:var(--text)\"/\u003e\u003ctext x=\"36\" y=\"176\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003ealice\u003c/text\u003e\u003crect x=\"88\" y=\"50\" width=\"140\" height=\"26\" rx=\"8\" fill=\"var(--accent-soft)\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/\u003e\u003ctext x=\"158\" y=\"68\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\" style=\"font-family:var(--font-mono)\"\u003eGET /account?id=7\u003c/text\u003e\u003crect x=\"88\" y=\"118\" width=\"140\" height=\"26\" rx=\"8\" fill=\"var(--accent-soft)\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/\u003e\u003ctext x=\"158\" y=\"136\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\" style=\"font-family:var(--font-mono)\"\u003eGET /account?id=3\u003c/text\u003e\u003cpath d=\"M62 124 L86 66\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-idor-records-a)\"/\u003e\u003cpath d=\"M62 148 L86 134\" fill=\"none\" stroke=\"var(--warning)\" stroke-width=\"1.6\" stroke-dasharray=\"5 4\" marker-end=\"url(#ac-idor-records-a)\"/\u003e\u003cpath d=\"M230 63 H268\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-idor-records-a)\"/\u003e\u003cpath d=\"M230 131 H268\" fill=\"none\" stroke=\"var(--warning)\" stroke-width=\"1.6\" stroke-dasharray=\"5 4\" marker-end=\"url(#ac-idor-records-a)\"/\u003e\u003crect x=\"270\" y=\"40\" width=\"170\" height=\"230\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003cuse href=\"#icon-server\" x=\"335\" y=\"48\" width=\"40\" height=\"40\" style=\"color:var(--text)\"/\u003e\u003ctext x=\"355\" y=\"108\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e網站程式\u003c/text\u003e\u003ctext x=\"355\" y=\"130\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e依 id 查 users 表\u003c/text\u003e\u003crect x=\"284\" y=\"150\" width=\"142\" height=\"90\" rx=\"8\" fill=\"none\" stroke=\"var(--warning)\" stroke-width=\"1.6\" stroke-dasharray=\"5 3\"/\u003e\u003ctext x=\"355\" y=\"178\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e缺少所有權檢查\u003c/text\u003e\u003ctext x=\"355\" y=\"200\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e這筆記錄是\u003c/text\u003e\u003ctext x=\"355\" y=\"218\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e發出請求的人的嗎？\u003c/text\u003e\u003crect x=\"520\" y=\"40\" width=\"190\" height=\"230\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003cuse href=\"#icon-database\" x=\"593\" y=\"46\" width=\"40\" height=\"40\" style=\"color:var(--text)\"/\u003e\u003ctext x=\"615\" y=\"104\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003eusers\u003c/text\u003e\u003crect x=\"534\" y=\"124\" width=\"162\" height=\"30\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"615\" y=\"144\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003eid 7 · alice\u003c/text\u003e\u003crect x=\"534\" y=\"174\" width=\"162\" height=\"30\" rx=\"8\" fill=\"var(--warning-bg)\" stroke=\"var(--warning)\" stroke-width=\"1.4\"/\u003e\u003ctext x=\"615\" y=\"194\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003eid 3 · bob\u003c/text\u003e\u003cpath d=\"M442 63 L532 134\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-idor-records-a)\"/\u003e\u003cpath d=\"M442 131 L532 184\" fill=\"none\" stroke=\"var(--warning)\" stroke-width=\"1.6\" stroke-dasharray=\"5 4\" marker-end=\"url(#ac-idor-records-a)\"/\u003e\u003ctext x=\"615\" y=\"232\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003ealice 的請求指到 bob 那筆\u003c/text\u003e\n    \u003cuse href=\"#legend-input\" x=\"88\" y=\"204\"/\u003e\n  \u003c/svg\u003e\n  \u003cfigcaption\u003e\u003cspan class=\"fig-num\"\u003e圖 3.2.5-2\u003c/span\u003e 同一頁換個 id：alice 的請求指到 bob 的記錄，網站沒有檢查所有權\u003c/figcaption\u003e\n\u003c/figure\u003e\n\n\u003cp\u003e\u003ca href=\"../../web-http/information-disclosure/index.html\"\u003e資訊揭露\u003c/a\u003e一節也看過以使用者名稱查詢帳號頁時，回傳他人的 email、電話與 API key。那一節看的是頁面洩漏了哪些欄位；這裡看的是授權：網站有沒有確認發出請求的人能看這筆記錄。\u003c/p\u003e\n\u003cfigure id=\"ac-account-exposed\" class=\"shot\"\u003e\n\u003cimg src=\"../../assets/shots/access-control/account-user-public.png?v=eabc2c73\" alt=\"帳號頁，名稱 bob，email bob@tickets.example.com，電話 0900-000-003，API key ak_bob_2f6a9b14\" width=\"561\" height=\"160\"\u003e\n\u003cfigcaption\u003e\u003cspan class=\"fig-num\"\u003e圖 3.2.5-3\u003c/span\u003e 以 ?user=bob 查詢的帳號頁：露出 email、電話與 API key\u003c/figcaption\u003e\n\u003c/figure\u003e\n\u003cp\u003e更新請求也有同樣的問題。帳號頁的更新請求用 \u003ccode\u003eid\u003c/code\u003e 指定要改哪個帳號。這個 \u003ccode\u003eid\u003c/code\u003e 與 \u003ccode\u003e?id=7\u003c/code\u003e 一樣由使用者送來，伺服器沒核對所有權，IDOR 在寫入上同樣成立：\u003c/p\u003e\n\u003cdiv class=\"rr\" id=\"ac-idor-update-rr\"\u003e\u003cdiv class=\"rr-pt\"\u003ealice 用 id=3 改 bob 的資料\u003c/div\u003e\u003cdiv class=\"rr-frame\"\u003e\u003cdiv class=\"rr-pane rr-req\"\u003e\u003cdiv class=\"rr-ph\"\u003eRequest\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-method\"\u003ePOST\u003c/span\u003e \u003cspan class=\"tok-path\"\u003e/account/update\u003c/span\u003e \u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eHost\u003c/span\u003e: \u003cspan class=\"tok-host\"\u003etickets.example.com\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eCookie\u003c/span\u003e: \u003cspan class=\"tok-attr\"\u003esession\u003c/span\u003e=\u003cspan class=\"tok-value\"\u003ea1b2…\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eContent-Type\u003c/span\u003e: application/x-www-form-urlencoded\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-param\"\u003eemail\u003c/span\u003e=\u003cspan class=\"tok-placeholder\"\u003e[新的 email]\u003c/span\u003e\u003cspan class=\"tok-value\"\u003e\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-value\"\u003e\u003c/span\u003e\u0026amp;\u003cspan class=\"tok-param\"\u003eid\u003c/span\u003e=\u003cspan class=\"tok-value\"\u003e3\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003cdiv class=\"rr-pane rr-res\"\u003e\u003cdiv class=\"rr-ph\"\u003eResponse\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e \u003cspan class=\"tok-status\"\u003e200\u003c/span\u003e OK\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eContent-Type\u003c/span\u003e: text/html\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-placeholder\"\u003e[bob 的個人資料已更新]\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cp\u003eIDOR 多數是水平越權，也可能造成垂直越權：如果換成較高權限的使用者編號，例如管理員的 \u003ccode\u003eid=1\u003c/code\u003e，記錄裡若含登入用的資料，就能以管理員身分登入，見下一小節。\u003c/p\u003e\n\n\u003caside class=\"practice\" aria-label=\"Lab 練習\"\u003e\n\u003cp\u003ePortSwigger Academy 的對應練習（主題頁 \u003ca href=\"https://portswigger.net/web-security/access-control\"\u003eAccess control vulnerabilities and privilege escalation\u003c/a\u003e）：\u003c/p\u003e\n\u003cul\u003e\n  \u003cli\u003e\u003ca href=\"https://portswigger.net/web-security/access-control/lab-user-id-controlled-by-request-parameter\"\u003eUser ID controlled by request parameter\u003c/a\u003e：帳號頁以網址上的 id 指定使用者，對應上面把網址上的編號 7 改成 3 的例子。要在別人的帳號頁找出什麼資料可以讀。\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/aside\u003e\n\n\u003ch2 id=\"leaks\"\u003e\u003cspan class=\"num\"\u003e3.2.6\u003c/span\u003e 隱藏與存取控制的區別\u003c/h2\u003e\n\u003cp\u003e有些網站的維護者以為把資料藏起來就夠了，卻沒有確保沒有權限的請求拿不到資料：把數字編號換成 GUID（一長串隨機的識別碼）讓人猜不到、把沒有權限的請求轉走、把密碼在畫面上遮成圓點。這些做法只是讓資料不容易被看到，並不會擋下回應裡的資料。三種做法各用一個頁面示範資料怎麼漏出：\u003c/p\u003e\n\n\u003cfigure id=\"ac-leaks\"\u003e\n  \u003csvg viewBox=\"0 0 720 310\" role=\"img\" aria-labelledby=\"ac-leaks-t\" style=\"color:var(--text)\"\u003e\n    \u003ctitle id=\"ac-leaks-t\"\u003e三種洩漏並排：活動討論區的回應含留言者的 GUID，被擋下的帳號頁以 302 導向登入頁但 body 夾帶帳號資料，帳號頁原始碼中預填的遮罩密碼欄位 value 是明文\u003c/title\u003e\n    \u003cdefs\u003e\n      \u003cmarker id=\"ac-leaks-a\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"\u003e\n        \u003cpath d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\"/\u003e\n      \u003c/marker\u003e\n    \u003c/defs\u003e\n    \u003ctext x=\"112\" y=\"16\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e活動討論區\u003c/text\u003e\u003crect x=\"0\" y=\"26\" width=\"224\" height=\"274\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"112\" y=\"54\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e請求\u003c/text\u003e\u003ctext x=\"112\" y=\"74\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003eGET /events/3/comments\u003c/text\u003e\u003cline x1=\"10\" y1=\"88\" x2=\"214\" y2=\"88\" stroke=\"currentColor\" stroke-width=\"1\"/\u003e\u003ctext x=\"112\" y=\"106\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e回應\u003c/text\u003e\u003ctext x=\"360\" y=\"16\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e被擋下的帳號頁\u003c/text\u003e\u003crect x=\"248\" y=\"26\" width=\"224\" height=\"274\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"360\" y=\"54\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e請求\u003c/text\u003e\u003ctext x=\"360\" y=\"74\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003eGET /account?id=[GUID]\u003c/text\u003e\u003cline x1=\"258\" y1=\"88\" x2=\"462\" y2=\"88\" stroke=\"currentColor\" stroke-width=\"1\"/\u003e\u003ctext x=\"360\" y=\"106\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e回應\u003c/text\u003e\u003ctext x=\"608\" y=\"16\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e帳號頁的原始碼\u003c/text\u003e\u003crect x=\"496\" y=\"26\" width=\"224\" height=\"274\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"608\" y=\"54\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e請求\u003c/text\u003e\u003ctext x=\"608\" y=\"74\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003eGET /account?id=[GUID]\u003c/text\u003e\u003cline x1=\"506\" y1=\"88\" x2=\"710\" y2=\"88\" stroke=\"currentColor\" stroke-width=\"1\"/\u003e\u003ctext x=\"608\" y=\"106\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e回應\u003c/text\u003e\u003ctext x=\"14\" y=\"130\" font-size=\"12.5\" text-anchor=\"start\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003e200 OK\u003c/text\u003e\u003crect x=\"10\" y=\"146\" width=\"204\" height=\"30\" rx=\"8\" fill=\"none\" stroke=\"var(--warning)\" stroke-width=\"1.6\" stroke-dasharray=\"5 3\"/\u003e\u003ctext x=\"16\" y=\"166\" font-size=\"11\" text-anchor=\"start\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003e\u0026lt;a href=\"…?id=[GUID]\"\u0026gt;bob\u0026lt;/a\u0026gt;\u003c/text\u003e\u003ctext x=\"112\" y=\"224\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e留言者連結帶著\u003c/text\u003e\u003ctext x=\"112\" y=\"244\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003ebob 的 GUID\u003c/text\u003e\u003ctext x=\"262\" y=\"130\" font-size=\"12.5\" text-anchor=\"start\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003e302 Found\u003c/text\u003e\u003ctext x=\"262\" y=\"148\" font-size=\"12.5\" text-anchor=\"start\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003eLocation: /login\u003c/text\u003e\u003crect x=\"258\" y=\"160\" width=\"204\" height=\"28\" rx=\"8\" fill=\"none\" stroke=\"var(--warning)\" stroke-width=\"1.6\" stroke-dasharray=\"5 3\"/\u003e\u003ctext x=\"264\" y=\"179\" font-size=\"12.5\" text-anchor=\"start\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003e[bob 的帳號資料]\u003c/text\u003e\u003ctext x=\"360\" y=\"224\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e瀏覽器跳去登入頁，\u003c/text\u003e\u003ctext x=\"360\" y=\"244\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003ebody 照樣送到\u003c/text\u003e\u003ctext x=\"510\" y=\"130\" font-size=\"12.5\" text-anchor=\"start\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003e200 OK\u003c/text\u003e\u003crect x=\"506\" y=\"140\" width=\"204\" height=\"44\" rx=\"8\" fill=\"none\" stroke=\"var(--warning)\" stroke-width=\"1.6\" stroke-dasharray=\"5 3\"/\u003e\u003ctext x=\"512\" y=\"158\" font-size=\"12.5\" text-anchor=\"start\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003e\u0026lt;input type=\"password\"\u003c/text\u003e\u003ctext x=\"512\" y=\"175\" font-size=\"12.5\" text-anchor=\"start\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003evalue=\"[明文密碼]\"\u0026gt;\u003c/text\u003e\u003ctext x=\"608\" y=\"224\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e遮罩只在畫面上，\u003c/text\u003e\u003ctext x=\"608\" y=\"244\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e原始碼裡是明文\u003c/text\u003e\n    \n  \u003c/svg\u003e\n  \u003cfigcaption\u003e\u003cspan class=\"fig-num\"\u003e圖 3.2.6-1\u003c/span\u003e 三種隱藏資料的做法，各有一處洩漏\u003c/figcaption\u003e\n\u003c/figure\u003e\n\n\u003cul\u003e\n  \u003cli\u003eGUID 出現在別處：活動討論區的每則留言，都有指向留言者帳號頁的連結。連結帶著留言者的 GUID，所以 bob 留言的連結公開了 bob 的 GUID，把它換進帳號頁網址就能查到 bob 的資料。GUID 只讓編號難猜，編號從別的頁面拿得到，就沒有保護作用。\u003c/li\u003e\n  \u003cli\u003e被擋下的回應仍帶資料：網站有檢查，偵測到你不能看這個帳號頁，回 302（要瀏覽器改去另一個網址的回應）把瀏覽器導向登入頁。瀏覽器收到 302 會直接跳轉，不顯示 body（回應裡帶的頁面內容）；但 body 裡仍夾帶該帳號的資料。body 仍在原始 HTTP 回應裡，Burp 的 HTTP history 這類記錄原始往來的工具看得到；瀏覽器的 DevTools 通常不顯示轉址回應的 body。但 302 只決定瀏覽器接下來顯示什麼，回應裡的資料沒有被擋下。\u003c/li\u003e\n  \u003cli\u003e畫面上只顯示圓點：帳號頁預填一個密碼欄位，畫面上是一排圓點，原始碼的 \u003ccode\u003evalue\u003c/code\u003e 卻是明文，所以檢視原始碼或回應內容就看得到。圓點只遮住畫面，回應裡的密碼仍是明文。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cfigure id=\"ac-masked-shot\" class=\"shot\"\u003e\n\u003cimg src=\"../../assets/shots/access-control/account-password-masked.png?v=c213967c\" alt=\"帳號頁的個人資料表單，Email bob@tickets.example.com，密碼欄位顯示 8 個圓點\" width=\"381\" height=\"325\"\u003e\n\u003cfigcaption\u003e\u003cspan class=\"fig-num\"\u003e圖 3.2.6-2\u003c/span\u003e bob 的帳號頁：密碼欄位只顯示圓點\u003c/figcaption\u003e\n\u003c/figure\u003e\n\u003cdiv class=\"rr\" id=\"ac-password-field-rr\"\u003e\u003cdiv class=\"rr-pt\"\u003e帳號頁回應裡的密碼欄位\u003c/div\u003e\u003cdiv class=\"rr-frame\"\u003e\u003cdiv class=\"rr-pane rr-req\"\u003e\u003cdiv class=\"rr-ph\"\u003eRequest\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-method\"\u003eGET\u003c/span\u003e \u003cspan class=\"tok-path\"\u003e/account\u003c/span\u003e?\u003cspan class=\"tok-param\"\u003eid\u003c/span\u003e=\u003cspan class=\"tok-value\"\u003e[GUID]\u003c/span\u003e \u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eHost\u003c/span\u003e: \u003cspan class=\"tok-host\"\u003etickets.example.com\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eCookie\u003c/span\u003e: \u003cspan class=\"tok-attr\"\u003esession\u003c/span\u003e=\u003cspan class=\"tok-value\"\u003ea1b2…\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003cdiv class=\"rr-pane rr-res\"\u003e\u003cdiv class=\"rr-ph\"\u003eResponse\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e \u003cspan class=\"tok-status\"\u003e200\u003c/span\u003e OK\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eContent-Type\u003c/span\u003e: text/html\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e[…]\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u0026lt;input type=\u003cspan class=\"tok-string\"\u003e\"password\"\u003c/span\u003e name=\u003cspan class=\"tok-string\"\u003e\"password\"\u003c/span\u003e value=\u003cspan class=\"tok-string\"\u003e\"\u003c/span\u003e\u003cspan class=\"tok-placeholder\"\u003e[明文密碼]\u003c/span\u003e\u003cspan class=\"tok-string\"\u003e\"\u003c/span\u003e\u0026gt;\u003c/span\u003e\u003cspan class=\"ln\"\u003e[…]\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cp\u003e三種做法共同的問題，是網站沒有真正擋下沒有權限的請求。圓點遮蔽和編號的形式無關：編號是數字或 GUID，回應裡的密碼都是明文。\u003c/p\u003e\n\u003cp\u003e資料洩漏也可能造成垂直越權：透過 IDOR 讀到管理員的帳號頁與密碼，就能用管理員的身分登入，使用管理員才有的功能。下圖用三個請求走一遍：\u003c/p\u003e\n\n\u003cfigure id=\"ac-horizontal-to-vertical\"\u003e\n  \u003csvg viewBox=\"0 0 720 206\" role=\"img\" aria-labelledby=\"ac-horizontal-to-vertical-t\" style=\"color:var(--text)\"\u003e\n    \u003ctitle id=\"ac-horizontal-to-vertical-t\"\u003ealice 送出三個請求：把 id 改成 1 取得 admin 的帳號資料與密碼，用 admin 與讀到的密碼登入並取得 session，帶著 admin 的 session 開管理頁\u003c/title\u003e\n    \u003cdefs\u003e\n      \u003cmarker id=\"ac-horizontal-to-vertical-a\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"\u003e\n        \u003cpath d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\"/\u003e\n      \u003c/marker\u003e\n    \u003c/defs\u003e\n    \u003ctext x=\"194\" y=\"18\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003ealice 送出的請求\u003c/text\u003e\u003ctext x=\"543\" y=\"18\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e回應\u003c/text\u003e\u003ccircle cx=\"20\" cy=\"52\" r=\"12\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.4\"/\u003e\u003ctext x=\"20\" y=\"57\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e1\u003c/text\u003e\u003crect x=\"44\" y=\"30\" width=\"300\" height=\"44\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"56\" y=\"57\" font-size=\"12.5\" text-anchor=\"start\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003eGET /account?id=1\u003c/text\u003e\u003cpath d=\"M346 52 H376\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-horizontal-to-vertical-a)\"/\u003e\u003crect x=\"378\" y=\"30\" width=\"330\" height=\"44\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"390\" y=\"57\" font-size=\"12.5\" text-anchor=\"start\" fill=\"currentColor\"\u003e200：admin 的帳號資料（含密碼）\u003c/text\u003e\u003ccircle cx=\"20\" cy=\"112\" r=\"12\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.4\"/\u003e\u003ctext x=\"20\" y=\"117\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e2\u003c/text\u003e\u003crect x=\"44\" y=\"90\" width=\"300\" height=\"44\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"56\" y=\"117\" font-size=\"12.5\" text-anchor=\"start\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003ePOST /login（admin、讀到的密碼）\u003c/text\u003e\u003cpath d=\"M346 112 H376\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-horizontal-to-vertical-a)\"/\u003e\u003crect x=\"378\" y=\"90\" width=\"330\" height=\"44\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"390\" y=\"117\" font-size=\"12.5\" text-anchor=\"start\" fill=\"currentColor\"\u003e200：登入成功，取得 admin 的 session\u003c/text\u003e\u003ccircle cx=\"20\" cy=\"172\" r=\"12\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.4\"/\u003e\u003ctext x=\"20\" y=\"177\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e3\u003c/text\u003e\u003crect x=\"44\" y=\"150\" width=\"300\" height=\"44\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"56\" y=\"177\" font-size=\"12.5\" text-anchor=\"start\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003eGET /admin-panel（admin 的 session）\u003c/text\u003e\u003cpath d=\"M346 172 H376\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-horizontal-to-vertical-a)\"/\u003e\u003crect x=\"378\" y=\"150\" width=\"330\" height=\"44\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"390\" y=\"177\" font-size=\"12.5\" text-anchor=\"start\" fill=\"currentColor\"\u003e200：管理頁\u003c/text\u003e\n  \u003c/svg\u003e\n  \u003cfigcaption\u003e\u003cspan class=\"fig-num\"\u003e圖 3.2.6-3\u003c/span\u003e 讀到 admin 的密碼，三個請求之後就進了管理頁\u003c/figcaption\u003e\n\u003c/figure\u003e\n\n\u003cp\u003e重設密碼的流程出問題時，也能取得別人的帳號，見 \u003ca href=\"../authentication/index.html#password-reset\"\u003e身分驗證\u003c/a\u003e一節的重設與更改密碼。\u003c/p\u003e\n\n\u003caside class=\"practice\" aria-label=\"Lab 練習\"\u003e\n\u003cp\u003ePortSwigger Academy 的對應練習（主題頁 \u003ca href=\"https://portswigger.net/web-security/access-control\"\u003eAccess control vulnerabilities and privilege escalation\u003c/a\u003e）：\u003c/p\u003e\n\u003cul\u003e\n  \u003cli\u003e\u003ca href=\"https://portswigger.net/web-security/access-control/lab-user-id-controlled-by-request-parameter-with-unpredictable-user-ids\"\u003eUser ID controlled by request parameter, with unpredictable user IDs\u003c/a\u003e：使用者以 GUID 識別，對應活動討論區留言者連結的例子。要找出 GUID 在別的頁面出現的位置。\u003c/li\u003e\n  \u003cli\u003e\u003ca href=\"https://portswigger.net/web-security/access-control/lab-user-id-controlled-by-request-parameter-with-data-leakage-in-redirect\"\u003eUser ID controlled by request parameter with data leakage in redirect\u003c/a\u003e：請求被導向別處，被導向的回應 body 卻帶著資料，對應 302 回應的例子。要觀察原始回應，瀏覽器畫面看不到這些。\u003c/li\u003e\n  \u003cli\u003e\u003ca href=\"https://portswigger.net/web-security/access-control/lab-user-id-controlled-by-request-parameter-with-password-disclosure\"\u003eUser ID controlled by request parameter with password disclosure\u003c/a\u003e：帳號頁預填遮罩的密碼欄位，對應原始碼裡 \u003ccode\u003evalue\u003c/code\u003e 的例子。要觀察密碼欄位的 \u003ccode\u003evalue\u003c/code\u003e；拿到管理員密碼登入之後，就能進管理頁，是垂直越權；Academy 主題頁把這種情況稱為 horizontal to vertical privilege escalation。\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/aside\u003e\n\n\u003ch2 id=\"static-file-idor\"\u003e\u003cspan class=\"num\"\u003e3.2.7\u003c/span\u003e 以檔名存取的檔案\u003c/h2\u003e\n\u003cp\u003eIDOR 的另一種，指向靜態檔案（內容固定、由伺服器直接送出的檔案）。售票平台把客服對話紀錄存成遞增檔名的文字檔，放在 \u003ccode\u003e/static/chat/\u003c/code\u003e 底下，帳號頁的「客服對話紀錄」連結指向登入者自己的那一份：\u003ccode\u003e/static/chat/123.txt\u003c/code\u003e。檔名是遞增的編號，換成 \u003ccode\u003e122.txt\u003c/code\u003e 就取得別人的紀錄，內容可能含帳號與密碼：\u003c/p\u003e\n\u003cdiv class=\"rr\" id=\"ac-chat-rr\"\u003e\u003cdiv class=\"rr-pt\"\u003e自己的客服紀錄\u003c/div\u003e\u003cdiv class=\"rr-frame\"\u003e\u003cdiv class=\"rr-pane rr-req\"\u003e\u003cdiv class=\"rr-ph\"\u003eRequest\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-method\"\u003eGET\u003c/span\u003e \u003cspan class=\"tok-path\"\u003e/static/chat/123.txt\u003c/span\u003e \u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eHost\u003c/span\u003e: \u003cspan class=\"tok-host\"\u003etickets.example.com\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eCookie\u003c/span\u003e: \u003cspan class=\"tok-attr\"\u003esession\u003c/span\u003e=\u003cspan class=\"tok-value\"\u003ea1b2…\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003cdiv class=\"rr-pane rr-res\"\u003e\u003cdiv class=\"rr-ph\"\u003eResponse\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e \u003cspan class=\"tok-status\"\u003e200\u003c/span\u003e OK\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eContent-Type\u003c/span\u003e: text/plain\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-placeholder\"\u003e[alice 的客服對話紀錄]\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cdiv class=\"rr rr-alt\" id=\"ac-chat-alt-rr\"\u003e\u003cdiv class=\"rr-pt\"\u003e檔名改成前一號\u003c/div\u003e\u003cdiv class=\"rr-frame\"\u003e\u003cdiv class=\"rr-pane rr-req\"\u003e\u003cdiv class=\"rr-ph\"\u003eRequest\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-method\"\u003eGET\u003c/span\u003e \u003cspan class=\"tok-path\"\u003e/static/chat/122.txt\u003c/span\u003e \u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eHost\u003c/span\u003e: \u003cspan class=\"tok-host\"\u003etickets.example.com\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eCookie\u003c/span\u003e: \u003cspan class=\"tok-attr\"\u003esession\u003c/span\u003e=\u003cspan class=\"tok-value\"\u003ea1b2…\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003cdiv class=\"rr-pane rr-res\"\u003e\u003cdiv class=\"rr-ph\"\u003eResponse\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e \u003cspan class=\"tok-status\"\u003e200\u003c/span\u003e OK\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eContent-Type\u003c/span\u003e: text/plain\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-placeholder\"\u003e[別人的客服對話紀錄，含帳號與密碼]\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cp\u003e\u003ca href=\"../../web-http/web-server/index.html\"\u003eWeb Servers and Applications\u003c/a\u003e 一節說過，\u003ccode\u003e/static/\u003c/code\u003e 對應網站目錄裡放靜態檔的資料夾。tickets.example.com 的 nginx 直接從 \u003ccode\u003epublic/\u003c/code\u003e 讀出 \u003ccode\u003e/static/\u003c/code\u003e 下的檔案送回，請求不會進到網站程式，所以沒有程式裡的權限檢查可以做：\u003c/p\u003e\n\n\u003cfigure id=\"ac-static-path\"\u003e\n  \u003csvg viewBox=\"0 0 720 290\" role=\"img\" aria-labelledby=\"ac-static-path-t\" style=\"color:var(--text)\"\u003e\n    \u003ctitle id=\"ac-static-path-t\"\u003e網址 /static/chat/123.txt 由 nginx 直接從 public 目錄讀檔送出，請求不會進到網站程式，沒有權限檢查；帳號頁的請求則由網站程式檢查後才查資料庫\u003c/title\u003e\n    \u003cdefs\u003e\n      \u003cmarker id=\"ac-static-path-a\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"\u003e\n        \u003cpath d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\"/\u003e\n      \u003c/marker\u003e\n    \u003c/defs\u003e\n    \u003cuse href=\"#icon-user\" x=\"10\" y=\"118\" width=\"44\" height=\"44\" style=\"color:var(--text)\"/\u003e\u003ctext x=\"32\" y=\"178\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003ealice\u003c/text\u003e\u003crect x=\"100\" y=\"108\" width=\"100\" height=\"60\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003cuse href=\"#icon-proxy\" x=\"108\" y=\"120\" width=\"34\" height=\"34\" style=\"color:var(--text)\"/\u003e\u003ctext x=\"172\" y=\"140\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003enginx\u003c/text\u003e\u003ctext x=\"172\" y=\"158\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003e反向代理\u003c/text\u003e\u003ctext x=\"250\" y=\"26\" font-size=\"12.5\" text-anchor=\"start\" fill=\"currentColor\" font-weight=\"700\" style=\"font-family:var(--font-mono)\"\u003eGET /static/chat/123.txt\u003c/text\u003e\u003crect x=\"250\" y=\"36\" width=\"180\" height=\"60\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003cuse href=\"#icon-folder\" x=\"258\" y=\"46\" width=\"40\" height=\"40\" style=\"color:var(--text)\"/\u003e\u003ctext x=\"368\" y=\"62\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003enginx 直接讀檔\u003c/text\u003e\u003ctext x=\"368\" y=\"80\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003epublic/chat/\u003c/text\u003e\u003crect x=\"250\" y=\"104\" width=\"180\" height=\"26\" rx=\"8\" fill=\"none\" stroke=\"var(--warning)\" stroke-width=\"1.6\" stroke-dasharray=\"5 3\"/\u003e\u003ctext x=\"340\" y=\"122\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e不經過權限檢查\u003c/text\u003e\u003crect x=\"470\" y=\"36\" width=\"240\" height=\"60\" rx=\"8\" fill=\"var(--warning-bg)\" stroke=\"var(--warning)\" stroke-width=\"1.4\"/\u003e\u003ctext x=\"590\" y=\"62\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e檔案內容直接送回\u003c/text\u003e\u003ctext x=\"590\" y=\"80\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e123.txt 的客服紀錄\u003c/text\u003e\u003cpath d=\"M432 66 H468\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-static-path-a)\"/\u003e\u003ctext x=\"250\" y=\"186\" font-size=\"12.5\" text-anchor=\"start\" fill=\"currentColor\" font-weight=\"700\" style=\"font-family:var(--font-mono)\"\u003eGET /account?id=7\u003c/text\u003e\u003crect x=\"250\" y=\"196\" width=\"150\" height=\"70\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003cuse href=\"#icon-lock\" x=\"258\" y=\"204\" width=\"32\" height=\"32\" style=\"color:var(--text)\"/\u003e\u003ctext x=\"340\" y=\"220\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e網站程式\u003c/text\u003e\u003ctext x=\"340\" y=\"238\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e權限檢查\u003c/text\u003e\u003crect x=\"430\" y=\"196\" width=\"90\" height=\"70\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003cuse href=\"#icon-database\" x=\"454\" y=\"202\" width=\"40\" height=\"40\" style=\"color:var(--text)\"/\u003e\u003ctext x=\"475\" y=\"258\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003eusers\u003c/text\u003e\u003crect x=\"560\" y=\"206\" width=\"150\" height=\"50\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"635\" y=\"236\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e檢查通過才回\u003c/text\u003e\u003cpath d=\"M402 231 H428\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-static-path-a)\"/\u003e\u003cpath d=\"M522 231 H558\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-static-path-a)\"/\u003e\u003cpath d=\"M202 128 L248 70\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-static-path-a)\"/\u003e\u003cpath d=\"M202 148 L248 220\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-static-path-a)\"/\u003e\n    \n  \u003c/svg\u003e\n  \u003cfigcaption\u003e\u003cspan class=\"fig-num\"\u003e圖 3.2.7-1\u003c/span\u003e 靜態檔的路徑沒有網站程式的權限檢查，帳號頁的路徑有\u003c/figcaption\u003e\n\u003c/figure\u003e\n\n\u003cp\u003e檔名是遞增編號，猜得到；請求不經網站程式，session 不會被檢查，所以知道檔名的人都取得到檔案。\u003c/p\u003e\n\n\u003caside class=\"practice\" aria-label=\"Lab 練習\"\u003e\n\u003cp\u003ePortSwigger Academy 的對應練習（主題頁 \u003ca href=\"https://portswigger.net/web-security/access-control\"\u003eAccess control vulnerabilities and privilege escalation\u003c/a\u003e）：\u003c/p\u003e\n\u003cul\u003e\n  \u003cli\u003e\u003ca href=\"https://portswigger.net/web-security/access-control/lab-insecure-direct-object-references\"\u003eInsecure direct object references\u003c/a\u003e：客服對話紀錄存成遞增編號的文字檔，對應上面把客服紀錄檔名 \u003ccode\u003e123.txt\u003c/code\u003e 改成 \u003ccode\u003e122.txt\u003c/code\u003e 的例子。要觀察檔名的規律，以及紀錄裡有什麼可用的資料。\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/aside\u003e\n\n\u003ch2 id=\"proxy-vs-app\"\u003e\u003cspan class=\"num\"\u003e3.2.8\u003c/span\u003e proxy 與網站程式的檢查\u003c/h2\u003e\n\u003cp\u003e有些網站把存取控制放在 \u003ca href=\"../../web-http/web-server/index.html\"\u003ereverse proxy\u003c/a\u003e（接在網站程式前面，先收請求、再轉給網站程式的伺服器，以下簡稱 proxy）：proxy 依網址或 method 擋掉某些請求，例如內部管理頁（網址 \u003ccode\u003e/console\u003c/code\u003e）一律不讓外部連。網站程式自己沒有檢查，它假設到得了這裡的請求都是 proxy 放行過的。兩層對同一個請求的判斷不一樣時，就會出問題。兩層的判斷可能在三個地方不一樣：header、網址與 method。header 與 method 屬平台設定問題（platform misconfiguration），網站程式接受了 proxy 沒預期的 header 或 method；網址屬網址比對差異（URL-matching discrepancies），兩層對同一個網址的解讀不同。\u003c/p\u003e\n\u003cp\u003e第一種差異來自 header。有些網站程式用的框架（別人寫好、可重複使用的網站程式骨架，見\u003ca href=\"../authentication/index.html#stay-logged-in\"\u003e身分驗證\u003c/a\u003e）接受 \u003ccode\u003eX-Original-URL\u003c/code\u003e（或 \u003ccode\u003eX-Rewrite-URL\u003c/code\u003e）這類 header，用它指定的路徑取代請求行（\u003ccode\u003eGET / HTTP/1.1\u003c/code\u003e 那一行）裡的網址。\u003ccode\u003eX-Original-URL\u003c/code\u003e 來自 IIS（Microsoft 的網站伺服器）的網址改寫功能：改寫網址時，把改寫前的原始網址記在這個 header，讓後面的程式知道使用者原本要的網址；有些框架（例如 2018 年修正前的 Symfony）因此照它的路徑處理。Original 指的是改寫前的網址，不是請求從哪裡來。框架分不出這個 header 是改寫功能加的，還是使用者自己帶的，所以使用者自己填也照收。proxy 看請求行：\u003ccode\u003e/\u003c/code\u003e 沒有規則擋；網站程式卻改用 header 的 \u003ccode\u003e/console\u003c/code\u003e：\u003c/p\u003e\n\u003cdiv class=\"rr\" id=\"ac-console-rr\"\u003e\u003cdiv class=\"rr-pt\"\u003e直接要 /console\u003c/div\u003e\u003cdiv class=\"rr-frame\"\u003e\u003cdiv class=\"rr-pane rr-req\"\u003e\u003cdiv class=\"rr-ph\"\u003eRequest\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-method\"\u003eGET\u003c/span\u003e \u003cspan class=\"tok-path\"\u003e/console\u003c/span\u003e \u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eHost\u003c/span\u003e: \u003cspan class=\"tok-host\"\u003etickets.example.com\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eCookie\u003c/span\u003e: \u003cspan class=\"tok-attr\"\u003esession\u003c/span\u003e=\u003cspan class=\"tok-value\"\u003ea1b2…\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003cdiv class=\"rr-pane rr-res\"\u003e\u003cdiv class=\"rr-ph\"\u003eResponse\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e \u003cspan class=\"tok-status\"\u003e403\u003c/span\u003e Forbidden\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cdiv class=\"rr rr-alt\"\u003e\u003cdiv class=\"rr-pt\"\u003e請求行是 /，header 指定 /console\u003c/div\u003e\u003cdiv class=\"rr-frame\"\u003e\u003cdiv class=\"rr-pane rr-req\"\u003e\u003cdiv class=\"rr-ph\"\u003eRequest\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-method\"\u003eGET\u003c/span\u003e \u003cspan class=\"tok-path\"\u003e/\u003c/span\u003e \u003cspan class=
