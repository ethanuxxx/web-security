\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eHost\u003c/span\u003e: \u003cspan class=\"tok-host\"\u003etickets.example.com\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eCookie\u003c/span\u003e: \u003cspan class=\"tok-attr\"\u003esession\u003c/span\u003e=\u003cspan class=\"tok-value\"\u003ea1b2…\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eX-Original-URL\u003c/span\u003e: /console\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003cdiv class=\"rr-pane rr-res\"\u003e\u003cdiv class=\"rr-ph\"\u003eResponse\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e \u003cspan class=\"tok-status\"\u003e200\u003c/span\u003e OK\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eContent-Type\u003c/span\u003e: text/html\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-placeholder\"\u003e[管理頁]\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n\n\u003cfigure id=\"ac-proxy-bypass\"\u003e\n  \u003csvg viewBox=\"0 0 720 456\" role=\"img\" aria-labelledby=\"ac-proxy-bypass-t\" style=\"color:var(--text)\"\u003e\n    \u003ctitle id=\"ac-proxy-bypass-t\"\u003eproxy 依網址或 method 擋規則：GET /console 被擋下；GET / 帶 X-Original-URL: /console 時 proxy 看到的是 /，放行後網站程式改用 header 指定的 /console 回管理頁；規則只擋 POST 時，GET /console/promote 放行\u003c/title\u003e\n    \u003cdefs\u003e\n      \u003cmarker id=\"ac-proxy-bypass-a\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"\u003e\n        \u003cpath d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\"/\u003e\n      \u003c/marker\u003e\n    \u003c/defs\u003e\n \"font-family:var(--font-mono)\"\u003eX-Original-URL: /console\u003c/text\u003e\u003cuse href=\"#icon-user\" x=\"10\" y=\"212\" width=\"44\" height=\"44\" style=\"color:var(--text)\"/\u003e\u003ctext x=\"32\" y=\"272\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003ealice\u003c/text\u003e\u003cpath d=\"M60 234 H148\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-proxy-bypass-a)\"/\u003e\u003crect x=\"150\" y=\"204\" width=\"190\" height=\"64\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003cuse href=\"#icon-proxy\" x=\"156\" y=\"216\" width=\"32\" height=\"32\" style=\"color:var(--text)\"/\u003e\u003ctext x=\"268\" y=\"230\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003eproxy 看到 /\u003c/text\u003e\u003ctext x=\"268\" y=\"250\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e放行\u003c/text\u003e\u003cpath d=\"M342 234 H398\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-proxy-bypass-a)\"/\u003e\u003crect x=\"400\" y=\"204\" width=\"160\" height=\"64\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003cuse href=\"#icon-app\" x=\"406\" y=\"216\" width=\"32\" height=\"32\" style=\"color:var(--text)\"/\u003e\u003ctext x=\"498\" y=\"230\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e網站程式改用\u003c/text\u003e\u003ctext x=\"498\" y=\"250\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003eheader 的 /console\u003c/text\u003e\u003cpath d=\"M562 234 H598\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-proxy-bypass-a)\"/\u003e\u003crect x=\"600\" y=\"214\" width=\"110\" height=\"40\" rx=\"8\" fill=\"var(--warning-bg)\" stroke=\"var(--warning)\" stroke-width=\"1.4\"/\u003e\u003ctext x=\"655\" y=\"239\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e200 管理頁\u003c/text\u003e\u003ctext x=\"10\" y=\"324\" font-size=\"12.5\" text-anchor=\"start\" fill=\"currentColor\" font-weight=\"700\" style=\"font-family:var(--font-mono)\"\u003eGET /console/promote\u003c/text\u003e\u003cuse href=\"#icon-user\" x=\"10\" y=\"364\" width=\"44\" height=\"44\" style=\"color:var(--text)\"/\u003e\u003ctext x=\"32\" y=\"424\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003ealice\u003c/text\u003e\u003cpath d=\"M60 386 H148\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-proxy-bypass-a)\"/\u003e\u003crect x=\"150\" y=\"356\" width=\"190\" height=\"64\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003cuse href=\"#icon-proxy\" x=\"156\" y=\"368\" width=\"32\" height=\"32\" style=\"color:var(--text)\"/\u003e\u003ctext x=\"268\" y=\"382\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003eproxy：規則只擋 POST\u003c/text\u003e\u003ctext x=\"268\" y=\"402\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e放行\u003c/text\u003e\u003cpath d=\"M342 386 H398\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-proxy-bypass-a)\"/\u003e\u003crect x=\"400\" y=\"356\" width=\"160\" height=\"64\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003cuse href=\"#icon-app\" x=\"406\" y=\"368\" width=\"32\" height=\"32\" style=\"color:var(--text)\"/\u003e\u003ctext x=\"498\" y=\"382\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e網站程式\u003c/text\u003e\u003ctext x=\"498\" y=\"402\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e處理升級\u003c/text\u003e\u003cpath d=\"M562 386 H598\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-proxy-bypass-a)\"/\u003e\u003crect x=\"600\" y=\"366\" width=\"110\" height=\"40\" rx=\"8\" fill=\"var(--warning-bg)\" stroke=\"var(--warning)\" stroke-width=\"1.4\"/\u003e\u003ctext x=\"655\" y=\"391\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e200\u003c/text\u003e\n    \u003cuse href=\"#legend-input\" x=\"560\" y=\"430\"/\u003e\n  \u003c/svg\u003e\n  \u003cfigcaption\u003e\u003cspan class=\"fig-num\"\u003e圖 3.2.8-1\u003c/span\u003e proxy 與網站程式對同一個請求的判斷不同\u003c/figcaption\u003e\n\u003c/figure\u003e\n\n\u003cp\u003e第二種差異來自網址比對。規則寫的是 \u003ccode\u003e/console\u003c/code\u003e，proxy 逐字比對；網站程式卻對大小寫、結尾多一個斜線（\u003ccode\u003e/console/\u003c/code\u003e）或副檔名後綴（\u003ccode\u003e/console.anything\u003c/code\u003e）寬鬆，把不同寫法當成同一個網址。proxy 與網站程式對同一個網址的解讀不同，proxy 就擋不到：\u003c/p\u003e\n\n\u003cfigure id=\"ac-url-match\"\u003e\n  \u003csvg viewBox=\"0 0 720 270\" role=\"img\" aria-labelledby=\"ac-url-match-t\" style=\"color:var(--text)\"\u003e\n    \u003ctitle id=\"ac-url-match-t\"\u003e同一個網址在 proxy 與網站程式各被解析成什麼：/console 被 proxy 規則擋下；/Console、/console/、/console.anything 在 proxy 比對不到規則而放行，網站程式卻都當成 /console 處理，其中 .anything 後綴是換成舊版 Spring 時的後綴比對。網址以虛線框和底色標示為使用者可控的部分\u003c/title\u003e\n    \u003cdefs\u003e\n      \u003cmarker id=\"ac-url-match-a\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"\u003e\n        \u003cpath d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\"/\u003e\n      \u003c/marker\u003e\n    \u003c/defs\u003e\n    \u003ctext x=\"20\" y=\"22\" font-size=\"12.5\" text-anchor=\"start\" fill=\"currentColor\" font-weight=\"700\"\u003e送出的網址\u003c/text\u003e\u003ctext x=\"300\" y=\"22\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003eproxy 比對 /console 規則\u003c/text\u003e\u003ctext x=\"528\" y=\"22\" font-size=\"12.5\" text-anchor=\"start\" fill=\"currentColor\" font-weight=\"700\"\u003e網站程式處理成\u003c/text\u003e\u003crect x=\"10\" y=\"40\" width=\"190\" height=\"36\" rx=\"8\" fill=\"var(--accent-soft)\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/\u003e\u003ctext x=\"105\" y=\"63\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\" style=\"font-family:var(--font-mono)\"\u003e/console\u003c/text\u003e\u003cpath d=\"M202 58 H238\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-url-match-a)\"/\u003e\u003crect x=\"240\" y=\"40\" width=\"120\" height=\"36\" rx=\"8\" fill=\"var(--warning-bg)\" stroke=\"var(--warning)\" stroke-width=\"1.4\"/\u003e\u003ctext x=\"300\" y=\"63\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e擋下\u003c/text\u003e\u003ctext x=\"380\" y=\"63\" font-size=\"12.5\" text-anchor=\"start\" fill=\"currentColor\"\u003e（不再往後送）\u003c/text\u003e\u003crect x=\"10\" y=\"92\" width=\"190\" height=\"36\" rx=\"8\" fill=\"var(--accent-soft)\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/\u003e\u003ctext x=\"105\" y=\"115\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\" style=\"font-family:var(--font-mono)\"\u003e/Console\u003c/text\u003e\u003cpath d=\"M202 110 H238\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-url-match-a)\"/\u003e\u003crect x=\"240\" y=\"92\" width=\"120\" height=\"36\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"300\" y=\"115\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e比對不到，放行\u003c/text\u003e\u003cpath d=\"M362 110 H518\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-url-match-a)\"/\u003e\u003ctext x=\"528\" y=\"108\" font-size=\"12.5\" text-anchor=\"start\" fill=\"currentColor\" font-weight=\"700\" style=\"font-family:var(--font-mono)\"\u003e/console\u003c/text\u003e\u003crect x=\"10\" y=\"144\" width=\"190\" height=\"36\" rx=\"8\" fill=\"var(--accent-soft)\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/\u003e\u003ctext x=\"105\" y=\"167\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\" style=\"font-family:var(--font-mono)\"\u003e/console/\u003c/text\u003e\u003cpath d=\"M202 162 H238\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-url-match-a)\"/\u003e\u003crect x=\"240\" y=\"144\" width=\"120\" height=\"36\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"300\" y=\"167\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e比對不到，放行\u003c/text\u003e\u003cpath d=\"M362 162 H518\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-url-match-a)\"/\u003e\u003ctext x=\"528\" y=\"160\" font-size=\"12.5\" text-anchor=\"start\" fill=\"currentColor\" font-weight=\"700\" style=\"font-family:var(--font-mono)\"\u003e/console\u003c/text\u003e\u003crect x=\"10\" y=\"196\" width=\"190\" height=\"36\" rx=\"8\" fill=\"var(--accent-soft)\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/\u003e\u003ctext x=\"105\" y=\"219\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\" style=\"font-family:var(--font-mono)\"\u003e/console.anything\u003c/text\u003e\u003cpath d=\"M202 214 H238\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-url-match-a)\"/\u003e\u003crect x=\"240\" y=\"196\" width=\"120\" height=\"36\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"300\" y=\"219\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e比對不到，放行\u003c/text\u003e\u003cpath d=\"M362 214 H518\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-url-match-a)\"/\u003e\u003ctext x=\"528\" y=\"212\" font-size=\"12.5\" text-anchor=\"start\" fill=\"currentColor\" font-weight=\"700\" style=\"font-family:var(--font-mono)\"\u003e/console\u003c/text\u003e\u003ctext x=\"528\" y=\"229\" font-size=\"12.5\" text-anchor=\"start\" fill=\"currentColor\"\u003e換成舊版 Spring 時的後綴比對\u003c/text\u003e\n    \u003cuse href=\"#legend-input\" x=\"10\" y=\"250\"/\u003e\n  \u003c/svg\u003e\n  \u003cfigcaption\u003e\u003cspan class=\"fig-num\"\u003e圖 3.2.8-2\u003c/span\u003e proxy 與網站程式對同一網址的判斷不同\u003c/figcaption\u003e\n\u003c/figure\u003e\n\n\u003cp\u003e最後一列是網站程式換成舊版 Java 框架 Spring 時的例子：Spring 在 5.3 以前預設會把帶後綴的網址（如 \u003ccode\u003e/console.anything\u003c/code\u003e）比對到 \u003ccode\u003e/console\u003c/code\u003e 的處理程式，5.3 起預設關閉。\u003c/p\u003e\n\u003cp\u003e第三種差異來自 method。規則寫成「某角色不得對某路徑用某 method」，例如不准 member 用 POST 呼叫升級使用者的功能（\u003ccode\u003e/console/promote\u003c/code\u003e）。規則只擋 POST，換成 GET 送同一個路徑，網站程式卻照樣處理：\u003c/p\u003e\n\u003cdiv class=\"rr\" id=\"ac-promote-rr\"\u003e\u003cdiv class=\"rr-pt\"\u003e以 POST 升級使用者\u003c/div\u003e\u003cdiv class=\"rr-frame\"\u003e\u003cdiv class=\"rr-pane rr-req\"\u003e\u003cdiv class=\"rr-ph\"\u003eRequest\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-method\"\u003ePOST\u003c/span\u003e \u003cspan class=\"tok-path\"\u003e/console/promote\u003c/span\u003e \u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eHost\u003c/span\u003e: \u003cspan class=\"tok-host\"\u003etickets.example.com\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eCookie\u003c/span\u003e: \u003cspan class=\"tok-attr\"\u003esession\u003c/span\u003e=\u003cspan class=\"tok-value\"\u003ea1b2…\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eContent-Type\u003c/span\u003e: application/x-www-form-urlencoded\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-param\"\u003eusername\u003c/span\u003e=\u003cspan class=\"tok-value\"\u003ealice\u003c/span\u003e\u0026amp;\u003cspan class=\"tok-param\"\u003eaction\u003c/span\u003e=\u003cspan class=\"tok-value\"\u003eupgrade\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003cdiv class=\"rr-pane rr-res\"\u003e\u003cdiv class=\"rr-ph\"\u003eResponse\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e \u003cspan class=\"tok-status\"\u003e403\u003c/span\u003e Forbidden\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cdiv class=\"rr rr-alt\" id=\"ac-promote-alt-rr\"\u003e\u003cdiv class=\"rr-pt\"\u003e改用 GET 送同一個路徑\u003c/div\u003e\u003cdiv class=\"rr-frame\"\u003e\u003cdiv class=\"rr-pane rr-req\"\u003e\u003cdiv class=\"rr-ph\"\u003eRequest\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-method\"\u003eGET\u003c/span\u003e \u003cspan class=\"tok-path\"\u003e/console/promote\u003c/span\u003e?\u003cspan class=\"tok-param\"\u003eusername\u003c/span\u003e=\u003cspan class=\"tok-value\"\u003ealice\u003c/span\u003e\u0026amp;\u003cspan class=\"tok-param\"\u003eaction\u003c/span\u003e=\u003cspan class=\"tok-value\"\u003eupgrade\u003c/span\u003e \u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eHost\u003c/span\u003e: \u003cspan class=\"tok-host\"\u003etickets.example.com\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eCookie\u003c/span\u003e: \u003cspan class=\"tok-attr\"\u003esession\u003c/span\u003e=\u003cspan class=\"tok-value\"\u003ea1b2…\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003cdiv class=\"rr-pane rr-res\"\u003e\u003cdiv class=\"rr-ph\"\u003eResponse\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e \u003cspan class=\"tok-status\"\u003e200\u003c/span\u003e OK\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eContent-Type\u003c/span\u003e: text/html\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-placeholder\"\u003e[alice 已升級為管理員]\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cp\u003eproxy 與網站程式對同一個請求的判斷不一致時，只差一處（header、網址寫法或 method）的兩個請求，proxy 會擋下一個、放行另一個，到了網站程式卻是同一個功能：被擋下的回應是 403，放行的回應是 200。換 method 這一種要成立，得先知道升級功能的請求格式（路徑與參數）。這些格式可能從網站的 JavaScript 得知，或在持有管理員帳號時，從管理員送出的請求看到。而網站程式不檢查角色，所以 alice 用自己的 session 送出同樣內容的 GET 請求，也會被執行。\u003c/p\u003e\n\n\u003caside class=\"practice\" aria-label=\"Lab 練習\"\u003e\n\u003cp\u003ePortSwigger Academy 的對應練習（主題頁 \u003ca href=\"https://portswigger.net/web-security/access-control\"\u003eAccess control vulnerabilities and privilege escalation\u003c/a\u003e）：\u003c/p\u003e\n\u003cul\u003e\n  \u003cli\u003e\u003ca href=\"https://portswigger.net/web-security/access-control/lab-url-based-access-control-can-be-circumvented\"\u003eURL-based access control can be circumvented\u003c/a\u003e：proxy 擋掉管理頁，網站程式卻接受 \u003ccode\u003eX-Original-URL\u003c/code\u003e，對應請求行與 header 路徑不同的例子。要觀察被擋與放行的兩個回應差在哪裡。用 \u003ccode\u003eX-Original-URL\u003c/code\u003e 改寫時，header 只放路徑，要帶的參數仍放在請求行的 query string。\u003c/li\u003e\n  \u003cli\u003e\u003ca href=\"https://portswigger.net/web-security/access-control/lab-method-based-access-control-can-be-circumvented\"\u003eMethod-based access control can be circumvented\u003c/a\u003e：存取控制依 method 判斷，對應 \u003ccode\u003ePOST\u003c/code\u003e 被擋、換 method 通過的例子。要觀察同一個路徑在不同 method 下的回應差別。\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/aside\u003e\n\n\u003ch2 id=\"flow-referer-location\"\u003e\u003cspan class=\"num\"\u003e3.2.9\u003c/span\u003e 多步驟流程、來源與地點檢查\u003c/h2\u003e\n\u003cp\u003e\u003ca href=\"#login-not-enough\"\u003e依狀態或流程\u003c/a\u003e的存取控制，例子是多步驟流程：管理員升級使用者要走三步：載入表單、送出要升級的使用者、確認。網站在前兩步檢查是不是管理員，確認那一步沒檢查。前兩步不必走，確認的請求可以直接送出。下圖標出三步的請求，與 alice 跳過前兩步的做法：\u003c/p\u003e\n\n\u003cfigure id=\"ac-multistep\"\u003e\n  \u003csvg viewBox=\"0 0 720 250\" role=\"img\" aria-labelledby=\"ac-multistep-t\" style=\"color:var(--text)\"\u003e\n    \u003ctitle id=\"ac-multistep-t\"\u003e多步驟流程：載入表單與送出兩步檢查是不是 admin，確認這一步沒有檢查；alice 跳過前兩步，直接送出確認\u003c/title\u003e\n    \u003cdefs\u003e\n      \u003cmarker id=\"ac-multistep-a\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"\u003e\n        \u003cpath d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\"/\u003e\n      \u003c/marker\u003e\n    \u003c/defs\u003e\n    \u003cuse href=\"#icon-admin\" x=\"0\" y=\"52\" width=\"36\" height=\"36\" style=\"color:var(--text)\"/\u003e\u003ctext x=\"22\" y=\"108\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003eadmin\u003c/text\u003e\u003ctext x=\"10\" y=\"22\" font-size=\"12.5\" text-anchor=\"start\" fill=\"currentColor\" font-weight=\"700\"\u003e正常流程\u003c/text\u003e\u003cpath d=\"M38 80 H52\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-multistep-a)\"/\u003e\u003crect x=\"54\" y=\"46\" width=\"170\" height=\"70\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003cuse href=\"#icon-lock\" x=\"60\" y=\"52\" width=\"22\" height=\"22\" style=\"color:var(--text)\"/\u003e\u003ctext x=\"139\" y=\"70\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e步驟一：載入表單\u003c/text\u003e\u003ctext x=\"139\" y=\"88\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003eGET /ops\u003c/text\u003e\u003ctext x=\"139\" y=\"106\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e檢查是不是 admin\u003c/text\u003e\u003cpath d=\"M226 80 H248\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-multistep-a)\"/\u003e\u003crect x=\"250\" y=\"46\" width=\"170\" height=\"70\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003cuse href=\"#icon-lock\" x=\"256\" y=\"52\" width=\"22\" height=\"22\" style=\"color:var(--text)\"/\u003e\u003ctext x=\"335\" y=\"70\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e步驟二：送出\u003c/text\u003e\u003ctext x=\"335\" y=\"88\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003ePOST /ops/upgrade\u003c/text\u003e\u003ctext x=\"335\" y=\"106\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e檢查是不是 admin\u003c/text\u003e\u003cpath d=\"M422 80 H444\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-multistep-a)\"/\u003e\u003crect x=\"446\" y=\"46\" width=\"214\" height=\"70\" rx=\"8\" fill=\"none\" stroke=\"var(--warning)\" stroke-width=\"1.6\" stroke-dasharray=\"5 3\"/\u003e\u003cuse href=\"#icon-unlock\" x=\"452\" y=\"52\" width=\"22\" height=\"22\" style=\"color:var(--text)\"/\u003e\u003ctext x=\"553\" y=\"70\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e步驟三：確認\u003c/text\u003e\u003ctext x=\"553\" y=\"88\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003ePOST /ops/upgrade/confirm\u003c/text\u003e\u003ctext x=\"553\" y=\"106\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e沒有檢查\u003c/text\u003e\u003cpath d=\"M662 80 H678\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-multistep-a)\"/\u003e\u003crect x=\"680\" y=\"56\" width=\"36\" height=\"48\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"698\" y=\"85\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e升級\u003c/text\u003e\u003cuse href=\"#icon-user\" x=\"4\" y=\"170\" width=\"44\" height=\"44\" style=\"color:var(--text)\"/\u003e\u003ctext x=\"26\" y=\"232\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003ealice\u003c/text\u003e\u003ctext x=\"10\" y=\"150\" font-size=\"12.5\" text-anchor=\"start\" fill=\"currentColor\" font-weight=\"700\"\u003ealice 直接送出最後一步\u003c/text\u003e\u003cpath d=\"M54 200 H553 V120\" fill=\"none\" stroke=\"var(--warning)\" stroke-width=\"1.6\" stroke-dasharray=\"5 4\" marker-end=\"url(#ac-multistep-a)\"/\u003e\u003crect x=\"230.0\" y=\"188.0\" width=\"160\" height=\"24\" rx=\"4\" fill=\"var(--surface)\"/\u003e\u003ctext x=\"310\" y=\"204\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e跳過步驟一與二\u003c/text\u003e\n    \u003c/svg\u003e\n  \u003cfigcaption\u003e\u003cspan class=\"fig-num\"\u003e圖 3.2.9-1\u003c/span\u003e 前兩步檢查權限，直接送出最後一步就繞過\u003c/figcaption\u003e\n\u003c/figure\u003e\n\n\u003cp\u003e第三步請求的路徑與欄位並不是秘密：可能從網站的 JavaScript 得知，或在持有管理員帳號時，從管理員走完三步送出的請求看到。網站對第三步只看請求內容、不查角色，所以 alice 帶著自己的 session 送出同樣的請求，也會被執行。請求帶著要升級的使用者與確認的旗標：\u003c/p\u003e\n\u003cdiv class=\"rr\" id=\"ac-confirm-rr\"\u003e\u003cdiv class=\"rr-pt\"\u003e直接送出確認那一步\u003c/div\u003e\u003cdiv class=\"rr-frame\"\u003e\u003cdiv class=\"rr-pane rr-req\"\u003e\u003cdiv class=\"rr-ph\"\u003eRequest\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-method\"\u003ePOST\u003c/span\u003e \u003cspan class=\"tok-path\"\u003e/ops/upgrade/confirm\u003c/span\u003e \u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eHost\u003c/span\u003e: \u003cspan class=\"tok-host\"\u003etickets.example.com\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eCookie\u003c/span\u003e: \u003cspan class=\"tok-attr\"\u003esession\u003c/span\u003e=\u003cspan class=\"tok-value\"\u003ea1b2…\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eContent-Type\u003c/span\u003e: application/x-www-form-urlencoded\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-param\"\u003eusername\u003c/span\u003e=\u003cspan class=\"tok-value\"\u003ealice\u003c/span\u003e\u0026amp;\u003cspan class=\"tok-param\"\u003econfirmed\u003c/span\u003e=\u003cspan class=\"tok-value\"\u003etrue\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003cdiv class=\"rr-pane rr-res\"\u003e\u003cdiv class=\"rr-ph\"\u003eResponse\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e \u003cspan class=\"tok-status\"\u003e200\u003c/span\u003e OK\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eContent-Type\u003c/span\u003e: text/html\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-placeholder\"\u003e[alice 已升級為管理員]\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n\n\u003cp\u003e每一步都是獨立的請求。伺服器若沒有記錄你走到哪一步，每個請求就只能各自判斷，確認那一步沒檢查，誰都送得出去。業務邏輯上的流程順序問題留到 \u003ca href=\"../../logic-timing/business-logic/index.html\"\u003e業務邏輯\u003c/a\u003e一節。\u003c/p\u003e\n\u003cp\u003e另一種是 Referer-based：伺服器看 \u003ccode\u003eReferer\u003c/code\u003e header 判斷請求從哪裡來。Referer 是瀏覽器自動帶的 header，記錄你是從哪個頁面送出這個請求。匯出資料的管理功能只檢查 Referer 是不是來自管理頁。但這個 header 由發出請求的人決定，所以自己填一個管理頁的網址就通過了：\u003c/p\u003e\n\u003cdiv class=\"rr\" id=\"ac-referer-rr\"\u003e\u003cdiv class=\"rr-pt\"\u003e沒有帶管理頁的 Referer\u003c/div\u003e\u003cdiv class=\"rr-frame\"\u003e\u003cdiv class=\"rr-pane rr-req\"\u003e\u003cdiv class=\"rr-ph\"\u003eRequest\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-method\"\u003ePOST\u003c/span\u003e \u003cspan class=\"tok-path\"\u003e/ops/export\u003c/span\u003e \u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eHost\u003c/span\u003e: \u003cspan class=\"tok-host\"\u003etickets.example.com\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eCookie\u003c/span\u003e: \u003cspan class=\"tok-attr\"\u003esession\u003c/span\u003e=\u003cspan class=\"tok-value\"\u003ea1b2…\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003cdiv class=\"rr-pane rr-res\"\u003e\u003cdiv class=\"rr-ph\"\u003eResponse\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e \u003cspan class=\"tok-status\"\u003e403\u003c/span\u003e Forbidden\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cdiv class=\"rr rr-alt\" id=\"ac-referer-alt-rr\"\u003e\u003cdiv class=\"rr-pt\"\u003eReferer 被改成管理頁網址\u003c/div\u003e\u003cdiv class=\"rr-frame\"\u003e\u003cdiv class=\"rr-pane rr-req\"\u003e\u003cdiv class=\"rr-ph\"\u003eRequest\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-method\"\u003ePOST\u003c/span\u003e \u003cspan class=\"tok-path\"\u003e/ops/export\u003c/span\u003e \u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eHost\u003c/span\u003e: \u003cspan class=\"tok-host\"\u003etickets.example.com\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eCookie\u003c/span\u003e: \u003cspan class=\"tok-attr\"\u003esession\u003c/span\u003e=\u003cspan class=\"tok-value\"\u003ea1b2…\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eReferer\u003c/span\u003e: \u003cspan class=\"tok-scheme\"\u003ehttps\u003c/span\u003e://\u003cspan class=\"tok-host\"\u003etickets.example.com\u003c/span\u003e\u003cspan class=\"tok-path\"\u003e/ops\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003cdiv class=\"rr-pane rr-res\"\u003e\u003cdiv class=\"rr-ph\"\u003eResponse\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e \u003cspan class=\"tok-status\"\u003e200\u003c/span\u003e OK\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eContent-Type\u003c/span\u003e: text/csv\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-placeholder\"\u003e[匯出的資料]\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cp\u003e再一種是 location-based：依地理位置限制，例如只開放某些地區。判斷依據是請求的來源位置，而使用者能改變它：經過代理伺服器或 VPN（virtual private network，虛擬私人網路；都是使用者自己用來轉送連線、改變來源 IP 的服務），伺服器看到的來源就是出口的位置；網站若依用戶端回報的定位判斷，使用者可以自行回報別的位置。\u003c/p\u003e\n\n\u003cfigure id=\"ac-location\"\u003e\n  \u003csvg viewBox=\"0 0 720 240\" role=\"img\" aria-labelledby=\"ac-location-t\" style=\"color:var(--text)\"\u003e\n    \u003ctitle id=\"ac-location-t\"\u003ealice 在不開放的地區 A 直接連線被拒絕；改經過代理伺服器或 VPN，伺服器看到的來源變成開放的地區 B 而放行\u003c/title\u003e\n    \u003cdefs\u003e\n      \u003cmarker id=\"ac-location-a\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"\u003e\n        \u003cpath d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\"/\u003e\n      \u003c/marker\u003e\n    \u003c/defs\u003e\n    \u003ctext x=\"10\" y=\"22\" font-size=\"12.5\" text-anchor=\"start\" fill=\"currentColor\" font-weight=\"700\"\u003e直接連線\u003c/text\u003e\u003cuse href=\"#icon-user\" x=\"10\" y=\"40\" width=\"44\" height=\"44\" style=\"color:var(--text)\"/\u003e\u003ctext x=\"32\" y=\"100\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003ealice\u003c/text\u003e\u003cpath d=\"M60 60 H398\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-location-a)\"/\u003e\u003ctext x=\"230\" y=\"52\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e來源：地區 A\u003c/text\u003e\u003crect x=\"400\" y=\"30\" width=\"170\" height=\"60\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003cuse href=\"#icon-server\" x=\"406\" y=\"40\" width=\"36\" height=\"36\" style=\"color:var(--text)\"/\u003e\u003ctext x=\"510\" y=\"58\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e依來源地區判斷\u003c/text\u003e\u003ctext x=\"510\" y=\"76\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e只開放地區 B\u003c/text\u003e\u003cpath d=\"M572 60 H618\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-location-a)\"/\u003e\u003crect x=\"620\" y=\"40\" width=\"90\" height=\"40\" rx=\"8\" fill=\"var(--warning-bg)\" stroke=\"var(--warning)\" stroke-width=\"1.4\"/\u003e\u003ctext x=\"665\" y=\"65\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e拒絕\u003c/text\u003e\u003ctext x=\"10\" y=\"132\" font-size=\"12.5\" text-anchor=\"start\" fill=\"currentColor\" font-weight=\"700\"\u003e經過代理伺服器或 VPN\u003c/text\u003e\u003cuse href=\"#icon-user\" x=\"10\" y=\"150\" width=\"44\" height=\"44\" style=\"color:var(--text)\"/\u003e\u003ctext x=\"32\" y=\"210\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003ealice\u003c/text\u003e\u003cpath d=\"M60 170 H178\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-location-a)\"/\u003e\u003crect x=\"180\" y=\"144\" width=\"130\" height=\"52\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003cuse href=\"#icon-proxy\" x=\"186\" y=\"154\" width=\"32\" height=\"32\" style=\"color:var(--text)\"/\u003e\u003ctext x=\"262\" y=\"176\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e代理伺服器\u003c/text\u003e\u003cpath d=\"M312 170 H398\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-location-a)\"/\u003e\u003ctext x=\"355\" y=\"162\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e來源：地區 B\u003c/text\u003e\u003crect x=\"400\" y=\"140\" width=\"170\" height=\"60\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003cuse href=\"#icon-server\" x=\"406\" y=\"150\" width=\"36\" height=\"36\" style=\"color:var(--text)\"/\u003e\u003ctext x=\"510\" y=\"168\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e依來源地區判斷\u003c/text\u003e\u003ctext x=\"510\" y=\"186\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e只開放地區 B\u003c/text\u003e\u003cpath d=\"M572 170 H618\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-location-a)\"/\u003e\u003crect x=\"620\" y=\"150\" width=\"90\" height=\"40\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"665\" y=\"175\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e放行\u003c/text\u003e\n    \n  \u003c/svg\u003e\n  \u003cfigcaption\u003e\u003cspan class=\"fig-num\"\u003e圖 3.2.9-2\u003c/span\u003e 依來源地區限制，經代理伺服器或 VPN 就換了伺服器看到的來源\u003c/figcaption\u003e\n\u003c/figure\u003e\n\n\u003caside class=\"practice\" aria-label=\"Lab 練習\"\u003e\n\u003cp\u003ePortSwigger Academy 的對應練習（主題頁 \u003ca href=\"https://portswigger.net/web-security/access-control\"\u003eAccess control vulnerabilities and privilege escalation\u003c/a\u003e）：\u003c/p\u003e\n\u003cul\u003e\n  \u003cli\u003e\u003ca href=\"https://portswigger.net/web-security/access-control/lab-multi-step-process-with-no-access-control-on-one-step\"\u003eMulti-step process with no access control on one step\u003c/a\u003e：多步驟的升級流程，只有部分步驟檢查，對應上面三步升級流程的例子。要觀察哪一個請求沒有權限檢查。這個 Lab 需要管理員帳號送出的確認請求作為樣本，換成一般帳號的 session 重送後觀察回應。\u003c/li\u003e\n  \u003cli\u003e\u003ca href=\"https://portswigger.net/web-security/access-control/lab-referer-based-access-control\"\u003eReferer-based access control\u003c/a\u003e：網站以 Referer 判斷請求來自管理頁，對應上面匯出資料功能的例子。要觀察移除或改寫 Referer 時回應的變化。這個 Lab 需要管理員帳號送出、帶管理頁 Referer 的請求作為樣本，換成一般帳號的 session 重送後觀察回應。\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/aside\u003e\n\n\u003caside class=\"next\" aria-label=\"下一節\"\u003e\n\u003cp\u003e本章的身分驗證與存取控制都靠 session 識別使用者。下一章談別的網站怎麼借用這個 session，第一節 \u003ca href=\"../../cross-site/csrf/index.html\"\u003eCross-Site Request Forgery (CSRF)\u003c/a\u003e 看別的網站怎麼讓你的瀏覽器在不知情下，帶著 session 送出請求。\u003c/p\u003e\n\u003c/aside\u003e\n"}]}</script>
