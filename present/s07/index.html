e=\"none\"/\u003e\u003ccircle cx=\"28.5\" cy=\"17\" r=\"1.9\" fill=\"currentColor\" stroke=\"none\"/\u003e\u003cpath d=\"M21 22.5q3.0 2.5 6 0\" stroke-width=\"2.2\"/\u003e\u003c/symbol\u003e\u003csymbol id=\"legend-input\" overflow=\"visible\"\u003e\u003crect width=\"26\" height=\"16\" rx=\"4\" fill=\"var(--accent-soft)\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/\u003e\u003ctext x=\"34\" y=\"13\" font-size=\"12\" fill=\"currentColor\"\u003e使用者輸入\u003c/text\u003e\u003c/symbol\u003e\u003c/svg\u003e\u003cp\u003e\u003cstrong\u003e本節模型\u003c/strong\u003e：tickets.example.com 的會員登入頁\u003c/p\u003e\n\u003cfigure id=\"auth-login-scene\"\u003e\n  \u003csvg viewBox=\"0 0 640 230\" role=\"img\" aria-labelledby=\"auth-login-scene-t\" style=\"color:var(--text)\"\u003e\n    \u003ctitle id=\"auth-login-scene-t\"\u003e你在登入頁填入帳號 alice 與密碼並按下登入，瀏覽器以 POST /login 送出；網站程式向資料庫查 alice 的資料並比對密碼，成功後以 302 回應加上 Set-Cookie 發下 session\u003c/title\u003e\n    \u003cdefs\u003e\u003cmarker id=\"auth-login-scene-ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"\u003e\u003cpath d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\n    \u003crect x=\"4\" y=\"30\" width=\"150\" height=\"150\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"79\" y=\"22\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e瀏覽器\u003c/text\u003e\n    \u003cuse href=\"#icon-browser\" x=\"59\" y=\"36\" width=\"40\" height=\"40\" style=\"color:var(--text)\"/\u003e\n    \u003crect x=\"16\" y=\"84\" width=\"126\" height=\"22\" rx=\"11\" fill=\"var(--accent-soft)\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/\u003e\n    \u003ctext x=\"79\" y=\"99\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\" style=\"font-family:var(--font-mono)\"\u003ealice\u003c/text\u003e\n    \u003crect x=\"16\" y=\"112\" width=\"126\" height=\"22\" rx=\"11\" fill=\"var(--accent-soft)\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/\u003e\n    \u003ctext x=\"79\" y=\"127\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\" style=\"font-family:var(--font-mono)\"\u003e[密碼]\u003c/text\u003e\n    \u003crect x=\"16\" y=\"142\" width=\"126\" height=\"24\" rx=\"12\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"79\" y=\"158\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e登入\u003c/text\u003e\n    \u003crect x=\"250\" y=\"30\" width=\"140\" height=\"150\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"320\" y=\"22\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e網站程式\u003c/text\u003e\n    \u003cuse href=\"#icon-server\" x=\"300\" y=\"60\" width=\"40\" height=\"40\" style=\"color:var(--text)\"/\u003e\n    \u003ctext x=\"320\" y=\"120\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e比對帳號與密碼\u003c/text\u003e\n    \u003ctext x=\"320\" y=\"138\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e建立 session\u003c/text\u003e\n    \u003crect x=\"486\" y=\"30\" width=\"140\" height=\"150\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"556\" y=\"22\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e資料庫\u003c/text\u003e\n    \u003cuse href=\"#icon-database\" x=\"536\" y=\"60\" width=\"40\" height=\"40\" style=\"color:var(--text)\"/\u003e\n    \u003ctext x=\"556\" y=\"120\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003eusers\u003c/text\u003e\n    \u003ctext x=\"556\" y=\"138\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003e7 alice\u003c/text\u003e\n    \u003cpath d=\"M156 78 H246\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-login-scene-ah)\"/\u003e\n    \u003ctext x=\"201\" y=\"70\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003e① POST /login\u003c/text\u003e\n    \u003cpath d=\"M392 78 H482\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-login-scene-ah)\"/\u003e\n    \u003ctext x=\"437\" y=\"70\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e② 查 alice\u003c/text\u003e\n    \u003cpath d=\"M482 128 H392\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-login-scene-ah)\"/\u003e\n    \u003ctext x=\"437\" y=\"120\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e③ 取回資料\u003c/text\u003e\n    \u003cpath d=\"M246 158 H156\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-login-scene-ah)\"/\u003e\n    \u003ctext x=\"201\" y=\"134\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003e④ 302\u003c/text\u003e\n    \u003ctext x=\"201\" y=\"148\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003e+ session\u003c/text\u003e\n    \u003cuse href=\"#icon-cookie\" x=\"176\" y=\"160\" width=\"22\" height=\"22\" style=\"color:var(--text)\"/\u003e\n    \u003cuse href=\"#legend-input\" x=\"250\" y=\"206\"/\u003e\n  \u003c/svg\u003e\n  \u003cfigcaption\u003e\u003cspan class=\"fig-num\"\u003e圖 3.1.0-1\u003c/span\u003e 帳號與密碼送出、伺服器對照資料庫、換回 session Cookie 的四個步驟\u003c/figcaption\u003e\n\u003c/figure\u003e\n\u003cp\u003e你填好帳號與密碼按下登入，瀏覽器把兩個值放進 POST 請求送出：\u003c/p\u003e\n\u003cdiv class=\"rr\"\u003e\u003cdiv class=\"rr-frame\"\u003e\u003cdiv class=\"rr-pane rr-req\"\u003e\u003cdiv class=\"rr-ph\"\u003eRequest\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-method\"\u003ePOST\u003c/span\u003e \u003cspan class=\"tok-path\"\u003e/login\u003c/span\u003e \u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eHost\u003c/span\u003e: \u003cspan class=\"tok-host\"\u003etickets.example.com\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eContent-Type\u003c/span\u003e: application/x-www-form-urlencoded\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-param\"\u003eusername\u003c/span\u003e=\u003cspan class=\"tok-value\"\u003ealice\u003c/span\u003e\u0026amp;\u003cspan class=\"tok-param\"\u003epassword\u003c/span\u003e=\u003cspan class=\"tok-placeholder\"\u003e[密碼]\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003cdiv class=\"rr-pane rr-res\"\u003e\u003cdiv class=\"rr-ph\"\u003eResponse\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e \u003cspan class=\"tok-status\"\u003e302\u003c/span\u003e Found\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eLocation\u003c/span\u003e: \u003cspan class=\"tok-path\"\u003e/account\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eSet-Cookie\u003c/span\u003e: \u003cspan class=\"tok-attr\"\u003esession\u003c/span\u003e=\u003cspan class=\"tok-value\"\u003ea1b2…\u003c/span\u003e; \u003cspan class=\"tok-attr\"\u003eHttpOnly\u003c/span\u003e; \u003cspan class=\"tok-attr\"\u003eSecure\u003c/span\u003e; \u003cspan class=\"tok-attr\"\u003eSameSite\u003c/span\u003e=\u003cspan class=\"tok-value\"\u003eLax\u003c/span\u003e; \u003cspan class=\"tok-attr\"\u003ePath\u003c/span\u003e=\u003cspan class=\"tok-value\"\u003e/\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cp\u003e回應是 302 而不是直接顯示頁面：\u003ccode\u003eLocation\u003c/code\u003e 把瀏覽器帶去帳號頁，\u003ccode\u003eSet-Cookie\u003c/code\u003e 發下的 \u003ccode\u003esession\u003c/code\u003e 是之後的通行證。之後每個請求都帶著它，伺服器靠它認出你是 alice，見 \u003ca href=\"../../web-http/http-session/index.html\"\u003eCookie 與 Session\u003c/a\u003e。\u003c/p\u003e\n\u003ch2 id=\"auth-vs-authz\"\u003e\u003cspan class=\"num\"\u003e3.1.1\u003c/span\u003e 身分驗證與授權的分別\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003e身分驗證\u003c/strong\u003e（authentication）是網站確認送來請求的人確實是某個帳號的持有人；\u003cstrong\u003e授權\u003c/strong\u003e（authorization）是知道帳號之後，網站再決定這個帳號能不能讀這筆資料、做這個動作。兩件事依序發生，各自會出問題；授權在下一節 \u003ca href=\"../access-control/index.html#login-not-enough\"\u003eAccess Control\u003c/a\u003e。\u003c/p\u003e\n\u003cp\u003e網站驗證身分的依據可分為三類：所知之事（Something you know）、所持之物（Something you have）、所具之形（Something you are）。下圖左側各配一個例子，右側是一個請求依序經過的兩道檢查：\u003c/p\u003e\n\u003cfigure id=\"auth-factors\"\u003e\n  \u003csvg viewBox=\"0 0 640 222\" role=\"img\" aria-labelledby=\"auth-factors-t\" style=\"color:var(--text)\"\u003e\n    \u003ctitle id=\"auth-factors-t\"\u003e三類驗證因素：所知之事配密碼、所持之物配手機、所具之形配指紋；右側是請求先通過身分驗證，再進入授權檢查，兩者之間有一條界線\u003c/title\u003e\n    \u003cdefs\u003e\u003cmarker id=\"auth-factors-ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"\u003e\u003cpath d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\n    \u003ctext x=\"89\" y=\"20\" font-size=\"12\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e三類驗證因素\u003c/text\u003e\n    \u003ctext x=\"500\" y=\"20\" font-size=\"12\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e一個請求的兩道檢查\u003c/text\u003e\n    \u003crect x=\"4\" y=\"30\" width=\"176\" height=\"54\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003cuse href=\"#icon-key\" x=\"12\" y=\"37\" width=\"40\" height=\"40\" style=\"color:var(--text)\"/\u003e\n    \u003ctext x=\"60\" y=\"53\" font-size=\"12\" text-anchor=\"start\" fill=\"currentColor\" font-weight=\"700\"\u003e所知之事\u003c/text\u003e\n    \u003ctext x=\"60\" y=\"72\" font-size=\"11\" text-anchor=\"start\" fill=\"currentColor\"\u003e密碼\u003c/text\u003e\n    \u003crect x=\"4\" y=\"92\" width=\"176\" height=\"54\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003cuse href=\"#icon-token\" x=\"12\" y=\"99\" width=\"40\" height=\"40\" style=\"color:var(--text)\"/\u003e\n    \u003ctext x=\"60\" y=\"115\" font-size=\"12\" text-anchor=\"start\" fill=\"currentColor\" font-weight=\"700\"\u003e所持之物\u003c/text\u003e\n    \u003ctext x=\"60\" y=\"134\" font-size=\"11\" text-anchor=\"start\" fill=\"currentColor\"\u003e手機的驗證碼\u003c/text\u003e\n    \u003crect x=\"4\" y=\"154\" width=\"176\" height=\"54\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003cuse href=\"#icon-eye\" x=\"12\" y=\"161\" width=\"40\" height=\"40\" style=\"color:var(--text)\"/\u003e\n    \u003ctext x=\"60\" y=\"177\" font-size=\"12\" text-anchor=\"start\" fill=\"currentColor\" font-weight=\"700\"\u003e所具之形\u003c/text\u003e\n    \u003ctext x=\"60\" y=\"196\" font-size=\"11\" text-anchor=\"start\" fill=\"currentColor\"\u003e指紋\u003c/text\u003e\n    \u003cuse href=\"#icon-browser\" x=\"204\" y=\"90\" width=\"36\" height=\"36\" style=\"color:var(--text)\"/\u003e\n    \u003ctext x=\"222\" y=\"140\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e請求\u003c/text\u003e\n    \u003crect x=\"268\" y=\"70\" width=\"110\" height=\"76\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"323\" y=\"98\" font-size=\"12\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e身分驗證\u003c/text\u003e\n    \u003ctext x=\"323\" y=\"117\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e確認是哪個帳號\u003c/text\u003e\n    \u003ctext x=\"323\" y=\"135\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e密碼、驗證碼\u003c/text\u003e\n    \u003crect x=\"480\" y=\"70\" width=\"110\" height=\"76\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"535\" y=\"98\" font-size=\"12\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e授權\u003c/text\u003e\n    \u003ctext x=\"535\" y=\"117\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e判斷能否執行\u003c/text\u003e\n    \u003ctext x=\"535\" y=\"135\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e下一節\u003c/text\u003e\n    \u003cpath d=\"M242 108 H264\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-factors-ah)\"/\u003e\n    \u003cpath d=\"M380 108 H476\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-factors-ah)\"/\u003e\n    \u003ctext x=\"404\" y=\"100\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e通過\u003c/text\u003e\n    \u003cline x1=\"440\" y1=\"50\" x2=\"440\" y2=\"170\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-dasharray=\"6 4\"/\u003e\n    \u003ctext x=\"440\" y=\"190\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e界線：已知身分\u003c/text\u003e\n    \u003cpath d=\"M592 108 H606\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-factors-ah)\"/\u003e\n    \u003cuse href=\"#icon-check\" x=\"608\" y=\"90\" width=\"28\" height=\"28\" style=\"color:var(--text)\"/\u003e\n    \u003ctext x=\"622\" y=\"138\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e放行\u003c/text\u003e\n  \u003c/svg\u003e\n  \u003cfigcaption\u003e\u003cspan class=\"fig-num\"\u003e圖 3.1.1-1\u003c/span\u003e 三類因素，以及身分驗證與授權之間的界線\u003c/figcaption\u003e\n\u003c/figure\u003e\n\u003cp\u003e所知之事還包括安全問題的答案，所持之物包括驗證器 App 與實體金鑰，所具之形是指紋、臉部等生物特徵。\u003c/p\u003e\n\u003cp\u003e登入漏洞有兩個來源。一是機制本身弱：密碼可以被一直猜、猜的時候又得到線索。二是實作有邏輯缺陷：流程設計出一條不必通過驗證的路。帳號一旦被攻破，後果取決於那個帳號：一般會員的帳號讓你看到他的訂單與個人資料；管理員的帳號則連同後台功能一起交出去，也讓你站進內部才看得到的攻擊面。\u003c/p\u003e\n\u003cp\u003e用第三方帳號登入的流程在 \u003ca href=\"../../delegated-identity/oauth/index.html\"\u003eOAuth\u003c/a\u003e。\u003c/p\u003e\n\u003ch2 id=\"brute-force\"\u003e\u003cspan class=\"num\"\u003e3.1.2\u003c/span\u003e 暴力猜測帳號與密碼\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003e暴力猜測\u003c/strong\u003e（brute force）是用程式一個個試帳號或密碼，直到登入成功。從所有字元組合窮舉太慢，實際有效的做法是猜得準：先推出帳號的格式，再照人的習慣猜密碼。被猜的對象是 tickets.example.com 的一般會員，例如 bob 或 carol。\u003c/p\u003e\n\u003cfigure id=\"auth-guess\"\u003e\n  \u003csvg viewBox=\"0 0 640 212\" role=\"img\" aria-labelledby=\"auth-guess-t\" style=\"color:var(--text)\"\u003e\n    \u003ctitle id=\"auth-guess-t\"\u003e你用程式對登入頁逐一送出候選密碼，目標是 bob；未命中回 401，命中回 302 並發下 session，未命中時換下一個候選繼續\u003c/title\u003e\n    \u003cdefs\u003e\u003cmarker id=\"auth-guess-ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"\u003e\u003cpath d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\n    \u003cuse href=\"#icon-attacker\" x=\"8\" y=\"60\" width=\"44\" height=\"44\" style=\"color:var(--text)\"/\u003e\n    \u003ctext x=\"30\" y=\"118\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e你\u003c/text\u003e\n    \u003crect x=\"100\" y=\"40\" width=\"120\" height=\"90\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"160\" y=\"32\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e自動送出\u003c/text\u003e\n    \u003ctext x=\"160\" y=\"66\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e逐一送出\u003c/text\u003e\n    \u003crect x=\"112\" y=\"76\" width=\"96\" height=\"20\" rx=\"10\" fill=\"var(--accent-soft)\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/\u003e\n    \u003ctext x=\"160\" y=\"90\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\" style=\"font-family:var(--font-mono)\"\u003e[候選密碼]\u003c/text\u003e\n    \u003ctext x=\"160\" y=\"116\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e重複到命中\u003c/text\u003e\n    \u003crect x=\"280\" y=\"40\" width=\"120\" height=\"90\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"340\" y=\"32\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e登入頁\u003c/text\u003e\n    \u003cuse href=\"#icon-server\" x=\"320\" y=\"52\" width=\"40\" height=\"40\" style=\"color:var(--text)\"/\u003e\n    \u003ctext x=\"340\" y=\"108\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003ebob\u003c/text\u003e\n    \u003ctext x=\"340\" y=\"122\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003ePOST /login\u003c/text\u003e\n    \u003crect x=\"470\" y=\"30\" width=\"160\" height=\"50\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"550\" y=\"50\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003e未命中：401\u003c/text\u003e\n    \u003ctext x=\"550\" y=\"68\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e密碼錯誤\u003c/text\u003e\n    \u003crect x=\"470\" y=\"96\" width=\"160\" height=\"50\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/\u003e\n    \u003ctext x=\"550\" y=\"116\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\" style=\"font-family:var(--font-mono)\"\u003e命中：302\u003c/text\u003e\n    \u003ctext x=\"550\" y=\"134\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003eSet-Cookie: session\u003c/text\u003e\n    \u003cpath d=\"M54 90 H96\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-guess-ah)\"/\u003e\n    \u003cpath d=\"M222 90 H276\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-guess-ah)\"/\u003e\n    \u003cpath d=\"M402 70 H466\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-guess-ah)\"/\u003e\n    \u003cpath d=\"M402 110 H466\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-guess-ah)\"/\u003e\n    \u003cpath d=\"M160 134 V160 H500 V150\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\" marker-end=\"url(#auth-guess-ah)\"/\u003e\n    \u003ctext x=\"330\" y=\"176\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e依回應判斷，未命中就換下一個候選\u003c/text\u003e\n    \u003cuse href=\"#legend-input\" x=\"8\" y=\"188\"/\u003e\n  \u003c/svg\u003e\n  \u003cfigcaption\u003e\u003cspan class=\"fig-num\"\u003e圖 3.1.2-1\u003c/span\u003e 程式逐一送出猜測，從回應的差異判斷是否命中 bob\u003c/figcaption\u003e\n\u003c/figure\u003e\n\u003cp\u003e逐一送出候選值通常交給程式自動做。送得越多就越慢，也越容易被網站擋下，所以候選清單越準越好。命中的回應和其他不同，狀態碼與長度都可以拿來比。\u003c/p\u003e\n\u003ch3 id=\"username-format\"\u003e帳號有固定格式\u003c/h3\u003e\n\u003cp\u003e網站的帳號常依同一種規則產生：英文名字加生日（例如 alice0315），或 email 的前綴；管理帳號幾乎一定有，名字叫 admin 之類。要推格式，先看網站公開的資料：個人檔頁、留言者名稱，以及 HTTP 回應裡出現的 email。在 tickets.example.com，bob 的公開個人檔頁列出 \u003ccode\u003ebob@tickets.example.com\u003c/code\u003e，\u003ccode\u003e@\u003c/code\u003e 之前就是帳號。公開個人檔頁顯示的名稱也可能就是登入名稱，留言者名稱、個人檔頁列出的名字都能直接當候選帳號。\u003c/p\u003e\n\u003ch3 id=\"password-habits\"\u003e密碼靠習慣猜\u003c/h3\u003e\n\u003cp\u003e密碼政策（至少 8 字元、要有大小寫與數字）逼使用者符合規則，他們會用最省力的方式：常見的詞開頭大寫、結尾加個數字。定期更換密碼更糟：使用者只改一個字元，\u003ccode\u003ePassword1\u003c/code\u003e 變 \u003ccode\u003ePassword2\u003c/code\u003e。知道一個舊密碼，下一個就很好猜。\u003c/p\u003e\n\u003cfigure id=\"auth-patterns\" class=\"tsplit\"\u003e\n  \u003cdiv class=\"ts-row\"\u003e\u003cspan class=\"ts-name\"\u003e帳號格式\u003c/span\u003e\u003cdiv class=\"ts-line\"\u003e\u003cspan class=\"ts-seg ts-ph\" data-label=\"英文名\"\u003e[英文名]\u003c/span\u003e\u003cspan class=\"ts-seg ts-ph\" data-label=\"月日四碼\"\u003e[生日]\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\n  \u003cdiv class=\"ts-row\"\u003e\u003cspan class=\"ts-name\"\u003e管理帳號\u003c/span\u003e\u003cdiv class=\"ts-line\"\u003e\u003cspan class=\"ts-seg\" data-label=\"固定名稱\"\u003eadmin\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\n  \u003cdiv class=\"ts-row\"\u003e\u003cspan class=\"ts-name\"\u003e密碼變形\u003c/span\u003e\u003cdiv class=\"ts-line\"\u003e\u003cspan class=\"ts-seg\" data-label=\"常見詞\"\u003ePassword\u003c/span\u003e\u003cspan class=\"ts-seg\" data-label=\"數字\"\u003e1\u003c/span\u003e\u003cspan class=\"ts-seg\"\u003e→\u003c/span\u003e\u003cspan class=\"ts-seg\" data-label=\"常見詞\"\u003ePassword\u003c/span\u003e\u003cspan class=\"ts-seg\" data-label=\"只改一格\"\u003e2\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\n  \u003cfigcaption\u003e\u003cspan class=\"fig-num\"\u003e圖 3.1.2-2\u003c/span\u003e 可預測的帳號格式與密碼變形，把猜測範圍縮到幾個位置\u003c/figcaption\u003e\n\u003c/figure\u003e\n\u003cp\u003e用公開資料推出格式，照這個格式產生候選帳號，再搭配一份常見密碼清單，範圍就從所有字元組合縮成一份短得多的清單。\u003c/p\u003e\n\u003ch2 id=\"enumeration\"\u003e\u003cspan class=\"num\"\u003e3.1.3\u003c/span\u003e 從登入回應判斷帳號是否存在\u003c/h2\u003e\n\u003cp\u003e猜密碼前，先確認帳號存在，工作量差很多。\u003cstrong\u003e使用者名稱列舉\u003c/strong\u003e（username enumeration）就是從登入頁的回應差異，判斷哪些帳號真的存在。差異有三種來源：狀態碼、錯誤訊息（連一個字元的差別都算）、回應時間（存在的帳號要多做一次密碼比對）。\u003c/p\u003e\n\u003cfigure id=\"auth-enum\"\u003e\n  \u003csvg viewBox=\"0 0 640 182\" role=\"img\" aria-labelledby=\"auth-enum-t\" style=\"color:var(--text)\"\u003e\n    \u003ctitle id=\"auth-enum-t\"\u003e三種差異（狀態碼、錯誤訊息、回應時間）都能用來確認帳號存在；確認 bob 存在後，猜測範圍從帳號清單乘密碼清單縮小成 bob 乘密碼清單\u003c/title\u003e\n    \u003cdefs\u003e\u003cmarker id=\"auth-enum-ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"\u003e\u003cpath d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\n    \u003crect x=\"4\" y=\"14\" width=\"170\" height=\"44\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"89\" y=\"33\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e狀態碼\u003c/text\u003e\n    \u003ctext x=\"89\" y=\"49\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e200 與 401\u003c/text\u003e\n    \u003cpath d=\"M176 36 H236\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-enum-ah)\"/\u003e\n    \u003crect x=\"4\" y=\"70\" width=\"170\" height=\"44\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"89\" y=\"89\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e錯誤訊息\u003c/text\u003e\n    \u003ctext x=\"89\" y=\"105\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e文字差一個字元\u003c/text\u003e\n    \u003cpath d=\"M176 92 H236\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-enum-ah)\"/\u003e\n    \u003crect x=\"4\" y=\"126\" width=\"170\" height=\"44\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"89\" y=\"145\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e回應時間\u003c/text\u003e\n    \u003ctext x=\"89\" y=\"161\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e存在的帳號較久\u003c/text\u003e\n    \u003cpath d=\"M176 148 H236\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-enum-ah)\"/\u003e\n    \u003crect x=\"240\" y=\"40\" width=\"130\" height=\"100\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003cuse href=\"#icon-check\" x=\"285\" y=\"48\" width=\"36\" height=\"36\" style=\"color:var(--text)\"/\u003e\n    \u003ctext x=\"305\" y=\"100\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e確認帳號存在\u003c/text\u003e\n    \u003ctext x=\"305\" y=\"118\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003ebob 存在\u003c/text\u003e\n    \u003cpath d=\"M372 90 H430\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-enum-ah)\"/\u003e\n    \u003crect x=\"434\" y=\"14\" width=\"200\" height=\"60\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"534\" y=\"36\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e之前\u003c/text\u003e\n    \u003ctext x=\"534\" y=\"56\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e帳號清單 × 密碼清單\u003c/text\u003e\n    \u003crect x=\"434\" y=\"106\" width=\"200\" height=\"60\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"534\" y=\"128\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e之後\u003c/text\u003e\n    \u003ctext x=\"534\" y=\"148\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003ebob × 密碼清單\u003c/text\u003e\n    \u003cpath d=\"M534 76 V104\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-enum-ah)\"/\u003e\n  \u003c/svg\u003e\n  \u003cfigcaption\u003e\u003cspan class=\"fig-num\"\u003e圖 3.1.3-1\u003c/span\u003e 三種差異確認帳號後，暴力猜測的範圍縮到單一帳號\u003c/figcaption\u003e\n\u003c/figure\u003e\n\u003cp\u003e先看第一種和第二種。如果登入頁對不存在的帳號回 200 加「找不到此使用者」，對存在但密碼錯的 bob 回 401 加「密碼錯誤」，兩種回應就不一樣：\u003c/p\u003e\n\u003cdiv class=\"rr\"\u003e\u003cdiv class=\"rr-pt\"\u003e不存在的帳號\u003c/div\u003e\u003cdiv class=\"rr-frame\"\u003e\u003cdiv class=\"rr-pane rr-req\"\u003e\u003cdiv class=\"rr-ph\"\u003eRequest\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-method\"\u003ePOST\u003c/span\u003e \u003cspan class=\"tok-path\"\u003e/login\u003c/span\u003e \u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eHost\u003c/span\u003e: \u003cspan class=\"tok-host\"\u003etickets.example.com\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eContent-Type\u003c/span\u003e: application/x-www-form-urlencoded\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-param\"\u003eusername\u003c/span\u003e=\u003cspan class=\"tok-placeholder\"\u003e[不存在的帳號]\u003c/span\u003e\u0026amp;\u003cspan class=\"tok-param\"\u003epassword\u003c/span\u003e=\u003cspan class=\"tok-placeholder\"\u003e[密碼]\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003cdiv class=\"rr-pane rr-res\"\u003e\u003cdiv class=\"rr-ph\"\u003eResponse\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e \u003cspan class=\"tok-status\"\u003e200\u003c/span\u003e OK\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eContent-Type\u003c/span\u003e: text/html\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e找不到此使用者\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cdiv class=\"rr rr-alt\"\u003e\u003cdiv class=\"rr-pt\"\u003e存在的帳號，密碼錯誤\u003c/div\u003e\u003cdiv class=\"rr-frame\"\u003e\u003cdiv class=\"rr-pane rr-req\"\u003e\u003cdiv class=\"rr-ph\"\u003eRequest\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-method\"\u003ePOST\u003c/span\u003e \u003cspan class=\"tok-path\"\u003e/login\u003c/span\u003e \u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eHost\u003c/span\u003e: \u003cspan class=\"tok-host\"\u003etickets.example.com\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eContent-Type\u003c/span\u003e: application/x-www-form-urlencoded\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-param\"\u003eusername\u003c/span\u003e=\u003cspan class=\"tok-value\"\u003ebob\u003c/span\u003e\u0026amp;\u003cspan class=\"tok-param\"\u003epassword\u003c/span\u003e=\u003cspan class=\"tok-placeholder\"\u003e[錯誤的密碼]\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003cdiv class=\"rr-pane rr-res\"\u003e\u003cdiv class=\"rr-ph\"\u003eResponse\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e \u003cspan class=\"tok-status\"\u003e401\u003c/span\u003e Unauthorized\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eContent-Type\u003c/span\u003e: text/html\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e密碼錯誤\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cfigure id=\"auth-enum-shots\" class=\"shot shot-pair\"\u003e\n\u003cdiv class=\"shot-cell\"\u003e\u003cimg src=\"../../assets/shots/authentication/login-no-user.png?v=261cde23\" alt=\"登入頁，帳號 nobody，下方訊息「找不到此使用者」\" width=\"341\" height=\"405\"\u003e\u003cspan class=\"shot-label\"\u003e不存在的帳號\u003c/span\u003e\u003c/div\u003e\n\u003cdiv class=\"shot-cell\"\u003e\u003cimg src=\"../../assets/shots/authentication/login-wrong-password.png?v=dd3cb286\" alt=\"登入頁，帳號 bob，下方訊息「密碼錯誤」\" width=\"341\" height=\"405\"\u003e\u003cspan class=\"shot-label\"\u003e存在的帳號、密碼錯\u003c/span\u003e\u003c/div\u003e\n\u003cfigcaption\u003e\u003cspan class=\"fig-num\"\u003e圖 3.1.3-2\u003c/span\u003e 兩種情況的登入頁，訊息不同\u003c/figcaption\u003e\n\u003c/figure\u003e\n\u003cp\u003e比對方法與 \u003ca href=\"../../web-http/information-disclosure/index.html\"\u003e資訊揭露\u003c/a\u003e「怎麼有系統地找出洩漏」那一節一樣：以一個對照組的回應為基準，其他請求只改帳號，逐項比狀態碼、長度與時間。\u003c/p\u003e\n\u003cp\u003e差異可以很細。如果登入頁對兩種情況都顯示「帳號或密碼錯誤」，只有密碼錯的那種句末多一個句號，肉眼很容易漏看，但用程式比對回應本體裡的字串，就抓得到這種差異。\u003c/p\u003e\n\u003cfigure id=\"auth-enum-dot\" class=\"shot shot-pair\"\u003e\n\u003cdiv class=\"shot-cell\"\u003e\u003cimg src=\"../../assets/shots/authentication/login-same-msg-no-user.png?v=12609741\" alt=\"登入頁的登入按鈕與下方訊息「帳號或密碼錯誤」，句末沒有句號\" width=\"283\" height=\"135\"\u003e\u003cspan class=\"shot-label\"\u003e不存在的帳號\u003c/span\u003e\u003c/div\u003e\n\u003cdiv class=\"shot-cell\"\u003e\u003cspan class=\"shot-frame\"\u003e\u003cimg src=\"../../assets/shots/authentication/login-same-msg-wrong-password.png?v=1b106ee8\" alt=\"登入頁的登入按鈕與下方訊息「帳號或密碼錯誤。」，句末多一個句號，以虛線框標出\" width=\"283\" height=\"135\"\u003e\u003cspan class=\"shot-mark\" style=\"left:55.5%;top:79.5%;width:5.7%;height:12.6%\"\u003e\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"shot-label\"\u003e存在的帳號、密碼錯\u003c/span\u003e\u003c/div\u003e\n\u003cfigcaption\u003e\u003cspan class=\"fig-num\"\u003e圖 3.1.3-3\u003c/span\u003e 兩邊訊息相同，只差句末一個句號（虛線框）\u003c/figcaption\u003e\n\u003c/figure\u003e\n\u003cp\u003e回應時間是第三種。如果登入頁的回應文字完全相同，但只有存在的帳號才會做密碼比對，存在的帳號耗時就較長。時間差很小時，送很長的密碼把比對的耗時放大，差距才看得出來。瀏覽器 DevTools 的 Network 分頁（或 Burp 的 HTTP history）會列出每個請求的耗時：\u003c/p\u003e\n\u003cfigure id=\"auth-timing\"\u003e\n  \u003csvg viewBox=\"0 0 640 204\" role=\"img\" aria-labelledby=\"auth-timing-t\" style=\"color:var(--text)\"\u003e\n    \u003ctitle id=\"auth-timing-t\"\u003e瀏覽器 DevTools Network 分頁的請求列表，四個 POST login 請求的狀態碼都是 200；不存在的帳號不論密碼長短都約 50 毫秒，bob 送短密碼 63 毫秒，送很長的密碼 412 毫秒\u003c/title\u003e\n    \u003crect x=\"4\" y=\"4\" width=\"632\" height=\"196\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003cline x1=\"4\" y1=\"34\" x2=\"636\" y2=\"34\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"16\" y=\"24\" font-size=\"13\" fill=\"currentColor\" font-weight=\"700\"\u003eName\u003c/text\u003e\n    \u003ctext x=\"100\" y=\"24\" font-size=\"13\" fill=\"currentColor\" font-weight=\"700\"\u003e請求內容\u003c/text\u003e\n    \u003ctext x=\"340\" y=\"24\" font-size=\"13\" fill=\"currentColor\" font-weight=\"700\"\u003eMethod\u003c/text\u003e\n    \u003ctext x=\"410\" y=\"24\" font-size=\"13\" fill=\"currentColor\" font-weight=\"700\"\u003eStatus\u003c/text\u003e\n    \u003ctext x=\"480\" y=\"24\" font-size=\"13\" fill=\"currentColor\" font-weight=\"700\"\u003eTime\u003c/text\u003e\n    \u003ctext x=\"560\" y=\"24\" font-size=\"13\" fill=\"currentColor\" font-weight=\"700\"\u003eWaterfall\u003c/text\u003e\n    \u003ctext x=\"16\" y=\"64\" font-size=\"13\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003elogin\u003c/text\u003e\n    \u003ctext x=\"100\" y=\"64\" font-size=\"13\" fill=\"currentColor\"\u003e不存在的帳號、短密碼\u003c/text\u003e\n    \u003ctext x=\"340\" y=\"64\" font-size=\"13\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003ePOST\u003c/text\u003e\n    \u003ctext x=\"410\" y=\"64\" font-size=\"13\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003e200\u003c/text\u003e\n    \u003ctext x=\"480\" y=\"64\" font-size=\"13\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003e48 ms\u003c/text\u003e\n    \u003crect x=\"560\" y=\"55\" width=\"8\" height=\"10\" rx=\"2\" fill=\"currentColor\" opacity=\".6\"/\u003e\n    \u003ctext x=\"16\" y=\"98\" font-size=\"13\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003elogin\u003c/text\u003e\n    \u003ctext x=\"100\" y=\"98\" font-size=\"13\" fill=\"currentColor\"\u003ebob、短密碼\u003c/text\u003e\n    \u003ctext x=\"340\" y=\"98\" font-size=\"13\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003ePOST\u003c/text\u003e\n    \u003ctext x=\"410\" y=\"98\" font-size=\"13\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003e200\u003c/text\u003e\n    \u003ctext x=\"480\" y=\"98\" font-size=\"13\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003e63 ms\u003c/text\u003e\n    \u003crect x=\"560\" y=\"89\" width=\"10\" height=\"10\" rx=\"2\" fill=\"currentColor\" opacity=\".6\"/\u003e\n    \u003ctext x=\"16\" y=\"132\" font-size=\"13\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003elogin\u003c/text\u003e\n    \u003ctext x=\"100\" y=\"132\" font-size=\"13\" fill=\"currentColor\"\u003e不存在的帳號、很長的密碼\u003c/text\u003e\n    \u003ctext x=\"340\" y=\"132\" font-size=\"13\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003ePOST\u003c/text\u003e\n    \u003ctext x=\"410\" y=\"132\" font-size=\"13\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003e200\u003c/text\u003e\n    \u003ctext x=\"480\" y=\"132\" font-size=\"13\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003e49 ms\u003c/text\u003e\n    \u003crect x=\"560\" y=\"123\" width=\"8\" height=\"10\" rx=\"2\" fill=\"currentColor\" opacity=\".6\"/\u003e\n    \u003crect x=\"10\" y=\"147\" width=\"620\" height=\"34\" rx=\"4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-dasharray=\"4 3\"/\u003e\n    \u003ctext x=\"16\" y=\"169\" font-size=\"13\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003elogin\u003c/text\u003e\n    \u003ctext x=\"100\" y=\"169\" font-size=\"13\" fill=\"currentColor\"\u003ebob、很長的密碼\u003c/text\u003e\n    \u003ctext x=\"340\" y=\"169\" font-size=\"13\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003ePOST\u003c/text\u003e\n    \u003ctext x=\"410\" y=\"169\" font-size=\"13\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003e200\u003c/text\u003e\n    \u003ctext x=\"480\" y=\"169\" font-size=\"13\" fill=\"currentColor\" font-weight=\"700\" style=\"font-family:var(--font-mono)\"\u003e412 ms\u003c/text\u003e\n    \u003crect x=\"560\" y=\"160\" width=\"68\" height=\"10\" rx=\"2\" fill=\"currentColor\" opacity=\".6\"/\u003e\n  \u003c/svg\u003e\n  \u003cfigcaption\u003e\u003cspan class=\"fig-num\"\u003e圖 3.1.3-4\u003c/span\u003e 四個登入請求的耗時：存在的帳號搭配很長的密碼，差距最明顯\u003c/figcaption\u003e\n\u003c/figure\u003e\n\u003cp\u003e註冊頁也是同一類洩漏。對已存在的帳號回「使用者名稱已被使用」，你不用登入就能逐個問網站這個帳號有沒有人用。\u003c/p\u003e\n\u003cfigure id=\"auth-register-taken\" class=\"shot\"\u003e\n\u003cimg src=\"../../assets/shots/authentication/register-taken.png?v=e372eb9e\" alt=\"註冊頁，使用者名稱 bob，下方訊息「使用者名稱已被使用」\" width=\"261\" height=\"494\"\u003e\n\u003cfigcaption\u003e\u003cspan class=\"fig-num\"\u003e圖 3.1.3-5\u003c/span\u003e 註冊已存在的帳號，頁面直接說名稱已被使用\u003c/figcaption\u003e\n\u003c/figure\u003e\n\u003caside class=\"practice\" aria-label=\"Lab 練習\"\u003e\n\u003cp\u003ePortSwigger Academy 的對應練習（主題頁 \u003ca href=\"https://portswigger.net/web-security/authentication\"\u003eAuthentication\u003c/a\u003e）：\u003c/p\u003e\n\u003cul\u003e\n  \u003cli\u003e\u003ca href=\"https://portswigger.net/web-security/authentication/password-based/lab-username-enumeration-via-different-responses\"\u003eUsername enumeration via different responses\u003c/a\u003e：對應上面錯誤訊息不同的例子：不存在的帳號與存在的 bob，回應不一樣。要觀察狀態碼與錯誤訊息，哪些帳號的回應與對照組不同，那些就是存在的帳號。\u003c/li\u003e\n  \u003cli\u003e\u003ca href=\"https://portswigger.net/web-security/authentication/password-based/lab-username-enumeration-via-subtly-different-responses\"\u003eUsername enumeration via subtly different responses\u003c/a\u003e：對應上面只差一個句號的例子：兩種情況的訊息只差句末一個句號。要觀察回應本體，畫面上不容易看出差異，要靠 Grep 條件（在回應本體裡找出或擷取指定字串）抓出字串的不同。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e這些 Lab 用 Burp Suite 的 Intruder 扮演「逐一送出候選值」的角色，工具本身在\u003ca href=\"../../web-http/information-disclosure/index.html\"\u003e資訊揭露\u003c/a\u003e那一節介紹過；Community 版 Intruder 有速度限制。Lab 用的\u003ca href=\"https://portswigger.net/web-security/authentication/auth-lab-usernames\"\u003e候選帳號清單\u003c/a\u003e與\u003ca href=\"https://portswigger.net/web-security/authentication/auth-lab-passwords\"\u003e候選密碼清單\u003c/a\u003e可在 Academy 取得。\u003c/p\u003e\n\u003c/aside\u003e\n\u003ch2 id=\"account-lock\"\u003e\u003cspan class=\"num\"\u003e3.1.4\u003c/span\u003e 帳號鎖定的漏洞\u003c/h2\u003e\n\u003cp\u003e常見的防護是帳號鎖定：同一個帳號連續失敗幾次，就暫時不讓它登入。如果登入頁的規則是連續失敗 3 次就鎖定 1 分鐘（之後自動解除），要注意這個做法只保護被鎖的那個帳號，所以有兩種猜法不碰門檻：\u003c/p\u003e\n\u003cul\u003e\n  \u003cli\u003e\u003cstrong\u003epassword spraying\u003c/strong\u003e（密碼噴灑）：少數幾個常見密碼，配許多帳號。每個帳號只失敗一兩次，計數器不到門檻。\u003c/li\u003e\n  \u003cli\u003e\u003cstrong\u003ecredential stuffing\u003c/strong\u003e（憑證填充）：拿其他網站外洩的帳號與密碼組合，每組只在這裡試一次。使用者在多個網站重複使用密碼，就有機會命中。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cfigure id=\"auth-lock-table\"\u003e\n  \u003csvg viewBox=\"0 0 640 184\" role=\"img\" aria-labelledby=\"auth-lock-table-t\" style=\"color:var(--text)\"\u003e\n    \u003ctitle id=\"auth-lock-table-t\"\u003e錯誤次數依帳號累計。暴力猜測把 3 次都用在 bob，bob 被鎖定；password spraying 與 credential stuffing 讓每個帳號各失敗一次，沒有帳號到達門檻 3\u003c/title\u003e\n    \u003cdefs\u003e\u003cmarker id=\"auth-lock-table-ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"\u003e\u003cpath d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\n    \u003ctext x=\"30\" y=\"20\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e帳號\u003c/text\u003e\n    \u003ctext x=\"150\" y=\"20\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e暴力猜測\u003c/text\u003e\n    \u003ctext x=\"300\" y=\"20\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003epassword spraying\u003c/text\u003e\n    \u003ctext x=\"470\" y=\"20\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003ecredential stuffing\u003c/text\u003e\n    \u003ctext x=\"590\" y=\"20\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e門檻 3\u003c/text\u003e\n    \u003crect x=\"4\" y=\"34\" width=\"56\" height=\"32\" rx=\"4\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"32\" y=\"55\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003ebob\u003c/text\u003e\n    \u003crect x=\"4\" y=\"74\" width=\"56\" height=\"32\" rx=\"4\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"32\" y=\"95\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003ecarol\u003c/text\u003e\n    \u003crect x=\"4\" y=\"114\" width=\"56\" height=\"32\" rx=\"4\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"32\" y=\"135\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003e[其他帳號]\u003c/text\u003e\n    \u003crect x=\"110\" y=\"34\" width=\"80\" height=\"32\" rx=\"4\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-dasharray=\"4 3\"/\u003e\n    \u003ctext x=\"150\" y=\"55\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\" style=\"font-family:var(--font-mono)\"\u003e3 鎖定\u003c/text\u003e\n    \u003crect x=\"110\" y=\"74\" width=\"80\" height=\"32\" rx=\"4\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"150\" y=\"95\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003e0\u003c/text\u003e\n    \u003crect x=\"110\" y=\"114\" width=\"80\" height=\"32\" rx=\"4\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"150\" y=\"135\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003e0\u003c/text\u003e\n    \u003crect x=\"260\" y=\"34\" width=\"80\" height=\"32\" rx=\"4\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"300\" y=\"55\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003e1\u003c/text\u003e\n    \u003crect x=\"260\" y=\"74\" width=\"80\" height=\"32\" rx=\"4\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"300\" y=\"95\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003e1\u003c/text\u003e\n    \u003crect x=\"260\" y=\"114\" width=\"80\" height=\"32\" rx=\"4\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"300\" y=\"135\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003e1\u003c/text\u003e\n    \u003crect x=\"430\" y=\"34\" width=\"80\" height=\"32\" rx=\"4\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"470\" y=\"55\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003e1\u003c/text\u003e\n    \u003crect x=\"430\" y=\"74\" width=\"80\" height=\"32\" rx=\"4\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"470\" y=\"95\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003e1\u003c/text\u003e\n    \u003crect x=\"430\" y=\"114\" width=\"80\" height=\"32\" rx=\"4\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"470\" y=\"135\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003e1\u003c/text\u003e\n    \u003ctext x=\"590\" y=\"100\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e只有 bob 到門檻\u003c/text\u003e\n    \u003ctext x=\"590\" y=\"116\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e其他格都沒到\u003c/text\u003e\n    \u003ctext x=\"320\" y=\"168\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e格內是各帳號累計的失敗次數；虛線框是被鎖定的格\u003c/text\u003e\n  \u003c/svg\u003e\n  \u003cfigcaption\u003e\u003cspan class=\"fig-num\"\u003e圖 3.1.4-1\u003c/span\u003e 依帳號計數時，三種猜法填進格子的方式不同\u003c/figcaption\u003e\n\u003c/figure\u003e\n\u003cp\u003e鎖定本身也是線索。被鎖的帳號一定存在，所以鎖定訊息成了另一種列舉：對一批候選帳號各送幾次錯誤密碼，哪個帳號出現鎖定訊息，哪個就存在。\u003c/p\u003e\n\u003cfigure id=\"auth-locked\" class=\"shot\"\u003e\n\u003cimg src=\"../../assets/shots/authentication/login-locked.png?v=d1a8605f\" alt=\"登入頁，帳號 bob，下方訊息「帳號已鎖定，請 1 分鐘後再試」\" width=\"301\" height=\"405\"\u003e\n\u003cfigcaption\u003e\u003cspan class=\"fig-num\"\u003e圖 3.1.4-2\u003c/span\u003e 連續輸入錯誤密碼後，登入頁顯示帳號已鎖定\u003c/figcaption\u003e\n\u003c/figure\u003e\n\u003cp\u003e鎖定期間還有一個差異：對錯誤密碼與對正確密碼，伺服器的回應不同。\u003c/p\u003e\n\u003cdiv class=\"rr\" id=\"lock-wrong-password\"\u003e\u003cdiv class=\"rr-pt\"\u003e鎖定期間，錯誤密碼\u003c/div\u003e\u003cdiv class=\"rr-frame\"\u003e\u003cdiv class=\"rr-pane rr-req\"\u003e\u003cdiv class=\"rr-ph\"\u003eRequest\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-method\"\u003ePOST\u003c/span\u003e \u003cspan class=\"tok-path\"\u003e/login\u003c/span\u003e \u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eHost\u003c/span\u003e: \u003cspan class=\"tok-host\"\u003etickets.example.com\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eContent-Type\u003c/span\u003e: application/x-www-form-urlencoded\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-param\"\u003eusername\u003c/span\u003e=\u003cspan class=\"tok-value\"\u003ebob\u003c/span\u003e\u0026amp;\u003cspan class=\"tok-param\"\u003epassword\u003c/span\u003e=\u003cspan class=\"tok-placeholder\"\u003e[錯誤的密碼]\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003cdiv class=\"rr-pane rr-res\"\u003e\u003cdiv class=\"rr-ph\"\u003eResponse\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e \u003cspan class=\"tok-status\"\u003e200\u003c/span\u003e OK\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eContent-Type\u003c/span\u003e: text/html\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e帳號已鎖定，請 1 分鐘後再試\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cdiv class=\"rr rr-alt\" id=\"lock-right-password\"\u003e\u003cdiv class=\"rr-pt\"\u003e鎖定期間，正確密碼\u003c/div\u003e\u003cdiv class=\"rr-frame\"\u003e\u003cdiv class=\"rr-pane rr-req\"\u003e\u003cdiv class=\"rr-ph\"\u003eRequest\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-method\"\u003ePOST\u003c/span\u003e \u003cspan class=\"tok-path\"\u003e/login\u003c/span\u003e \u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eHost\u003c/span\u003e: \u003cspan class=\"tok-host\"\u003etickets.example.com\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eContent-Type\u003c/span\u003e: application/x-www-form-urlencoded\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-param\"\u003eusername\u003c/span\u003e=\u003cspan class=\"tok-value\"\u003ebob\u003c/span\u003e\u0026amp;\u003cspan class=\"tok-param\"\u003epassword\u003c/span\u003e=\u003cspan class=\"tok-placeholder\"\u003e[正確的密碼]\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003cdiv class=\"rr-pane rr-res\"\u003e\u003cdiv class=\"rr-ph\"\u003eResponse\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e \u003cspan class=\"tok-status\"\u003e200\u003c/span\u003e OK\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eContent-Type\u003c/span\u003e: text/html\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e登入暫時無法使用\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cp\u003e兩種訊息不同，所以就算帳號鎖著，你仍能從回應判斷剛才送的密碼是不是對的。\u003c/p\u003e\n\u003cp\u003e封鎖解除的方式有三種：等一段時間、管理員手動解除、通過 CAPTCHA（要求辨認圖片或勾選方塊的人機驗證）。各有取捨：等時間最省事，卻讓猜測繼續；手動解除成本高；CAPTCHA 會打斷正常使用者。比起依帳號鎖定，依來源 IP 封鎖較不容易被拿來列舉帳號，也不會讓攻擊者靠故意輸錯就把別人的帳號鎖死。\u003c/p\u003e\n\u003caside class=\"practice\" aria-label=\"Lab 練習\"\u003e\n\u003cp\u003ePortSwigger Academy 的對應練習（主題頁 \u003ca href=\"https://portswigger.net/web-security/authentication\"\u003eAuthentication\u003c/a\u003e）：\u003c/p\u003e\n\u003cul\u003e\n  \u003cli\u003e\u003ca href=\"https://portswigger.net/web-security/authentication/password-based/lab-username-enumeration-via-account-lock\"\u003eUsername enumeration via account lock\u003c/a\u003e：對應上面鎖定訊息的例子：被鎖的帳號一定存在。要觀察對一批候選帳號各送幾次錯誤密碼後，哪個帳號的回應出現鎖定訊息。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eLab 用的\u003ca href=\"https://portswigger.net/web-security/authentication/auth-lab-usernames\"\u003e候選帳號清單\u003c/a\u003e與\u003ca href=\"https://portswigger.net/web-security/authentication/auth-lab-passwords\"\u003e候選密碼清單\u003c/a\u003e同樣可在 Academy 取得。\u003c/p\u003e\n\u003c/aside\u003e\n\u003ch2 id=\"rate-limiting\"\u003e\u003cspan class=\"num\"\u003e3.1.5\u003c/span\u003e 繞過登入限速\u003c/h2\u003e\n\u003cp\u003e限速是依來源 IP 計算失敗次數，不管帳號，一個 IP 連續失敗太多次就擋下來。這個做法的弱點在於「來源 IP」怎麼判定。如果登入頁依 \u003ccode\u003eX-Forwarded-For\u003c/code\u003e 這個請求 header 的值當作來源 IP，連續失敗 3 次封鎖 1 分鐘，但 header 的值是請求自己宣告的，可以隨意填。\u003c/p\u003e\n\u003cfigure id=\"auth-xff\"\u003e\n  \u003csvg viewBox=\"0 0 640 184\" role=\"img\" aria-labelledby=\"auth-xff-t\" style=\"color:var(--text)\"\u003e\n    \u003ctitle id=\"auth-xff-t\"\u003e你在每次登入請求加上不同的 X-Forwarded-For，伺服器把它當成來源 IP，計數器依這個偽造的 IP 分別累計，沒有一個 IP 到達門檻 3，限速因此失效\u003c/title\u003e\n    \u003cdefs\u003e\u003cmarker id=\"auth-xff-ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"\u003e\u003cpath d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\n    \u003cuse href=\"#icon-attacker\" x=\"4\" y=\"64\" width=\"44\" height=\"44\" style=\"color:var(--text)\"/\u003e\n    \u003crect x=\"84\" y=\"16\" width=\"196\" height=\"36\" rx=\"6\" fill=\"var(--accent-soft)\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/\u003e\n    \u003ctext x=\"182\" y=\"39\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\" style=\"font-family:var(--font-mono)\"\u003eX-Forwarded-For: [假 IP 甲]\u003c/text\u003e\n    \u003cpath d=\"M50 86 L82 34\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-xff-ah)\"/\u003e\n    \u003crect x=\"84\" y=\"68\" width=\"196\" height=\"36\" rx=\"6\" fill=\"var(--accent-soft)\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/\u003e\n    \u003ctext x=\"182\" y=\"91\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\" style=\"font-family:var(--font-mono)\"\u003eX-Forwarded-For: [假 IP 乙]\u003c/text\u003e\n    \u003cpath d=\"M50 86 L82 86\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-xff-ah)\"/\u003e\n    \u003crect x=\"84\" y=\"120\" width=\"196\" height=\"36\" rx=\"6\" fill=\"var(--accent-soft)\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/\u003e\n    \u003ctext x=\"182\" y=\"143\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\" style=\"font-family:var(--font-mono)\"\u003eX-Forwarded-For: [假 IP 丙]\u003c/text\u003e\n    \u003cpath d=\"M50 86 L82 138\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-xff-ah)\"/\u003e\n    \u003crect x=\"340\" y=\"10\" width=\"130\" height=\"160\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"405\" y=\"32\" font-size=\"12\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e限速計數器\u003c/text\u003e\n    \u003cuse href=\"#icon-server\" x=\"387\" y=\"40\" width=\"36\" height=\"36\" style=\"color:var(--text)\"/\u003e\n    \u003ctext x=\"405\" y=\"110\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003e[假 IP 甲]：1 次\u003c/text\u003e\n    \u003ctext x=\"405\" y=\"130\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003e[假 IP 乙]：1 次\u003c/text\u003e\n    \u003ctext x=\"405\" y=\"150\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003e[假 IP 丙]：1 次\u003c/text\u003e\n    \u003cpath d=\"M284 88 H336\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-xff-ah)\"/\u003e\n    \u003crect x=\"508\" y=\"40\" width=\"124\" height=\"100\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"570\" y=\"66\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e沒有一個 IP\u003c/text\u003e\n    \u003ctext x=\"570\" y=\"84\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e到達門檻 3\u003c/text\u003e\n    \u003ctext x=\"570\" y=\"112\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e登入照常嘗試\u003c/text\u003e\n    \u003cpath d=\"M472 90 H504\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-xff-ah)\"/\u003e\n  \u003c/svg\u003e\n  \u003cfigcaption\u003e\u003cspan class=\"fig-num\"\u003e圖 3.1.5-1\u003c/span\u003e 偽造 X-Forwarded-For 讓限速計數器分散到多個假 IP\u003c/figcaption\u003e\n\u003c/figure\u003e\n\u003cp\u003e伺服器相信 header 裡填的來源，\u003ca href=\"../../web-http/information-disclosure/index.html\"\u003e資訊揭露\u003c/a\u003e一節的 \u003ccode\u003eX-Internal-Client-IP\u003c/code\u003e 也是同一種信任問題；那裡是 proxy 加的內部 header，這裡是轉送用的 \u003ccode\u003eX-Forwarded-For\u003c/code\u003e，名稱不同，道理一樣。\u003c/p\u003e\n\u003cp\u003e計數器也可能被特定動作重置。如果同一個來源成功登入 alice 之後，這個來源的計數器就歸零，而你手上有 alice 的密碼，那麼每失敗兩次就成功登入一次，一來一回把失敗次數攔在門檻之前，別人的密碼想試幾次就試幾次：\u003c/p\u003e\n\u003cfigure id=\"auth-reset-timeline\"\u003e\n  \u003csvg viewBox=\"0 0 640 172\" role=\"img\" aria-labelledby=\"auth-reset-timeline-t\" style=\"color:var(--text)\"\u003e\n    \u003ctitle id=\"auth-reset-timeline-t\"\u003e時間軸：每失敗兩次就成功登入 alice，計數器依序是 1、2、0、1、2、0，始終沒有到達門檻 3\u003c/title\u003e\n    \u003cdefs\u003e\u003cmarker id=\"auth-reset-timeline-ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"\u003e\u003cpath d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\n    \u003ctext x=\"320\" y=\"18\" font-size=\"12\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e同一來源的請求依序送出，下排是每次之後的計數器\u003c/text\u003e\n    \u003cline x1=\"20\" y1=\"56\" x2=\"620\" y2=\"56\" stroke=\"currentColor\" stroke-width=\"1.4\"/\u003e\n    \u003ccircle cx=\"60\" cy=\"56\" r=\"6\" fill=\"currentColor\" stroke=\"currentColor\" stroke-width=\"1.4\"/\u003e\n    \u003ctext x=\"60\" y=\"84\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e失敗\u003c/text\u003e\n    \u003crect x=\"34\" y=\"100\" width=\"52\" height=\"28\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"60\" y=\"119\" font-size=\"12\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\" style=\"font-family:var(--font-mono)\"\u003e1\u003c/text\u003e\n    \u003ccircle cx=\"160\" cy=\"56\" r=\"6\" fill=\"currentColor\" stroke=\"currentColor\" stroke-width=\"1.4\"/\u003e\n    \u003ctext x=\"160\" y=\"84\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e失敗\u003c/text\u003e\n    \u003crect x=\"134\" y=\"100\" width=\"52\" height=\"28\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"160\" y=\"119\" font-size=\"12\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\" style=\"font-family:var(--font-mono)\"\u003e2\u003c/text\u003e\n    \u003ccircle cx=\"260\" cy=\"56\" r=\"6\" fill=\"var(--accent-soft)\" stroke=\"currentColor\" stroke-width=\"1.4\"/\u003e\n    \u003ctext x=\"260\" y=\"84\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e登入 alice\u003c/text\u003e\n    \u003crect x=\"234\" y=\"100\" width=\"52\" height=\"28\" rx=\"6\" fill=\"var(--accent-soft)\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/\u003e\n    \u003ctext x=\"260\" y=\"119\" font-size=\"12\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\" style=\"font-family:var(--font-mono)\"\u003e0\u003c/text\u003e\n    \u003ccircle cx=\"360\" cy=\"56\" r=\"6\" fill=\"currentColor\" stroke=\"currentColor\" stroke-width=\"1.4\"/\u003e\n    \u003ctext x=\"360\" y=\"84\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e失敗\u003c/text\u003e\n    \u003crect x=\"334\" y=\"100\" width=\"52\" height=\"28\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"360\" y=\"119\" font-size=\"12\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\" style=\"font-family:var(--font-mono)\"\u003e1\u003c/text\u003e\n    \u003ccircle cx=\"460\" cy=\"56\" r=\"6\" fill=\"currentColor\" stroke=\"currentColor\" stroke-width=\"1.4\"/\u003e\n    \u003ctext x=\"460\" y=\"84\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e失敗\u003c/text\u003e\n    \u003crect x=\"434\" y=\"100\" width=\"52\" height=\"28\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"460\" y=\"119\" font-size=\"12\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\" style=\"font-family:var(--font-mono)\"\u003e2\u003c/text\u003e\n    \u003ccircle cx=\"560\" cy=\"56\" r=\"6\" fill=\"var(--accent-soft)\" stroke=\"currentColor\" stroke-width=\"1.4\"/\u003e\n    \u003ctext x=\"560\" y=\"84\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e登入 alice\u003c/text\u003e\n    \u003crect x=\"534\" y=\"100\" width=\"52\" height=\"28\" rx=\"6\" fill=\"var(--accent-soft)\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/\u003e\n    \u003ctext x=\"560\" y=\"119\" font-size=\"12\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\" style=\"font-family:var(--font-mono)\"\u003e0\u003c/text\u003e\n    \u003ctext x=\"20\" y=\"150\" font-size=\"11\" text-anchor=\"start\" fill=\"currentColor\"\u003e計數\u003c/text\u003e\n    \u003ctext x=\"320\" y=\"160\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e計數器始終小於門檻 3，不會觸發封鎖；登入 alice 時歸零\u003c/text\u003e\n  \u003c/svg\u003e\n  \u003cfigcaption\u003e\u003cspan class=\"fig-num\"\u003e圖 3.1.5-2\u003c/span\u003e 成功登入 alice 讓計數器歸零，失敗次數永遠到不了門檻\u003c/figcaption\u003e\n\u003c/figure\u003e\n\u003cp\u003e第三種弱點在計數的單位。如果限速計的是請求數，而不是密碼嘗試次數，一個請求裡塞進多組候選密碼，計數器只加 1，就可能繞過限制：\u003c/p\u003e\n\u003cfigure id=\"auth-batch\"\u003e\n  \u003csvg viewBox=\"0 0 640 164\" role=\"img\" aria-labelledby=\"auth-batch-t\" style=\"color:var(--text)\"\u003e\n    \u003ctitle id=\"auth-batch-t\"\u003e左側三個請求各帶一組密碼，計數器到 3 而被封鎖；右側一個請求帶三組密碼，計數器只加 1 而未到門檻\u003c/title\u003e\n    \u003cdefs\u003e\u003cmarker id=\"auth-batch-ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"\u003e\u003cpath d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\n    \u003ctext x=\"148\" y=\"18\" font-size=\"12\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e一個請求一組密碼\u003c/text\u003e\n    \u003ctext x=\"472\" y=\"18\" font-size=\"12\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e一個請求多組密碼\u003c/text\u003e\n    \u003crect x=\"6\" y=\"30\" width=\"160\" height=\"28\" rx=\"6\" fill=\"var(--accent-soft)\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/\u003e\n    \u003ctext x=\"86\" y=\"49\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\" style=\"font-family:var(--font-mono)\"\u003ePOST ... [密碼甲]\u003c/text\u003e\n    \u003crect x=\"6\" y=\"66\" width=\"160\" height=\"28\" rx=\"6\" fill=\"var(--accent-soft)\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/\u003e\n    \u003ctext x=\"86\" y=\"85\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\" style=\"font-family:var(--font-mono)\"\u003ePOST ... [密碼乙]\u003c/text\u003e\n    \u003crect x=\"6\" y=\"102\" width=\"160\" height=\"28\" rx=\"6\" fill=\"var(--accent-soft)\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/\u003e\n    \u003ctext x=\"86\" y=\"121\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\" style=\"font-family:var(--font-mono)\"\u003ePOST ... [密碼丙]\u003c/text\u003e\n    \u003cpath d=\"M170 62 H200\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-batch-ah)\"/\u003e\n    \u003crect x=\"204\" y=\"40\" width=\"90\" height=\"56\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"249\" y=\"64\" font-size=\"12\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\" style=\"font-family:var(--font-mono)\"\u003e計數 3\u003c/text\u003e\n    \u003ctext x=\"249\" y=\"84\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e到門檻，封鎖\u003c/text\u003e\n    \u003crect x=\"326\" y=\"30\" width=\"120\" height=\"88\" rx=\"6\" fill=\"var(--accent-soft)\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/\u003e\n    \u003ctext x=\"386\" y=\"54\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\" style=\"font-family:var(--font-mono)\"\u003ePOST ...\u003c/text\u003e\n    \u003ctext x=\"386\" y=\"72\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\" style=\"font-family:var(--font-mono)\"\u003e[密碼甲]\u003c/text\u003e\n    \u003ctext x=\"386\" y=\"88\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\" style=\"font-family:var(--font-mono)\"\u003e[密碼乙]\u003c/text\u003e\n    \u003ctext x=\"386\" y=\"104\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\" style=\"font-family:var(--font-mono)\"\u003e[密碼丙]\u003c/text\u003e\n    \u003cpath d=\"M450 74 H494\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-batch-ah)\"/\u003e\n    \u003crect x=\"498\" y=\"46\" width=\"134\" height=\"56\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"565\" y=\"70\" font-size=\"12\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\" style=\"font-family:var(--font-mono)\"\u003e計數 1\u003c/text\u003e\n    \u003ctext x=\"565\" y=\"90\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e未到門檻\u003c/text\u003e\n    \u003cline x1=\"310\" y1=\"24\" x2=\"310\" y2=\"150\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-dasharray=\"5 4\"/\u003e\n    \u003ctext x=\"148\" y=\"150\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e三次猜測，計三次\u003c/text\u003e\n    \u003ctext x=\"472\" y=\"150\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e三次猜測，只計一次\u003c/text\u003e\n  \u003c/svg\u003e\n  \u003cfigcaption\u003e\u003cspan class=\"fig-num\"\u003e圖 3.1.5-3\u003c/span\u003e 限速若以請求數計算，多組密碼塞進同一個請求就不會累計\u003c/figcaption\u003e\n\u003c/figure\u003e\n\n\u003caside class=\"practice\" aria-label=\"Lab 練習\"\u003e\n\u003cp\u003ePortSwigger Academy 的對應練習（主題頁 \u003ca href=\"https://portswigger.net/web-security/authentication\"\u003eAuthentication\u003c/a\u003e）：\u003c/p\u003e\n\u003cul\u003e\n  \u003cli\u003e\u003ca href=\"https://portswigger.net/web-security/authentication/password-based/lab-broken-bruteforce-protection-ip-block\"\u003eBroken brute-force protection, IP block\u003c/a\u003e：對應上面計數器被登入自己帳號重置的例子：連續失敗 3 次就封鎖，但登入自己的帳號會讓失敗次數歸零。Lab 的 carlos 相當於正文的 bob。要觀察登入自己的帳號之後，封鎖有沒有解除、失敗次數有沒有重新累計。\u003c/li\u003e\n  \u003cli\u003e\u003ca href=\"https://portswigger.net/web-security/authentication/password-based/lab-username-enumeration-via-response-timing\"\u003eUsername enumeration via response timing\u003c/a\u003e：對應 \u003ccode\u003eX-Forwarded-For\u003c/code\u003e 偽造來源 IP 的例子，再接\u003ca href=\"#enumeration\"\u003e回應時間差\u003c/a\u003e的例子。要觀察換掉 header 的值之後封鎖是否消失，以及存在與不存在的帳號在耗時上的差距，送很長的密碼時差距會不會放大。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eLab 用的\u003ca href=\"https://portswigger.net/web-security/authentication/auth-lab-usernames\"\u003e候選帳號清單\u003c/a\u003e與\u003ca href=\"https://portswigger.net/web-security/authentication/auth-lab-passwords\"\u003e候選密碼清單\u003c/a\u003e同樣可在 Academy 取得。\u003c/p\u003e\n\u003c/aside\u003e\n\u003ch2 id=\"basic-auth\"\u003e\u003cspan class=\"num\"\u003e3.1.6\u003c/span\u003e HTTP Basic 認證\u003c/h2\u003e\n\u003cp\u003eHTTP Basic 認證（basic authentication）是另一種登入方式：網站沒有自己的登入頁，帳號密碼由瀏覽器內建的對話框取得，之後再請求受保護的頁面，都用 \u003ccode\u003eAuthorization\u003c/code\u003e header 帶著送。tickets.example.com 的內部管理頁用的就是這種方式，帳號是 admin。\u003c/p\u003e\n\u003cp\u003e使用者第一次開 \u003ccode\u003e/internal\u003c/code\u003e 時，請求還沒有帳密。伺服器回 \u003ccode\u003e401 Unauthorized\u003c/code\u003e，並用 \u003ccode\u003eWWW-Authenticate: Basic\u003c/code\u003e header 表示這個頁面要用 Basic 認證。\u003ccode\u003erealm=\"internal\"\u003c/code\u003e 的 realm 是伺服器替這塊受保護區域取的名稱，用來區分同一個網站裡不同的受保護區域：\u003c/p\u003e\n\u003cdiv class=\"rr\" id=\"basic-challenge\"\u003e\u003cdiv class=\"rr-frame\"\u003e\u003cdiv class=\"rr-pane rr-req\"\u003e\u003cdiv class=\"rr-ph\"\u003eRequest\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-method\"\u003eGET\u003c/span\u003e \u003cspan class=\"tok-path\"\u003e/internal\u003c/span\u003e \u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eHost\u003c/span\u003e: \u003cspan class=\"tok-host\"\u003etickets.example.com\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003cdiv class=\"rr-pane rr-res\"\u003e\u003cdiv class=\"rr-ph\"\u003eResponse\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e \u003cspan class=\"tok-status\"\u003e401\u003c/span\u003e Unauthorized\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eWWW-Authenticate\u003c/span\u003e: Basic realm=\"internal\"\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cp\u003e瀏覽器收到後，跳出自己內建的帳號密碼對話框（不是網站做的 HTML 頁面）。使用者輸入後，瀏覽器把「帳號:密碼」編碼成 Base64（一種可逆的編碼，不是加密），放進 \u003ccode\u003eAuthorization\u003c/code\u003e header 重送請求；之後再請求這個 Basic 認證保護的頁面，瀏覽器都自動帶上這個 header，不靠 Cookie：\u003c/p\u003e\n\u003cfigure id=\"auth-basic-flow\"\u003e\n  \u003csvg viewBox=\"0 0 640 366\" role=\"img\" aria-labelledby=\"auth-basic-flow-t\" style=\"color:var(--text)\"\u003e\n    \u003ctitle id=\"auth-basic-flow-t\"\u003e瀏覽器第一次請求沒有帶 Authorization，伺服器回 401 與 WWW-Authenticate: Basic，瀏覽器跳出內建的帳號密碼對話框，使用者輸入後瀏覽器帶著 Authorization 重送，伺服器回 200；之後再請求受保護的頁面都自動帶 Authorization\u003c/title\u003e\n    \u003cdefs\u003e\u003cmarker id=\"auth-basic-flow-ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"\u003e\u003cpath d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\n    \u003cuse href=\"#icon-browser\" x=\"6\" y=\"0\" width=\"40\" height=\"40\" style=\"color:var(--text)\"/\u003e\n    \u003ctext x=\"26\" y=\"54\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e瀏覽器\u003c/text\u003e\n    \u003cuse href=\"#icon-server\" x=\"590\" y=\"0\" width=\"40\" height=\"40\" style=\"color:var(--text)\"/\u003e\n    \u003ctext x=\"610\" y=\"54\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e伺服器\u003c/text\u003e\n    \u003cline x1=\"26\" y1=\"60\" x2=\"26\" y2=\"304\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"3 4\"/\u003e\n    \u003cline x1=\"610\" y1=\"60\" x2=\"610\" y2=\"304\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"3 4\"/\u003e\n    \u003cpath d=\"M40 92 H596\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-basic-flow-ah)\"/\u003e\n    \u003ctext x=\"318\" y=\"84\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003eGET /internal，沒有 Authorization\u003c/text\u003e\n    \u003ccircle cx=\"26\" cy=\"92\" r=\"10\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.4\"/\u003e\n    \u003ctext x=\"26\" y=\"96\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e1\u003c/text\u003e\n    \u003cpath d=\"M596 124 H40\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-basic-flow-ah)\"/\u003e\n    \u003ctext x=\"318\" y=\"116\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e401 Unauthorized + WWW-Authenticate: Basic\u003c/text\u003e\n    \u003ccircle cx=\"26\" cy=\"124\" r=\"10\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.4\"/\u003e\n    \u003ctext x=\"26\" y=\"128\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e2\u003c/text\u003e\n    \u003crect x=\"210\" y=\"140\" width=\"220\" height=\"100\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"320\" y=\"159\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e需要登入\u003c/text\u003e\n    \u003cline x1=\"210\" y1=\"166\" x2=\"430\" y2=\"166\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"224\" y=\"186\" font-size=\"11\" text-anchor=\"start\" fill=\"currentColor\"\u003e帳號\u003c/text\u003e\n    \u003crect x=\"262\" y=\"172\" width=\"152\" height=\"18\" rx=\"4\" fill=\"var(--accent-soft)\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/\u003e\n    \u003ctext x=\"270\" y=\"185\" font-size=\"11\" text-anchor=\"start\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003eadmin\u003c/text\u003e\n    \u003ctext x=\"224\" y=\"210\" font-size=\"11\" text-anchor=\"start\" fill=\"currentColor\"\u003e密碼\u003c/text\u003e\n    \u003crect x=\"262\" y=\"196\" width=\"152\" height=\"18\" rx=\"4\" fill=\"var(--accent-soft)\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/\u003e\n    \u003ctext x=\"270\" y=\"209\" font-size=\"11\" text-anchor=\"start\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003e[密碼]\u003c/text\u003e\n    \u003crect x=\"364\" y=\"218\" width=\"50\" height=\"18\" rx=\"4\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"389\" y=\"231\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e登入\u003c/text\u003e\n    \u003ccircle cx=\"196\" cy=\"190\" r=\"10\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.4\"/\u003e\n    \u003ctext x=\"196\" y=\"194\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e3\u003c/text\u003e\n    \u003ctext x=\"184\" y=\"194\" font-size=\"11\" text-anchor=\"end\" fill=\"currentColor\"\u003e瀏覽器內建對話框\u003c/text\u003e\n    \u003cpath d=\"M40 268 H596\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-basic-flow-ah)\"/\u003e\n    \u003ctext x=\"318\" y=\"260\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003eGET /internal + Authorization: Basic [Base64 字串]\u003c/text\u003e\n    \u003ccircle cx=\"26\" cy=\"268\" r=\"10\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.4\"/\u003e\n    \u003ctext x=\"26\" y=\"272\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e4\u003c/text\u003e\n    \u003cpath d=\"M596 296 H40\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-basic-flow-ah)\"/\u003e\n    \u003ctext x=\"318\" y=\"288\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e200 OK + 內部頁內容\u003c/text\u003e\n    \u003ccircle cx=\"26\" cy=\"296\" r=\"10\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.4\"/\u003e\n    \u003ctext x=\"26\" y=\"300\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e5\u003c/text\u003e\n    \u003cline x1=\"20\" y1=\"316\" x2=\"620\" y2=\"316\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-dasharray=\"5 4\"/\u003e\n    \u003ctext x=\"318\" y=\"336\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e之後再請求受保護的頁面，瀏覽器都自動帶 Authorization，不靠 Cookie\u003c/text\u003e\n    \u003cuse href=\"#legend-input\" x=\"4\" y=\"346\"/\u003e\n  \u003c/svg\u003e\n  \u003cfigcaption\u003e\u003cspan class=\"fig-num\"\u003e圖 3.1.6-1\u003c/span\u003e 第一次請求取得帳密，之後再請求受保護的頁面都自動帶 Authorization\u003c/figcaption\u003e\n\u003c/figure\u003e\n\u003cp\u003e重送的請求與伺服器的回應長這樣：\u003c/p\u003e\n\u003cdiv class=\"rr\" id=\"basic-request\"\u003e\u003cdiv class=\"rr-frame\"\u003e\u003cdiv class=\"rr-pane rr-req\"\u003e\u003cdiv class=\"rr-ph\"\u003eRequest\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-method\"\u003eGET\u003c/span\u003e \u003cspan class=\"tok-path\"\u003e/internal\u003c/span\u003e \u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eHost\u003c/span\u003e: \u003cspan class=\"tok-host\"\u003etickets.example.com\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eAuthorization\u003c/span\u003e: Basic \u003cspan class=\"tok-placeholder\"\u003e[Base64 字串]\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003cdiv class=\"rr-pane rr-res\"\u003e\u003cdiv class=\"rr-ph\"\u003eResponse\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e \u003cspan class=\"tok-status\"\u003e200\u003c/span\u003e OK\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eContent-Type\u003c/span\u003e: text/html\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-placeholder\"\u003e[內部頁內容]\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cp\u003e\u003ccode\u003eBasic\u003c/code\u003e 後面那段就是 \u003cstrong\u003eBase64\u003c/strong\u003e：把任意字節轉成可印字元的編碼方式，沒有金鑰，任何人都能解碼回原文。拆開來就是帳號與密碼，中間用一個冒號分隔：\u003c/p\u003e\n\u003cfigure id=\"auth-basic-decode\"\u003e\n  \u003csvg viewBox=\"0 0 640 198\" role=\"img\" aria-labelledby=\"auth-basic-decode-t\" style=\"color:var(--text)\"\u003e\n    \u003ctitle id=\"auth-basic-decode-t\"\u003eAuthorization 值 Basic 後的字串經 Base64 解碼後，拆成帳號 admin 與密碼，中間用冒號分隔\u003c/title\u003e\n    \u003cdefs\u003e\u003cmarker id=\"auth-basic-decode-ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"\u003e\u003cpath d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\n    \u003crect x=\"4\" y=\"10\" width=\"180\" height=\"150\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"94\" y=\"32\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003eAuthorization 值\u003c/text\u003e\n    \u003cuse href=\"#icon-lock\" x=\"66\" y=\"46\" width=\"44\" height=\"44\" style=\"color:var(--text)\"/\u003e\n    \u003ctext x=\"94\" y=\"112\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003eBasic\u003c/text\u003e\n    \u003ctext x=\"94\" y=\"130\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003e[Base64 字串]\u003c/text\u003e\n    \u003cpath d=\"M190 85 H230\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-basic-decode-ah)\"/\u003e\n    \u003crect x=\"236\" y=\"10\" width=\"180\" height=\"150\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"326\" y=\"32\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003eBase64 解碼\u003c/text\u003e\n    \u003cuse href=\"#icon-unlock\" x=\"304\" y=\"46\" width=\"44\" height=\"44\" style=\"color:var(--text)\"/\u003e\n    \u003ctext x=\"326\" y=\"112\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e去掉編碼\u003c/text\u003e\n    \u003ctext x=\"326\" y=\"130\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e沒有金鑰\u003c/text\u003e\n    \u003cpath d=\"M422 85 H462\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-basic-decode-ah)\"/\u003e\n    \u003crect x=\"468\" y=\"10\" width=\"168\" height=\"150\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"552\" y=\"32\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e結果\u003c/text\u003e\n    \u003crect x=\"480\" y=\"60\" width=\"60\" height=\"26\" rx=\"6\" fill=\"var(--accent-soft)\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/\u003e\n    \u003ctext x=\"510\" y=\"78\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\" style=\"font-family:var(--font-mono)\"\u003eadmin\u003c/text\u003e\n    \u003ctext x=\"543\" y=\"78\" font-size=\"12\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e:\u003c/text\u003e\n    \u003crect x=\"552\" y=\"60\" width=\"74\" height=\"26\" rx=\"6\" fill=\"var(--accent-soft)\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/\u003e\n    \u003ctext x=\"589\" y=\"78\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\" style=\"font-family:var(--font-mono)\"\u003e[密碼]\u003c/text\u003e\n    \u003ctext x=\"552\" y=\"108\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e帳號 : 密碼\u003c/text\u003e\n    \u003cuse href=\"#legend-input\" x=\"4\" y=\"174\"/\u003e\n  \u003c/svg\u003e\n  \u003cfigcaption\u003e\u003cspan class=\"fig-num\"\u003e圖 3.1.6-2\u003c/span\u003e Base64 解碼後，帳號與密碼以冒號分隔\u003c/figcaption\u003e\n\u003c/figure\u003e\n\u003cp\u003e攔到這個字串，解碼就得到帳號與密碼。Basic 認證常見的問題有四個：\u003c/p\u003e\n\u003cul\u003e\n  \u003cli\u003e每個請求都重複送出帳密，一旦被看到就直接拿到完整登入憑證。\u003c/li\u003e\n  \u003cli\u003e很少附帶暴力猜測防護。\u003c/li\u003e\n  \u003cli\u003e同一組憑證可能在其他服務重複使用。\u003c/li\u003e\n  \u003cli\u003e頁面看起來不重要，也可能是進一步攻擊的入口。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e傳輸風險取決於有沒有 HSTS（HTTP Strict Transport Security：網站用 \u003ccode\u003eStrict-Transport-Security\u003c/code\u003e header 叫瀏覽器之後一律走 HTTPS）。使用者輸入的網址沒寫 https，或點到 \u003ccode\u003ehttp://\u003c/code\u003e 連結時，瀏覽器會先送 http 請求；網站正常會回轉址（例如 \u003ccode\u003e301\u003c/code\u003e），叫瀏覽器改走 https。沒有 HSTS 時，中間人能攔下這個改走 https 的轉址（頁面裡的 https 連結也一樣），自己和網站走 https，對瀏覽器卻維持 http。瀏覽器一直停在 http，\u003ccode\u003eAuthorization\u003c/code\u003e 裡的帳密以明文經過中間人，每一次都是如此。有 HSTS 時，瀏覽器記住規則之後直接走 https，不
