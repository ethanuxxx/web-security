會送出那個 http 請求，也就沒有轉址可攔；瀏覽器尚未記住、網站也不在預載清單的首次造訪，仍有這個空窗。Basic 認證把帳密放進每個請求，這個弱點因此格外重要。\u003c/p\u003e\n\u003cfigure id=\"auth-basic-path\"\u003e\n  \u003csvg viewBox=\"0 0 640 306\" role=\"img\" aria-labelledby=\"auth-basic-path-t\" style=\"color:var(--text)\"\u003e\n    \u003ctitle id=\"auth-basic-path-t\"\u003e使用者以 http 開啟網站，瀏覽器送出 http 請求；中間人對網站改走 https，網站回的改走 https 轉址被中間人攔下，瀏覽器收到 http 頁面而停在 http，之後 Authorization 的帳密以明文經過中間人；有 HSTS 時瀏覽器直接走 https，不經過那個 http 請求，首次造訪且未預載仍有此風險\u003c/title\u003e\n    \u003cdefs\u003e\u003cmarker id=\"auth-basic-path-ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"\u003e\u003cpath d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\n    \u003ctext x=\"170\" y=\"14\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e對瀏覽器：http（明文）\u003c/text\u003e\n    \u003ctext x=\"465\" y=\"14\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e對網站：https（加密）\u003c/text\u003e\n    \u003cuse href=\"#icon-browser\" x=\"6\" y=\"24\" width=\"40\" height=\"40\" style=\"color:var(--text)\"/\u003e\n    \u003ctext x=\"26\" y=\"80\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e瀏覽器\u003c/text\u003e\n    \u003cuse href=\"#icon-proxy\" x=\"296\" y=\"24\" width=\"40\" height=\"40\" style=\"color:var(--text)\"/\u003e\n    \u003ctext x=\"316\" y=\"80\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e中間人\u003c/text\u003e\n    \u003cuse href=\"#icon-server\" x=\"590\" y=\"24\" width=\"40\" height=\"40\" style=\"color:var(--text)\"/\u003e\n    \u003ctext x=\"610\" y=\"80\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e網站\u003c/text\u003e\n    \u003cline x1=\"26\" y1=\"88\" x2=\"26\" y2=\"218\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"3 4\"/\u003e\n    \u003cline x1=\"316\" y1=\"88\" x2=\"316\" y2=\"218\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"3 4\"/\u003e\n    \u003cline x1=\"610\" y1=\"88\" x2=\"610\" y2=\"218\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"3 4\"/\u003e\n    \u003cpath d=\"M40 114 H300\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-basic-path-ah)\"/\u003e\n    \u003ctext x=\"170\" y=\"106\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003ehttp:// 請求\u003c/text\u003e\n    \u003cpath d=\"M332 114 H596\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-basic-path-ah)\"/\u003e\n    \u003ctext x=\"464\" y=\"106\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e中間人改用 https 轉送\u003c/text\u003e\n    \u003ccircle cx=\"26\" cy=\"114\" r=\"10\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.4\"/\u003e\n    \u003ctext x=\"26\" y=\"118\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e1\u003c/text\u003e\n    \u003cpath d=\"M300 150 H40\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-basic-path-ah)\"/\u003e\n    \u003ctext x=\"170\" y=\"142\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e回 http 頁面，瀏覽器停在 http\u003c/text\u003e\n    \u003cpath d=\"M596 150 H332\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-basic-path-ah)\"/\u003e\n    \u003ctext x=\"464\" y=\"142\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e轉址：請改走 https\u003c/text\u003e\n    \u003ccircle cx=\"26\" cy=\"150\" r=\"10\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.4\"/\u003e\n    \u003ctext x=\"26\" y=\"154\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e2\u003c/text\u003e\n    \u003ccircle cx=\"316\" cy=\"150\" r=\"10\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.4\"/\u003e\n    \u003ctext x=\"316\" y=\"154\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e!\u003c/text\u003e\n    \u003ctext x=\"316\" y=\"174\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e攔下改走 https 的轉址\u003c/text\u003e\n    \u003cpath d=\"M40 206 H300\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-basic-path-ah)\"/\u003e\n    \u003ctext x=\"170\" y=\"198\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003eAuthorization: Basic [Base64 字串]\u003c/text\u003e\n    \u003cpath d=\"M332 206 H596\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-basic-path-ah)\"/\u003e\n    \u003ctext x=\"464\" y=\"198\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e同一份帳密，https 轉送\u003c/text\u003e\n    \u003ccircle cx=\"26\" cy=\"206\" r=\"10\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.4\"/\u003e\n    \u003ctext x=\"26\" y=\"210\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e3\u003c/text\u003e\n    \u003cline x1=\"20\" y1=\"232\" x2=\"620\" y2=\"232\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-dasharray=\"5 4\"/\u003e\n    \u003cuse href=\"#icon-lock\" x=\"6\" y=\"246\" width=\"32\" height=\"32\" style=\"color:var(--text)\"/\u003e\n    \u003ctext x=\"48\" y=\"266\" font-size=\"11\" text-anchor=\"start\" fill=\"currentColor\"\u003e有 HSTS：瀏覽器記住後直接走 https://，不送上面的 http 請求，也就沒有轉址可攔\u003c/text\u003e\n    \u003ctext x=\"48\" y=\"286\" font-size=\"11\" text-anchor=\"start\" fill=\"currentColor\"\u003e首次造訪（瀏覽器尚未記住、網站未預載）仍落在上面的流程\u003c/text\u003e\n  \u003c/svg\u003e\n  \u003cfigcaption\u003e\u003cspan class=\"fig-num\"\u003e圖 3.1.6-3\u003c/span\u003e 中間人攔下改走 https 的轉址，瀏覽器停在 http，帳密以明文經過\u003c/figcaption\u003e\n\u003c/figure\u003e\n\u003cp\u003e瀏覽器通過 Basic 認證後，會把憑證附在之後對這個網站的請求上，不靠 Cookie，也沒有額外的防護；\u003ca href=\"../../cross-site/csrf/index.html\"\u003eCSRF\u003c/a\u003e 這類借用瀏覽器自動帶憑證的攻擊同樣打得中。\u003c/p\u003e\n\u003ch2 id=\"two-factor\"\u003e\u003cspan class=\"num\"\u003e3.1.7\u003c/span\u003e 雙因素驗證的漏洞\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003e雙因素驗證\u003c/strong\u003e（two-factor authentication，2FA）要求\u003ca href=\"#auth-vs-authz\"\u003e三類驗證因素\u003c/a\u003e中的兩類都通過才算登入：通常是密碼（所知之事）加上另一類因素。同一類因素驗兩次不算雙因素：寄到信箱的驗證碼仍然是所知之事（能登入信箱就拿到），沒有引入第二類因素。第二類因素是專用硬體或驗證器 App（在裝置上產生碼，離開密碼本身），或是手機收到的 SMS 驗證碼（所持之物），但 SMS 有 \u003cstrong\u003eSIM swapping\u003c/strong\u003e（把受害者的電話號碼轉移到攻擊者手機的手法）這個弱點，不如硬體或 App 可靠。雙因素驗證比單一密碼安全：同時取得另一個管道的因素（偷到手機、換到 SIM 卡）比只偷密碼難得多。\u003c/p\u003e\n\u003cfigure id=\"auth-2fa-factors\"\u003e\n  \u003csvg viewBox=\"0 0 640 196\" role=\"img\" aria-labelledby=\"auth-2fa-factors-t\" style=\"color:var(--text)\"\u003e\n    \u003ctitle id=\"auth-2fa-factors-t\"\u003e兩種兩步驗證的對比：密碼加 email 驗證碼，兩步都是所知之事，只算一類因素；密碼加驗證器 App 的碼，是所知之事與所持之物兩類因素，才是雙因素驗證\u003c/title\u003e\n    \u003cdefs\u003e\u003cmarker id=\"auth-2fa-factors-ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"\u003e\u003cpath d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\n    \u003ctext x=\"94\" y=\"20\" font-size=\"12\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e第一步驗什麼\u003c/text\u003e\n    \u003ctext x=\"318\" y=\"20\" font-size=\"12\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e第二步驗什麼\u003c/text\u003e\n    \u003ctext x=\"540\" y=\"20\" font-size=\"12\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e屬於幾類因素\u003c/text\u003e\n    \u003crect x=\"4\" y=\"30\" width=\"180\" height=\"60\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003cuse href=\"#icon-key\" x=\"12\" y=\"40\" width=\"40\" height=\"40\" style=\"color:var(--text)\"/\u003e\n    \u003ctext x=\"60\" y=\"56\" font-size=\"12\" text-anchor=\"start\" fill=\"currentColor\" font-weight=\"700\"\u003e密碼\u003c/text\u003e\n    \u003ctext x=\"60\" y=\"75\" font-size=\"11\" text-anchor=\"start\" fill=\"currentColor\"\u003e所知之事\u003c/text\u003e\n    \u003cpath d=\"M188 60 H214\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-2fa-factors-ah)\"/\u003e\n    \u003crect x=\"218\" y=\"30\" width=\"200\" height=\"60\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003cuse href=\"#icon-envelope\" x=\"226\" y=\"40\" width=\"40\" height=\"40\" style=\"color:var(--text)\"/\u003e\n    \u003ctext x=\"274\" y=\"56\" font-size=\"12\" text-anchor=\"start\" fill=\"currentColor\" font-weight=\"700\"\u003eemail 驗證碼\u003c/text\u003e\n    \u003ctext x=\"274\" y=\"75\" font-size=\"11\" text-anchor=\"start\" fill=\"currentColor\"\u003e所知之事\u003c/text\u003e\n    \u003cpath d=\"M422 60 H442\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-2fa-factors-ah)\"/\u003e\n    \u003crect x=\"446\" y=\"30\" width=\"190\" height=\"60\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-dasharray=\"6 4\"/\u003e\n    \u003cuse href=\"#icon-cross\" x=\"454\" y=\"40\" width=\"40\" height=\"40\" style=\"color:var(--text)\"/\u003e\n    \u003ctext x=\"502\" y=\"56\" font-size=\"12\" text-anchor=\"start\" fill=\"currentColor\" font-weight=\"700\"\u003e一類因素\u003c/text\u003e\n    \u003ctext x=\"502\" y=\"75\" font-size=\"11\" text-anchor=\"start\" fill=\"currentColor\"\u003e不算雙因素\u003c/text\u003e\n    \u003crect x=\"4\" y=\"106\" width=\"180\" height=\"60\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003cuse href=\"#icon-key\" x=\"12\" y=\"116\" width=\"40\" height=\"40\" style=\"color:var(--text)\"/\u003e\n    \u003ctext x=\"60\" y=\"132\" font-size=\"12\" text-anchor=\"start\" fill=\"currentColor\" font-weight=\"700\"\u003e密碼\u003c/text\u003e\n    \u003ctext x=\"60\" y=\"151\" font-size=\"11\" text-anchor=\"start\" fill=\"currentColor\"\u003e所知之事\u003c/text\u003e\n    \u003cpath d=\"M188 136 H214\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-2fa-factors-ah)\"/\u003e\n    \u003crect x=\"218\" y=\"106\" width=\"200\" height=\"60\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003cuse href=\"#icon-token\" x=\"226\" y=\"116\" width=\"40\" height=\"40\" style=\"color:var(--text)\"/\u003e\n    \u003ctext x=\"274\" y=\"132\" font-size=\"12\" text-anchor=\"start\" fill=\"currentColor\" font-weight=\"700\"\u003e驗證器 App 的碼\u003c/text\u003e\n    \u003ctext x=\"274\" y=\"151\" font-size=\"11\" text-anchor=\"start\" fill=\"currentColor\"\u003e所持之物\u003c/text\u003e\n    \u003cpath d=\"M422 136 H442\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-2fa-factors-ah)\"/\u003e\n    \u003crect x=\"446\" y=\"106\" width=\"190\" height=\"60\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003cuse href=\"#icon-check\" x=\"454\" y=\"116\" width=\"40\" height=\"40\" style=\"color:var(--text)\"/\u003e\n    \u003ctext x=\"502\" y=\"132\" font-size=\"12\" text-anchor=\"start\" fill=\"currentColor\" font-weight=\"700\"\u003e兩類因素\u003c/text\u003e\n    \u003ctext x=\"502\" y=\"151\" font-size=\"11\" text-anchor=\"start\" fill=\"currentColor\"\u003e雙因素驗證\u003c/text\u003e\n    \u003ctext x=\"320\" y=\"188\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e虛線框：沒有引入第二類因素\u003c/text\u003e\n  \u003c/svg\u003e\n  \u003cfigcaption\u003e\u003cspan class=\"fig-num\"\u003e圖 3.1.7-1\u003c/span\u003e 同一類因素驗兩次，與所知加所持兩類因素的對比\u003c/figcaption\u003e\n\u003c/figure\u003e\n\u003cp\u003etickets.example.com 的登入是上圖第一種：帳密通過後進到驗證碼頁，再輸入寄到信箱的碼。嚴格說這是同一類因素驗兩次。\u003c/p\u003e\n\u003cfigure id=\"auth-2fa-flow\"\u003e\n  \u003csvg viewBox=\"0 0 640 220\" role=\"img\" aria-labelledby=\"auth-2fa-flow-t\" style=\"color:var(--text)\"\u003e\n    \u003ctitle id=\"auth-2fa-flow-t\"\u003e兩步登入流程：輸入帳密通過第一步，進入驗證碼頁輸入第二步的碼，才能打開受保護頁；三個標號分別標出跳過第二步直接開受保護頁、驗證碼請求靠可改的 Cookie 認人、驗證碼無限速可暴力猜三種弱點的位置\u003c/title\u003e\n    \u003cdefs\u003e\u003cmarker id=\"auth-2fa-flow-ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"\u003e\u003cpath d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\n    \u003cuse href=\"#icon-user\" x=\"8\" y=\"50\" width=\"36\" height=\"36\" style=\"color:var(--text)\"/\u003e\n    \u003crect x=\"90\" y=\"30\" width=\"130\" height=\"70\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"155\" y=\"22\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e步驟一\u003c/text\u003e\n    \u003ctext x=\"155\" y=\"66\" font-size=\"12\" text-anchor=\"middle\" fill=\"currentColor\"\u003e帳密\u003c/text\u003e\n    \u003ctext x=\"155\" y=\"86\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003ePOST /login\u003c/text\u003e\n    \u003crect x=\"270\" y=\"30\" width=\"150\" height=\"70\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"345\" y=\"22\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e驗證碼頁\u003c/text\u003e\n    \u003ctext x=\"345\" y=\"66\" font-size=\"12\" text-anchor=\"middle\" fill=\"currentColor\"\u003e4 位數碼\u003c/text\u003e\n    \u003ctext x=\"345\" y=\"86\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003ePOST /login/verify\u003c/text\u003e\n    \u003crect x=\"470\" y=\"30\" width=\"150\" height=\"70\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"545\" y=\"22\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e受保護頁\u003c/text\u003e\n    \u003cuse href=\"#icon-lock\" x=\"525\" y=\"44\" width=\"32\" height=\"32\" style=\"color:var(--text)\"/\u003e\n    \u003cpath d=\"M40 65 H86\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-2fa-flow-ah)\"/\u003e\n    \u003cpath d=\"M220 65 H266\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-2fa-flow-ah)\"/\u003e\n    \u003cpath d=\"M420 65 H466\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-2fa-flow-ah)\"/\u003e\n    \u003cpath d=\"M155 100 V134 H545 V100\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-dasharray=\"5 4\" marker-end=\"url(#auth-2fa-flow-ah)\"/\u003e\n    \u003ccircle cx=\"230\" cy=\"134\" r=\"10\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.4\"/\u003e\n    \u003ctext x=\"230\" y=\"138\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e1\u003c/text\u003e\n    \u003cuse href=\"#icon-cookie\" x=\"318\" y=\"104\" width=\"20\" height=\"20\" style=\"color:var(--text)\"/\u003e\n    \u003ccircle cx=\"362\" cy=\"114\" r=\"10\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.4\"/\u003e\n    \u003ctext x=\"362\" y=\"118\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e2\u003c/text\u003e\n    \u003ccircle cx=\"443\" cy=\"86\" r=\"10\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.4\"/\u003e\n    \u003ctext x=\"443\" y=\"90\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e3\u003c/text\u003e\n    \u003ccircle cx=\"24\" cy=\"160\" r=\"10\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.4\"/\u003e\n    \u003ctext x=\"24\" y=\"164\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e1\u003c/text\u003e\n    \u003ctext x=\"42\" y=\"164\" font-size=\"11\" text-anchor=\"start\" fill=\"currentColor\"\u003e弱點一：跳過驗證碼頁，直接開受保護頁\u003c/text\u003e\n    \u003ccircle cx=\"24\" cy=\"182\" r=\"10\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.4\"/\u003e\n    \u003ctext x=\"24\" y=\"186\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e2\u003c/text\u003e\n    \u003ctext x=\"42\" y=\"186\" font-size=\"11\" text-anchor=\"start\" fill=\"currentColor\"\u003e弱點二：驗證碼請求靠可改的 Cookie 認人\u003c/text\u003e\n    \u003ccircle cx=\"24\" cy=\"204\" r=\"10\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.4\"/\u003e\n    \u003ctext x=\"24\" y=\"208\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e3\u003c/text\u003e\n    \u003ctext x=\"42\" y=\"208\" font-size=\"11\" text-anchor=\"start\" fill=\"currentColor\"\u003e弱點三：4 位數碼無限速，可暴力猜\u003c/text\u003e\n  \u003c/svg\u003e\n  \u003cfigcaption\u003e\u003cspan class=\"fig-num\"\u003e圖 3.1.7-2\u003c/span\u003e 兩步流程，三個標號對應下方清單的三種弱點\u003c/figcaption\u003e\n\u003c/figure\u003e\n\u003cp\u003e三種弱點各自獨立，位置見上圖標號：\u003c/p\u003e\n\u003cul\u003e\n  \u003cli\u003e第一步後就當成已登入：伺服器在帳密通過時就發下能存取受保護頁的 session，驗證碼頁只是畫面上的一道關卡，直接把網址改成受保護頁就進去了，不需要真的輸入驗證碼。\u003c/li\u003e\n  \u003cli\u003e驗證碼請求只靠可改的 Cookie 認人：送出驗證碼的請求（見下方）用 Cookie \u003ccode\u003eaccount=\u003c名稱\u003e\u003c/code\u003e 判斷現在驗證的是哪個帳號，把值改成別人的名字（例如 \u003ccode\u003eaccount=bob\u003c/code\u003e），網站就會替 bob 產生一組新的驗證碼寄到他的信箱；你不知道這組碼，但可以靠下一條的弱點三去猜。\u003c/li\u003e\n  \u003cli\u003e驗證碼無限速：4 位數碼只有一萬種組合，若沒有錯誤次數限制，可以用程式自動逐一試完。有些網站試圖用「猜錯幾次就登出」擋下這招，但這個防護擋不住：攻擊者把登入與猜碼兩步做成巨集自動重複，每次被登出就自動重新登入，繼續猜下一個候選碼。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cdiv class=\"rr\"\u003e\u003cdiv class=\"rr-pt\"\u003e送出驗證碼（弱點二的請求）\u003c/div\u003e\u003cdiv class=\"rr-frame\"\u003e\u003cdiv class=\"rr-pane rr-req\"\u003e\u003cdiv class=\"rr-ph\"\u003eRequest\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-method\"\u003ePOST\u003c/span\u003e \u003cspan class=\"tok-path\"\u003e/login/verify\u003c/span\u003e \u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eHost\u003c/span\u003e: \u003cspan class=\"tok-host\"\u003etickets.example.com\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eCookie\u003c/span\u003e: \u003cspan class=\"tok-attr\"\u003eaccount\u003c/span\u003e=\u003cspan class=\"tok-value\"\u003ebob\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eContent-Type\u003c/span\u003e: application/x-www-form-urlencoded\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-param\"\u003ecode\u003c/span\u003e=\u003cspan class=\"tok-placeholder\"\u003e[4 位數碼]\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003cdiv class=\"rr-pane rr-res\"\u003e\u003cdiv class=\"rr-ph\"\u003eResponse\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e \u003cspan class=\"tok-status\"\u003e200\u003c/span\u003e OK\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eContent-Type\u003c/span\u003e: text/html\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-placeholder\"\u003e[驗證結果頁]\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cp\u003e這三種弱點都出在流程，和第二步用哪一類因素無關，換成驗證器 App 或簡訊收碼同樣成立。\u003c/p\u003e\n\u003caside class=\"practice\" aria-label=\"Lab 練習\"\u003e\n\u003cp\u003ePortSwigger Academy 的對應練習（主題頁 \u003ca href=\"https://portswigger.net/web-security/authentication\"\u003eAuthentication\u003c/a\u003e）：\u003c/p\u003e\n\u003cul\u003e\n  \u003cli\u003e\u003ca href=\"https://portswigger.net/web-security/authentication/multi-factor/lab-2fa-simple-bypass\"\u003e2FA simple bypass\u003c/a\u003e：對應弱點一：帳密通過後伺服器就發下 session。要觀察不輸入驗證碼、直接把網址改成受保護頁，回應是不是正常的頁面。\u003c/li\u003e\n  \u003cli\u003e\u003ca href=\"https://portswigger.net/web-security/authentication/multi-factor/lab-2fa-broken-logic\"\u003e2FA broken logic\u003c/a\u003e：對應弱點二加弱點三：驗證碼請求只靠 Cookie 認人，驗證碼又無限速。要觀察把 \u003ccode\u003eaccount\u003c/code\u003e 改成別人的名字後，網站替誰產生了驗證碼，以及連續猜錯時有沒有被擋下。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e4 位數碼沒有可縮小的範圍，一萬種都要試，逐一送完要花不少時間。\u003c/p\u003e\n\u003c/aside\u003e\n\u003ch2 id=\"stay-logged-in\"\u003e\u003cspan class=\"num\"\u003e3.1.8\u003c/span\u003e 「保持登入」Cookie\u003c/h2\u003e\n\u003cp\u003e登入頁常有一個「保持登入」的勾選框。勾選後，網站除了一般的 session Cookie，還會發下一個 persistent Cookie（效期很長的 Cookie，關掉瀏覽器也還在），範例網站取名 \u003ccode\u003estay-logged-in\u003c/code\u003e。之後只要瀏覽器帶著它，網站就直接認定你已登入，不必再輸入密碼，等於跳過登入這一步。\u003c/p\u003e\n\u003cp\u003e要注意的是這個 Cookie 的內容怎麼來。\u003ca href=\"../../web-http/http-session/index.html\"\u003eCookie 與 Session\u003c/a\u003e 的 session Cookie 是伺服器隨機產生、沒有規律的值；\u003ccode\u003estay-logged-in\u003c/code\u003e 卻是用帳號資料算出來的：把使用者名稱、冒號、密碼的 MD5 雜湊接在一起，再做 Base64 編碼。雜湊（hash）是一種單向的計算：同一個輸入永遠得到同一串固定長度的結果，但沒辦法從結果直接倒推回原文。Base64 只是把資料換成另一種寫法，誰都能還原，沒有保護作用，和\u003ca href=\"#basic-auth\"\u003e上一小節\u003c/a\u003e Basic 認證用的一樣。拆開之後長這樣：\u003c/p\u003e\n\u003cfigure id=\"auth-remember-decode\"\u003e\n  \u003csvg viewBox=\"0 0 640 188\" role=\"img\" aria-labelledby=\"auth-remember-decode-t\" style=\"color:var(--text)\"\u003e\n    \u003ctitle id=\"auth-remember-decode-t\"\u003estay-logged-in Cookie 經 Base64 解碼後，拆成使用者名稱 bob 與密碼的 MD5 雜湊，中間用冒號分隔\u003c/title\u003e\n    \u003cdefs\u003e\u003cmarker id=\"auth-remember-decode-ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"\u003e\u003cpath d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\n    \u003crect x=\"4\" y=\"10\" width=\"190\" height=\"150\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"99\" y=\"32\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003estay-logged-in\u003c/text\u003e\n    \u003cuse href=\"#icon-cookie\" x=\"75\" y=\"46\" width=\"48\" height=\"48\" style=\"color:var(--text)\"/\u003e\n    \u003ctext x=\"99\" y=\"122\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003e[Base64 字串]\u003c/text\u003e\n    \u003cpath d=\"M200 85 H240\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-remember-decode-ah)\"/\u003e\n    \u003crect x=\"246\" y=\"10\" width=\"190\" height=\"150\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"341\" y=\"32\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e解碼\u003c/text\u003e\n    \u003cuse href=\"#icon-unlock\" x=\"317\" y=\"46\" width=\"48\" height=\"48\" style=\"color:var(--text)\"/\u003e\n    \u003ctext x=\"341\" y=\"122\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003eBase64 解碼\u003c/text\u003e\n    \u003cpath d=\"M442 85 H482\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-remember-decode-ah)\"/\u003e\n    \u003crect x=\"488\" y=\"10\" width=\"148\" height=\"150\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"562\" y=\"32\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e結果\u003c/text\u003e\n    \u003crect x=\"498\" y=\"60\" width=\"54\" height=\"26\" rx=\"6\" fill=\"var(--accent-soft)\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/\u003e\n    \u003ctext x=\"525\" y=\"78\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\" style=\"font-family:var(--font-mono)\"\u003ebob\u003c/text\u003e\n    \u003ctext x=\"556\" y=\"78\" font-size=\"12\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e:\u003c/text\u003e\n    \u003crect x=\"564\" y=\"60\" width=\"66\" height=\"26\" rx=\"6\" fill=\"var(--accent-soft)\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/\u003e\n    \u003ctext x=\"597\" y=\"78\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\" style=\"font-family:var(--font-mono)\"\u003e[雜湊]\u003c/text\u003e\n    \u003ctext x=\"562\" y=\"108\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e使用者名稱：MD5(密碼)\u003c/text\u003e\n    \u003cuse href=\"#legend-input\" x=\"4\" y=\"166\"/\u003e\n  \u003c/svg\u003e\n  \u003cfigcaption\u003e\u003cspan class=\"fig-num\"\u003e圖 3.1.8-1\u003c/span\u003e Cookie 的內容：Base64 解碼後是使用者名稱與密碼的 MD5 雜湊\u003c/figcaption\u003e\n\u003c/figure\u003e\n\u003cp\u003e既然是算出來的，只要知道算法與某人的密碼，任何人都能自己做出一模一樣的 Cookie。網站收到後只是照同一個算法驗證、符合就放行，它分不出這個 Cookie 是自己發的，還是別人算的。這就是問題所在，接下來兩種攻擊都從這裡來。\u003c/p\u003e\n\u003ch3 id=\"remember-formula\"\u003e怎麼知道 Cookie 的組成方式\u003c/h3\u003e\n\u003cp\u003e攻擊者要先知道公式，有兩條路。\u003c/p\u003e\n\u003cp\u003e第一條，查原始碼。很多網站不是從零開始寫，而是用現成的框架（framework）：別人寫好、可重複使用的網站程式骨架，登入、Cookie 這類每個網站都需要的功能已經做好，開發者只補自己的部分。框架若是開源（open source，原始碼公開，任何人都能閱讀），它怎麼產生 \u003ccode\u003estay-logged-in\u003c/code\u003e 這類 Cookie，程式碼和文件上都看得到，攻擊者不必自己摸索。\u003c/p\u003e\n\u003cp\u003e第二條，沒有原始碼也行，用自己的帳號 alice 反推。登入 alice 並勾選「保持登入」，把自己拿到的 Cookie 解碼，得到 \u003ccode\u003ealice\u003c/code\u003e 和一段雜湊；再把自己知道的 alice 密碼算 MD5，和解碼出來的雜湊比對。兩個一樣，就確認公式是「使用者名稱:MD5(密碼)」，這個 Cookie 的產生方式因此被完整掌握：\u003c/p\u003e\n\u003cfigure id=\"auth-remember-formula\"\u003e\n  \u003csvg viewBox=\"0 0 640 190\" role=\"img\" aria-labelledby=\"auth-remember-formula-t\" style=\"color:var(--text)\"\u003e\n    \u003ctitle id=\"auth-remember-formula-t\"\u003e用自己的帳號 alice 反推公式：Cookie 經 Base64 解碼得到 alice 與一段雜湊；alice 自己已知的密碼算 MD5 得到另一段雜湊；兩段完全相同，就確認 Cookie 的公式是使用者名稱加冒號加密碼的 MD5\u003c/title\u003e\n    \u003cdefs\u003e\u003cmarker id=\"auth-remember-formula-ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"\u003e\u003cpath d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\n    \u003crect x=\"4\" y=\"10\" width=\"150\" height=\"70\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"79\" y=\"32\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003ealice 的 Cookie\u003c/text\u003e\n    \u003ctext x=\"79\" y=\"54\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003e[Base64 字串]\u003c/text\u003e\n    \u003cpath d=\"M158 45 H188\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-remember-formula-ah)\"/\u003e\n    \u003crect x=\"192\" y=\"10\" width=\"150\" height=\"70\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"267\" y=\"32\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003eBase64 解碼\u003c/text\u003e\n    \u003ctext x=\"267\" y=\"54\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e還原成文字\u003c/text\u003e\n    \u003cpath d=\"M346 45 H376\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-remember-formula-ah)\"/\u003e\n    \u003crect x=\"380\" y=\"10\" width=\"150\" height=\"70\" rx=\"8\" fill=\"var(--accent-soft)\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/\u003e\n    \u003ctext x=\"455\" y=\"32\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e解碼結果\u003c/text\u003e\n    \u003ctext x=\"455\" y=\"54\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\" style=\"font-family:var(--font-mono)\"\u003ealice:[雜湊]\u003c/text\u003e\n    \u003crect x=\"4\" y=\"110\" width=\"150\" height=\"70\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"79\" y=\"132\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003ealice 的密碼\u003c/text\u003e\n    \u003ctext x=\"79\" y=\"154\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e自己設定，已知\u003c/text\u003e\n    \u003cpath d=\"M158 145 H188\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-remember-formula-ah)\"/\u003e\n    \u003crect x=\"192\" y=\"110\" width=\"150\" height=\"70\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"267\" y=\"132\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e算 MD5\u003c/text\u003e\n    \u003ctext x=\"267\" y=\"154\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003eMD5(alice 的密碼)\u003c/text\u003e\n    \u003cpath d=\"M346 145 H376\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-remember-formula-ah)\"/\u003e\n    \u003crect x=\"380\" y=\"110\" width=\"150\" height=\"70\" rx=\"8\" fill=\"var(--accent-soft)\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/\u003e\n    \u003ctext x=\"455\" y=\"132\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e算出的結果\u003c/text\u003e\n    \u003ctext x=\"455\" y=\"154\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\" style=\"font-family:var(--font-mono)\"\u003e[雜湊]\u003c/text\u003e\n    \u003cpath d=\"M536 45 H556 V145 H536\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/\u003e\n    \u003ctext x=\"598\" y=\"90\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e兩個雜湊\u003c/text\u003e\n    \u003ctext x=\"598\" y=\"108\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e完全相同\u003c/text\u003e\n    \u003ctext x=\"598\" y=\"130\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e公式確認\u003c/text\u003e\n  \u003c/svg\u003e\n  \u003cfigcaption\u003e\u003cspan class=\"fig-num\"\u003e圖 3.1.8-2\u003c/span\u003e 比對自己的 Cookie 與自己算的 MD5，確認公式\u003c/figcaption\u003e\n\u003c/figure\u003e\n\u003ch3 id=\"remember-guess\"\u003e線上猜 bob 的密碼（攻擊一）\u003c/h3\u003e\n\u003cp\u003e公式有了，卻還缺 bob 的密碼，所以對一份候選密碼清單逐一試：把候選密碼算 MD5、接在 \u003ccode\u003ebob:\u003c/code\u003e 後面、做 Base64 編碼、放進 \u003ccode\u003estay-logged-in\u003c/code\u003e Cookie，送給網站。候選密碼不對時，網站驗證不過，視為沒登入，回應把你導回登入頁；候選密碼剛好是 bob 的密碼時，網站驗證通過，回應就是 bob 的帳號頁。兩種回應差別明顯，看回應就知道猜中沒有：\u003c/p\u003e\n\u003cdiv class=\"rr\"\u003e\u003cdiv class=\"rr-pt\"\u003e猜錯\u003c/div\u003e\u003cdiv class=\"rr-frame\"\u003e\u003cdiv class=\"rr-pane rr-req\"\u003e\u003cdiv class=\"rr-ph\"\u003eRequest\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-method\"\u003eGET\u003c/span\u003e \u003cspan class=\"tok-path\"\u003e/account\u003c/span\u003e \u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eHost\u003c/span\u003e: \u003cspan class=\"tok-host\"\u003etickets.example.com\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eCookie\u003c/span\u003e: \u003cspan class=\"tok-attr\"\u003estay-logged-in\u003c/span\u003e=\u003cspan class=\"tok-placeholder\"\u003e[Base64 字串]\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003cdiv class=\"rr-pane rr-res\"\u003e\u003cdiv class=\"rr-ph\"\u003eResponse\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e \u003cspan class=\"tok-status\"\u003e302\u003c/span\u003e Found\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eLocation\u003c/span\u003e: \u003cspan class=\"tok-path\"\u003e/login\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cdiv class=\"rr rr-alt\"\u003e\u003cdiv class=\"rr-pt\"\u003e猜中\u003c/div\u003e\u003cdiv class=\"rr-frame\"\u003e\u003cdiv class=\"rr-pane rr-req\"\u003e\u003cdiv class=\"rr-ph\"\u003eRequest\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-method\"\u003eGET\u003c/span\u003e \u003cspan class=\"tok-path\"\u003e/account\u003c/span\u003e \u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eHost\u003c/span\u003e: \u003cspan class=\"tok-host\"\u003etickets.example.com\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eCookie\u003c/span\u003e: \u003cspan class=\"tok-attr\"\u003estay-logged-in\u003c/span\u003e=\u003cspan class=\"tok-placeholder\"\u003e[Base64 字串]\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003cdiv class=\"rr-pane rr-res\"\u003e\u003cdiv class=\"rr-ph\"\u003eResponse\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e \u003cspan class=\"tok-status\"\u003e200\u003c/span\u003e OK\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eContent-Type\u003c/span\u003e: text/html\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e（bob 的帳號頁）\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cfigure id=\"auth-remember-guess\"\u003e\n  \u003csvg viewBox=\"0 0 640 196\" role=\"img\" aria-labelledby=\"auth-remember-guess-t\" style=\"color:var(--text)\"\u003e\n    \u003ctitle id=\"auth-remember-guess-t\"\u003e對 bob 逐一猜密碼：每個候選密碼算 MD5、接在 bob 後面、Base64 編碼、放進 Cookie 送給網站；回應是登入頁就是猜錯，換下一個候選；回應是 bob 的帳號頁就是猜中\u003c/title\u003e\n    \u003cdefs\u003e\u003cmarker id=\"auth-remember-guess-ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"\u003e\u003cpath d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\n    \u003crect x=\"4\" y=\"10\" width=\"100\" height=\"60\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"54\" y=\"32\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e候選密碼\u003c/text\u003e\n    \u003ctext x=\"54\" y=\"52\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e[密碼清單]\u003c/text\u003e\n    \u003cpath d=\"M106 40 H134\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-remember-guess-ah)\"/\u003e\n    \u003crect x=\"137\" y=\"10\" width=\"100\" height=\"60\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"187\" y=\"32\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e算 MD5\u003c/text\u003e\n    \u003ctext x=\"187\" y=\"52\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003ebob:[雜湊]\u003c/text\u003e\n    \u003cpath d=\"M239 40 H267\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-remember-guess-ah)\"/\u003e\n    \u003crect x=\"270\" y=\"10\" width=\"100\" height=\"60\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"320\" y=\"32\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003eBase64 編碼\u003c/text\u003e\n    \u003ctext x=\"320\" y=\"52\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003e[Base64 字串]\u003c/text\u003e\n    \u003cpath d=\"M372 40 H400\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-remember-guess-ah)\"/\u003e\n    \u003crect x=\"403\" y=\"10\" width=\"100\" height=\"60\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"453\" y=\"32\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e放進 Cookie\u003c/text\u003e\n    \u003ctext x=\"453\" y=\"52\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e送給網站\u003c/text\u003e\n    \u003cpath d=\"M505 40 H533\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-remember-guess-ah)\"/\u003e\n    \u003crect x=\"536\" y=\"10\" width=\"100\" height=\"60\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"586\" y=\"32\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e網站回應\u003c/text\u003e\n    \u003ctext x=\"586\" y=\"52\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e看回應內容\u003c/text\u003e\n    \u003cpath d=\"M586 72 V98 H380 V122\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-remember-guess-ah)\"/\u003e\n    \u003cpath d=\"M586 98 H566 V122\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-remember-guess-ah)\"/\u003e\n    \u003crect x=\"290\" y=\"126\" width=\"180\" height=\"60\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003cuse href=\"#icon-cross\" x=\"298\" y=\"140\" width=\"30\" height=\"30\" style=\"color:var(--text)\"/\u003e\n    \u003ctext x=\"400\" y=\"148\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e回到登入頁\u003c/text\u003e\n    \u003ctext x=\"400\" y=\"166\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e猜錯，換下一個\u003c/text\u003e\n    \u003crect x=\"480\" y=\"126\" width=\"156\" height=\"60\" rx=\"8\" fill=\"var(--accent-soft)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003cuse href=\"#icon-check\" x=\"488\" y=\"140\" width=\"30\" height=\"30\" style=\"color:var(--text)\"/\u003e\n    \u003ctext x=\"581\" y=\"148\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003ebob 的帳號頁\u003c/text\u003e\n    \u003ctext x=\"581\" y=\"166\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e猜中，停止\u003c/text\u003e\n    \u003cpath d=\"M290 156 H54 V74\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-remember-guess-ah)\"/\u003e\n    \u003ctext x=\"172\" y=\"148\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e下一個候選密碼\u003c/text\u003e\n  \u003c/svg\u003e\n  \u003cfigcaption\u003e\u003cspan class=\"fig-num\"\u003e圖 3.1.8-3\u003c/span\u003e 猜 Cookie 的迴圈：回應是登入頁就換下一個，是 bob 的帳號頁就停\u003c/figcaption\u003e\n\u003c/figure\u003e\n\u003cp\u003e這種猜法不受\u003ca href=\"#account-lock\"\u003e帳號鎖定\u003c/a\u003e限制。網站只在登入頁計算失敗次數，Cookie 驗證走的是另一條路，猜錯也不會被計入，所以猜得再多也不會被鎖，只剩候選清單夠不夠好的問題。這是它比一般暴力猜密碼更危險的地方。\u003c/p\u003e\n\u003ch3 id=\"remember-offline\"\u003e離線破解（攻擊二）\u003c/h3\u003e\n\u003cp\u003e第二種攻擊的前提是已經拿到別人的 Cookie。常見的來源是網站有 XSS 漏洞：攻擊者放進網站的程式碼會在受害者的瀏覽器裡執行，因此能讀出瀏覽器裡的 Cookie 送給攻擊者，怎麼做見 \u003ca href=\"../../server-input/xss-basics/index.html\"\u003eXSS\u003c/a\u003e，這裡不重講。\u003c/p\u003e\n\u003cp\u003e拿到 bob 的 Cookie 後解碼，就得到 \u003ccode\u003ebob\u003c/code\u003e 和一段雜湊。雜湊不能直接倒推，但這裡的雜湊沒有加 \u003cstrong\u003esalt\u003c/strong\u003e（在雜湊前混進一段隨機值，讓同一個密碼在不同帳號算出不同的雜湊）：同一個密碼永遠得到同一個 MD5 值。所以常見密碼的 MD5 值早就被算好，整理成密碼與雜湊的對照表公開在網路上，把雜湊貼進搜尋引擎，常常一查就看到對應的密碼。查不到的話，也能拿一份密碼清單，自己逐一算 MD5 去比對，相同的那一個就是密碼。\u003c/p\u003e\n\u003cfigure id=\"auth-remember-offline\"\u003e\n  \u003csvg viewBox=\"0 0 640 190\" role=\"img\" aria-labelledby=\"auth-remember-offline-t\" style=\"color:var(--text)\"\u003e\n    \u003ctitle id=\"auth-remember-offline-t\"\u003e離線破解：拿到 bob 的 Cookie 後，在攻擊者自己的電腦上 Base64 解碼得到雜湊，先拿雜湊去查公開的對照表；查不到就用密碼清單逐一算 MD5 比對；兩條路都得到 bob 的密碼，整個過程不送請求給網站\u003c/title\u003e\n    \u003cdefs\u003e\u003cmarker id=\"auth-remember-offline-ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"\u003e\u003cpath d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\n    \u003crect x=\"4\" y=\"40\" width=\"128\" height=\"90\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003cuse href=\"#icon-cookie\" x=\"38\" y=\"50\" width=\"30\" height=\"30\" style=\"color:var(--text)\"/\u003e\n    \u003ctext x=\"68\" y=\"98\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003ebob 的 Cookie\u003c/text\u003e\n    \u003ctext x=\"68\" y=\"116\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003e[Base64 字串]\u003c/text\u003e\n    \u003cpath d=\"M136 85 H166\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-remember-offline-ah)\"/\u003e\n    \u003crect x=\"170\" y=\"10\" width=\"468\" height=\"170\" rx=\"10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-dasharray=\"7 4\"/\u003e\n    \u003ctext x=\"404\" y=\"28\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e攻擊者自己的電腦：不送請求給網站，網站看不到\u003c/text\u003e\n    \u003crect x=\"178\" y=\"48\" width=\"104\" height=\"64\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"230\" y=\"70\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003eBase64 解碼\u003c/text\u003e\n    \u003ctext x=\"230\" y=\"92\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003ebob:[雜湊]\u003c/text\u003e\n    \u003cpath d=\"M286 80 H306\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-remember-offline-ah)\"/\u003e\n    \u003crect x=\"310\" y=\"48\" width=\"104\" height=\"64\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"362\" y=\"70\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e拿 [雜湊] 查表\u003c/text\u003e\n    \u003ctext x=\"362\" y=\"92\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e公開的對照表\u003c/text\u003e\n    \u003cpath d=\"M418 80 H540\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-remember-offline-ah)\"/\u003e\n    \u003ctext x=\"479\" y=\"72\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e查到\u003c/text\u003e\n    \u003cpath d=\"M362 112 V140 H438\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-remember-offline-ah)\"/\u003e\n    \u003ctext x=\"400\" y=\"133\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e查不到\u003c/text\u003e\n    \u003crect x=\"442\" y=\"116\" width=\"76\" height=\"48\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"480\" y=\"136\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e逐一算 MD5\u003c/text\u003e\n    \u003ctext x=\"480\" y=\"153\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e比對\u003c/text\u003e\n    \u003cpath d=\"M522 140 H589 V128\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-remember-offline-ah)\"/\u003e\n    \u003crect x=\"544\" y=\"60\" width=\"90\" height=\"64\" rx=\"8\" fill=\"var(--accent-soft)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"589\" y=\"97\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003ebob 的密碼\u003c/text\u003e\n  \u003c/svg\u003e\n  \u003cfigcaption\u003e\u003cspan class=\"fig-num\"\u003e圖 3.1.8-4\u003c/span\u003e 拿到 Cookie 後，雜湊在攻擊者自己的電腦上被還原成密碼\u003c/figcaption\u003e\n\u003c/figure\u003e\n\u003cp\u003e這種攻擊稱為離線破解，因為所有計算都在攻擊者自己的電腦上做，不必再對網站送任何請求：網站看不到，也沒有失敗次數可以計算或鎖定，想擋也擋不了。\u003c/p\u003e\n\u003caside class=\"practice\" aria-label=\"Lab 練習\"\u003e\n\u003cp\u003ePortSwigger Academy 的對應練習（主題頁 \u003ca href=\"https://portswigger.net/web-security/authentication\"\u003eAuthentication\u003c/a\u003e）：\u003c/p\u003e\n\u003cul\u003e\n  \u003cli\u003e\u003ca href=\"https://portswigger.net/web-security/authentication/other-mechanisms/lab-brute-forcing-a-stay-logged-in-cookie\"\u003eBrute-forcing a stay-logged-in cookie\u003c/a\u003e：對應攻擊一。要觀察自己帳號的 Cookie 解碼後的使用者名稱與雜湊兩部分，以及依同一公式算出的值有沒有與 Cookie 相符；之後猜目標帳號的密碼時，猜錯與猜中的回應差在哪裡。\u003c/li\u003e\n  \u003cli\u003e\u003ca href=\"https://portswigger.net/web-security/authentication/other-mechanisms/lab-offline-password-cracking\"\u003eOffline password cracking\u003c/a\u003e：對應攻擊二。這個 Lab 用 stored XSS 把受害者的 Cookie 送到 exploit server（Academy 提供、用來接收資料的外部伺服器），偷 Cookie 的做法見 \u003ca href=\"../../server-input/xss-basics/index.html\"\u003eXSS\u003c/a\u003e。要觀察的是解碼別人的 Cookie 後拿到的雜湊，與查表或密碼清單算出的 MD5 哪一個相符。\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/aside\u003e\n\u003ch2 id=\"password-reset\"\u003e\u003cspan class=\"num\"\u003e3.1.9\u003c/span\u003e 密碼重設與更改流程\u003c/h2\u003e\n\u003cp\u003e忘記密碼的流程不能靠密碼驗證身分，使用者正是因為不記得密碼才會走這條路。tickets.example.com 的忘記密碼頁改用信箱：輸入帳號，伺服器寄一封含重設連結的信到這個帳號的信箱，點開連結設定新密碼。\u003c/p\u003e\n\u003cfigure id=\"auth-reset-flow\"\u003e\n  \u003csvg viewBox=\"0 0 640 282\" role=\"img\" aria-labelledby=\"auth-reset-flow-t\" style=\"color:var(--text)\"\u003e\n    \u003ctitle id=\"auth-reset-flow-t\"\u003e使用者送出重設請求，伺服器把重設連結寄到該帳號的信箱，使用者點連結開啟重設密碼頁，在該頁送出新密碼給伺服器更新；三個標號標出可被猜的參數、未作廢或未設期限的 token、提交時沒驗證 token 對應帳號三個缺陷位置\u003c/title\u003e\n    \u003cdefs\u003e\u003cmarker id=\"auth-reset-flow-ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"\u003e\u003cpath d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\n    \u003cuse href=\"#icon-user\" x=\"8\" y=\"42\" width=\"40\" height=\"40\" style=\"color:var(--text)\"/\u003e\n    \u003ctext x=\"30\" y=\"96\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e你\u003c/text\u003e\n    \u003crect x=\"90\" y=\"26\" width=\"140\" height=\"70\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"160\" y=\"18\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e重設請求\u003c/text\u003e\n    \u003ctext x=\"160\" y=\"65\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003e/forgot-password\u003c/text\u003e\n    \u003crect x=\"276\" y=\"26\" width=\"150\" height=\"70\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"351\" y=\"18\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e伺服器寄信\u003c/text\u003e\n    \u003cuse href=\"#icon-envelope\" x=\"333\" y=\"43\" width=\"36\" height=\"36\" style=\"color:var(--text)\"/\u003e\n    \u003crect x=\"462\" y=\"26\" width=\"174\" height=\"70\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"549\" y=\"18\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e重設連結\u003c/text\u003e\n    \u003ctext x=\"549\" y=\"65\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003e/reset-password?token=…\u003c/text\u003e\n    \u003cpath d=\"M230 61 H272\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-reset-flow-ah)\"/\u003e\n    \u003cpath d=\"M426 61 H458\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-reset-flow-ah)\"/\u003e\n    \u003cpath d=\"M50 61 H86\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-reset-flow-ah)\"/\u003e\n    \u003cpath d=\"M549 96 V126\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-reset-flow-ah)\"/\u003e\n    \u003ctext x=\"557\" y=\"120\" font-size=\"11\" text-anchor=\"start\" fill=\"currentColor\"\u003e你點連結開啟\u003c/text\u003e\n    \u003crect x=\"462\" y=\"130\" width=\"174\" height=\"70\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"549\" y=\"152\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e重設密碼頁：送出新密碼\u003c/text\u003e\n    \u003ctext x=\"549\" y=\"180\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003etoken + 新密碼\u003c/text\u003e\n    \u003cpath d=\"M462 165 H430\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#auth-reset-flow-ah)\"/\u003e\n    \u003crect x=\"276\" y=\"130\" width=\"150\" height=\"70\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n    \u003ctext x=\"351\" y=\"152\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e伺服器更新密碼\u003c/text\u003e\n    \u003ctext x=\"351\" y=\"180\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\"\u003e寫入新密碼\u003c/text\u003e\n    \u003ccircle cx=\"480\" cy=\"200\" r=\"10\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.4\"/\u003e\n    \u003ctext x=\"480\" y=\"204\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e3\u003c/text\u003e\n    \u003ccircle cx=\"490\" cy=\"96\" r=\"10\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.4\"/\u003e\n    \u003ctext x=\"490\" y=\"100\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e1\u003c/text\u003e\n    \u003ccircle cx=\"590\" cy=\"96\" r=\"10\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.4\"/\u003e\n    \u003ctext x=\"590\" y=\"100\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e2\u003c/text\u003e\n    \u003ccircle cx=\"24\" cy=\"226\" r=\"10\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.4\"/\u003e\n    \u003ctext x=\"24\" y=\"230\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e1\u003c/text\u003e\n    \u003ctext x=\"42\" y=\"230\" font-size=\"11\" text-anchor=\"start\" fill=\"currentColor\"\u003e連結用可猜的參數指定帳號\u003c/text\u003e\n    \u003ccircle cx=\"24\" cy=\"248\" r=\"10\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.4\"/\u003e\n    \u003ctext x=\"24\" y=\"252\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e2\u003c/text\u003e\n    \u003ctext x=\"42\" y=\"252\" font-size=\"11\" text-anchor=\"start\" fill=\"currentColor\"\u003etoken 沒設期限或用後沒作廢\u003c/text\u003e\n    \u003ccircle cx=\"24\" cy=\"270\" r=\"10\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.4\"/\u003e\n    \u003ctext x=\"24\" y=\"274\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e3\u003c/text\u003e\n    \u003ctext x=\"42\" y=\"274\" font-size=\"11\" text-anchor=\"start\" fill=\"currentColor\"\u003e提交時沒驗證 token 對應哪個帳號\u003c/text\u003e\n  \u003c/svg\u003e\n  \u003cfigcaption\u003e\u003cspan class=\"fig-num\"\u003e圖 3.1.9-1\u003c/span\u003e 忘記密碼流程，三個標號對應下方清單的三種缺陷\u003c/figcaption\u003e\n\u003c/figure\u003e\n\u003cp\u003e這個流程有幾個環節可能出錯：\u003c/p\u003e\n\u003cul\u003e\n  \u003cli\u003e寄出密碼本身：有些做法直接把密碼寄出，而不是寄連結。email 是持久且會同步到多個裝置的儲存空間，密碼留在信箱裡的時間，遠超過一個重設流程該有的生命週期；要安全，密碼得很快失效，或使用者立刻登入改掉。\u003c/li\u003e\n  \u003cli\u003e連結用可猜的參數（標號 1）：如果重設連結是靠帳號名稱或序號之類容易猜的值組成，不需要真的收到信也能構造出別人的連結。tickets.example.com 在資訊揭露一節的帳號頁，網址用 \u003ccode\u003euser=\u003c名稱\u003e\u003c/code\u003e 指定要看誰，就是這種直接用名稱當參數的做法；重設請求若也這樣設計，改掉參數就能指定別人的帳號。\u003c/li\u003e\n  \u003cli\u003etoken 沒設期限或用後沒作廢（標號 2）：重設密碼連結裡的 token 是 32 位十六進位亂數，正常設計是 15 分鐘後失效、用過一次就作廢；少了任何一條，舊的重設連結就能重複使用。\u003c/li\u003e\n  \u003cli\u003e沒有重新驗證 token 對應哪個帳號（標號 3）：連結裡的 \u003ccode\u003etoken\u003c/code\u003e 應該和發出它的那個帳號綁定。重設密碼頁的缺陷是提交新密碼時只確認 token 本身存在，沒再確認它對應的帳號；帳號另外用表單裡的隱藏欄位 \u003ccode\u003eusername\u003c/code\u003e 指定。改掉這個隱藏欄位，就能用自己收到的 token 改掉別人的密碼。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cfigure id=\"auth-reset-flaws\" class=\"tsplit\"\u003e\n  \u003cdiv class=\"ts-row\"\u003e\u003cspan class=\"ts-name\"\u003e重設網址\u003c/span\u003e\u003cdiv class=\"ts-line\"\u003e\u003cspan class=\"ts-seg\" data-label=\"路徑\"\u003e/reset-password?token=\u003c/span\u003e\u003cspan class=\"ts-seg ts-ph\" data-label=\"32 位十六進位，15 分鐘內有效、用後作廢\"\u003e[token]\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\n  \u003cdiv class=\"ts-row\"\u003e\u003cspan class=\"ts-name\"\u003e提交表單\u003c/span\u003e\u003cdiv class=\"ts-line\"\u003e\u003cspan class=\"ts-group\" data-label=\"隱藏欄位\"\u003e\u003cspan class=\"ts-seg\" data-label=\"可被改掉\"\u003eusername\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ts-seg\" data-label=\"新密碼欄位\"\u003enew-password\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\n  \u003cfigcaption\u003e\u003cspan class=\"fig-num\"\u003e圖 3.1.9-2\u003c/span\u003e token 綁定重設請求，隱藏欄位 username 卻可被改成別人的帳號\u003c/figcaption\u003e\n\u003c/figure\u003e\n\u003cp\u003e重設連結如果是用 Host header 動態組出網域部分，還有另一種攻擊方式：\u003cstrong\u003epassword reset poisoning\u003c/strong\u003e（重設連結指向偽造網域），改 Host header 讓連結指到你控制的網域。這個手法需要先懂 Host header 的機制，留到 \u003ca href=\"../../proxy-cache/host-header/index.html\"\u003eHost Header\u003c/a\u003e 一節。\u003c/p\u003e\n\u003cp\u003e更改密碼頁是另一個入口。更改密碼頁要求輸入目前密碼與新密碼兩次，用的也是表單裡的隱藏欄位 \u003ccode\u003eusername\u003c/code\u003e 指定要改誰的密碼；這個頁面不需要登入就能用。於是它變成了另一個暴力猜測入口：拿目前密碼的猜測結果去試，對了或錯了，回應不同。\u003c/p\u003e\n\u003cdiv class=\"rr\" id=\"change-password-wrong\"\u003e\u003cdiv class=\"rr-pt\"\u003e目前密碼錯誤\u003c/div\u003e\u003cdiv class=\"rr-frame\"\u003e\u003cdiv class=\"rr-pane rr-req\"\u003e\u003cdiv class=\"rr-ph\"\u003eRequest\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-method\"\u003ePOST\u003c/span\u003e \u003cspan class=\"tok-path\"\u003e/account/change-password\u003c/span\u003e \u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eHost\u003c/span\u003e: \u003cspan class=\"tok-host\"\u003etickets.example.com\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eContent-Type\u003c/span\u003e: application/x-www-form-urlencoded\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-param\"\u003eusername\u003c/span\u003e=\u003cspan class=\"tok-value\"\u003ebob\u003c/span\u003e\u0026amp;\u003cspan class=\"tok-param\"\u003ecurrent-password\u003c/span\u003e=\u003cspan class=\"tok-placeholder\"\u003e[猜測的密碼]\u003c/span\u003e\u0026amp;\u003cspan class=\"tok-param\"\u003enew-password-1\u003c/span\u003e=\u003cspan class=\"tok-placeholder\"\u003e[新密碼]\u003c/span\u003e\u0026amp;\u003cspan class=\"tok-param\"\u003enew-password-2\u003c/span\u003e=\u003cspan class=\"tok-placeholder\"\u003e[新密碼]\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003cdiv class=\"rr-pane rr-res\"\u003e\u003cdiv class=\"rr-ph\"\u003eResponse\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e \u003cspan class=\"tok-status\"\u003e200\u003c/span\u003e OK\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eContent-Type\u003c/span\u003e: text/html\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e目前密碼錯誤\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cdiv class=\"rr rr-alt\" id=\"change-password-mismatch-rr\"\u003e\u003cdiv class=\"rr-pt\"\u003e目前密碼正確，新密碼兩次不一致\u003c/div\u003e\u003cdiv class=\"rr-frame\"\u003e\u003cdiv class=\"rr-pane rr-req\"\u003e\u003cdiv class=\"rr-ph\"\u003eRequest\u003c/div\u003e\u003cpre data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-method\"\u003ePOST\u003c/span\u003e \u003cspan class=\"tok-path\"\u003e/account/change-password\u003c/span\u003e \u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eHost\u003c/span\u003e: \u003cspan class=\"tok-host\"\u003etickets.example.com\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eContent-Type\u003c/span\u003e: application/x-www-form-urlencoded\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-param\"\u003eusername\u003c/span\u003e=\u003cspan class=\"tok-value\"\u003ebob\u003c/span\u003e\u0026amp;\u003cspan class=\"tok-param\"\u003ecurrent-password\u003c/span\u003e=\u003cspan class=\"tok-placeholder\"\u003e[正確的密碼]\u003c/span\u003e\u0026amp;\u003cspan class=\"tok-param\"\u003enew-password-1\u003c/span\u003e=\u003cspan class=\"tok-placeholder\"\u003e[新密碼甲]\u003c/span\u003e\u0026amp;\u003cspan class=\"tok-param\"\u003enew-password-2\u003c/span\u003e=\u003cspan class=\"tok-placeholder\"\u003e[新密碼乙]\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003cdiv class=\"rr-pane rr-res\"\u003e\u003cdiv class=\"rr-ph\"\u003eResponse\u003c/div\u003e\u003cpre id=\"change-password-mismatch\" data-lang=\"http\"\u003e\u003ccode\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-keyword\"\u003eHTTP/1.1\u003c/span\u003e \u003cspan class=\"tok-status\"\u003e200\u003c/span\u003e OK\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"tok-header\"\u003eContent-Type\u003c/span\u003e: text/html\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e新密碼不一致\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cp\u003e兩種回應不同：「目前密碼錯誤」表示猜測落空，「新密碼不一致」表示目前密碼猜對了，只是故意讓兩次新密碼不同，不會真的改掉密碼。這和\u003ca href=\"#enumeration\"\u003e帳號列舉\u003c/a\u003e一節的回應差異是同一種判斷，只是搬到了更改密碼頁上。\u003c/p\u003e\n\u003caside class=\"practice\" aria-label=\"Lab 練習\"\u003e\n\u003cp\u003ePortSwigger Academy 的對應練習（主題頁 \u003ca href=\"https://portswigger.net/web-security/authentication\"\u003eAuthentication\u003c/a\u003e）：\u003c/p\u003e\n\u003cul\u003e\n  \u003cli\u003e\u003ca href=\"https://portswigger.net/web-security/authentication/other-mechanisms/lab-password-reset-broken-logic\"\u003ePassword reset broken logic\u003c/a\u003e：對應上面重設密碼頁的隱藏欄位缺陷：帳號由表單裡的 \u003ccode\u003eusername\u003c/code\u003e 指定。要觀察把這個欄位改成別人的帳號後，提交新密碼的回應是否仍然成功；Lab 裡 token 完全沒被檢查。\u003c/li\u003e\n  \u003cli\u003e\u003ca href=\"https://portswigger.net/web-security/authentication/other-mechanisms/lab-password-brute-force-via-password-change\"\u003ePassword brute-force via password change\u003c/a\u003e：對應上面更改密碼頁的例子：回應會隨目前密碼猜對或猜錯而不同。要觀察「目前密碼錯誤」與「新密碼不一致」兩種訊息，後者表示猜對了。\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/aside\u003e\n\u003caside class=\"next\" aria-label=\"下一節\"\u003e\n\u003cp\u003e網站確認了帳號之後，還要決定這個帳號能做什麼。下一節 \u003ca href=\"../access-control/index.html\"\u003eAccess Control\u003c/a\u003e 處理這一步：alice 通過登入之後，網站用什麼方式決定她能看誰的資料、能做哪些動作，又在哪些環節把這個判斷弄錯。\u003c/p\u003e\n\u003c/aside\u003e\n"},{"id":"access-control","no":"3.2","title":"Access Control","question":"已經登入，為什麼還能看到別人的資料？","slides":[{"heading":"intro","title":"本節模型","show":"ac-account-scene","points":["網站依 session 認出 alice","依 \u003ccode\u003e?id=7\u003c/code\u003e 決定取哪一筆資料","\u003ccode\u003e?id=7\u003c/code\u003e 是使用者送來的輸入"]},{"heading":"login-not-enough","show":"ac-roles-map","points":["每個人存取自己的資源是正常連線","越過角色的界線碰管理頁，是\u003cstrong\u003e垂直越權\u003c/strong\u003e","越過資料的界線碰 bob 的帳號頁，是\u003cstrong\u003e水平越權\u003c/strong\u003e"]},{"heading":"login-not-enough","show":"ac-check-layers","points":["登入只發生一次，授權檢查發生在每個請求","身分驗證通過後，請求到資源前還有三道授權檢查","三類存取控制各有自己的一道，不通過通常回 403"]},{"heading":"rule-models","show":"ac-matrix","points":["權限矩陣記錄各角色對各動作的許可","程式處理每個請求時，都去查這張表","會員不能看他人的訂單、不能進管理頁，管理員都可以"]},{"heading":"rule-models","show":"ac-models","points":["\u003cstrong\u003eDAC\u003c/strong\u003e：權限依使用者或群組授予，擁有者可以自行授權給別人","\u003cstrong\u003eMAC\u003c/strong\u003e：由中央管理者統一規定，擁有者和使用者都不能自行授權","\u003cstrong\u003eRBAC\u003c/strong\u003e：權限授予角色，使用者被指派到角色後就有該角色的權限"]},{"heading":"rule-models","show":"ac-server-check","points":["session 認出使用者，伺服器端再查出角色","請求自帶的角色旗標與角色欄位，使用者能改","請求裡的角色值不應當授權依據"]},{"heading":"unprotected-admin","show":["ac-admin-panel","ac-admin-panel-shot"],"points":["alice 直接輸入 \u003ccode\u003e/admin-panel\u003c/code\u003e","網站沒有檢查時，回 200 管理頁","alice 能刪除使用者"]},{"heading":"unprotected-admin","show":"ac-js-leak","points":["管理頁網址 \u003ccode\u003e/admin-x7k2q9\u003c/code\u003e 難猜","前端 JavaScript 的程式碼裡寫著這個網址","難猜的網址是 security by obscurity，不是存取控制"]},{"heading":"role-in-request","show":["ac-cookie-alt-rr","ac-admin-cookie-shots"],"points":["Cookie 的 \u003ccode\u003eadmin=false\u003c/code\u003e 改成 \u003ccode\u003eadmin=true\u003c/code\u003e","session 沒動，帳號頁的連結列多出「管理後台」","網站只讀請求自己帶的值，沒查 alice 是不是管理員"]},{"heading":"role-in-request","show":"ac-profile-update-alt-rr","points":["更新成功的回應列出所有欄位，露出 \u003ccode\u003eroleid\u003c/code\u003e","伺服器把請求裡所有欄位都收下","多送一個 \u003ccode\u003eroleid\u003c/code\u003e，角色就被改了"]},{"heading":"role-in-request","show":"ac-trust-compare","points":["左：信任請求內的角色值，把 \u003ccode\u003eadmin=true\u003c/code\u003e 當依據而放行","右：只依 session 查到的伺服器端角色，忽略請求帶的值並回 403"]},{"heading":"idor-id","show":["ac-idor-rr","ac-idor-shots"],"points":["alice 的登入身分不變，只改網址上的編號","\u003ccode\u003eid=7\u003c/code\u003e 換成 \u003ccode\u003eid=3\u003c/code\u003e，頁面換成 bob 的","這是水平越權，也是 IDOR"]},{"heading":"idor-id","show":"ac-idor-records","points":["網站程式依 id 查資料庫的記錄","編號由使用者送來，直接拿去取得一筆記錄","沒有所有權檢查，指到 bob 那筆的請求也照樣回資料"]},{"heading":"idor-id","show":["ac-account-exposed","ac-idor-update-rr"],"points":["bob 的帳號頁露出 email、電話與 API key","更新請求的 \u003ccode\u003eid\u003c/code\u003e 同樣由使用者送來","沒核對所有權，alice 用 \u003ccode\u003eid=3\u003c/code\u003e 就改了 bob 的資料"]},{"heading":"leaks","show":"ac-leaks","points":["換成 GUID，但討論區留言者的連結露出 GUID","302 導走請求，但 body 仍夾帶帳號資料","密碼遮成圓點，但回應裡的 \u003ccode\u003evalue\u003c/code\u003e 是明文"]},{"heading":"leaks","show":["ac-masked-shot","ac-password-field-rr"],"points":["畫面上，密碼欄位只顯示圓點","回應原始碼的 \u003ccode\u003evalue\u003c/code\u003e 是明文","圓點遮蔽與編號形式無關，換成 GUID 一樣讀得到"]},{"heading":"leaks","show":"ac-horizontal-to-vertical","points":["把 id 改成 1，取得 admin 的帳號資料與密碼","用 admin 與讀到的密碼登入，取得 session","帶著 admin 的 session 開管理頁：垂直越權"]},{"heading":"static-file-idor","show":["ac-chat-rr","ac-chat-alt-rr"],"points":["客服紀錄是遞增檔名的文字檔，\u003ccode\u003e123.txt\u003c/code\u003e 改成 \u003ccode\u003e122.txt\u003c/code\u003e 就是別人的","換成前一號的檔名，回應是別人的紀錄，含帳號與密碼"]},{"heading":"static-file-idor","show":"ac-static-path","points":["nginx 直接從 \u003ccode\u003epublic/\u003c/code\u003e 讀檔送出，請求不會進到網站程式","沒有程式裡的權限檢查可以做","知道檔名的人都取得到檔案"]},{"heading":"proxy-vs-app","show":"ac-proxy-bypass","points":["proxy 依網址或 method 擋規則：\u003ccode\u003eGET /console\u003c/code\u003e 被擋下","請求行是 \u003ccode\u003e/\u003c/code\u003e，header \u003ccode\u003eX-Original-URL\u003c/code\u003e 指定 \u003ccode\u003e/console\u003c/code\u003e","proxy 看請求行而放行，網站程式改用 header 的路徑，回管理頁"],"layout":"bottom"},{"heading":"proxy-vs-app","show":"ac-url-match","points":["proxy 逐字比對 \u003ccode\u003e/console\u003c/code\u003e","\u003ccode\u003e/Console\u003c/code\u003e、\u003ccode\u003e/console/\u003c/code\u003e、\u003ccode\u003e/console.anything\u003c/code\u003e 在 proxy 比對不到規則","網站程式把它們都當成 \u003ccode\u003e/console\u003c/code\u003e 處理"]},{"heading":"proxy-vs-app","show":["ac-promote-rr","ac-promote-alt-rr"],"points":["規則只擋 member 用 POST 呼叫升級功能","換成 GET 送同一個路徑，被放行","網站程式不檢查角色，alice 被升級為管理員"]},{"heading":"flow-referer-location","show":"ac-multistep","points":["升級使用者要走三步，前兩步檢查是不是管理員","確認那一步沒檢查，alice 跳過前兩步直接送出","每一步是獨立的請求，伺服器沒記錄走到哪一步，就只能各自判斷"]},{"heading":"flow-referer-location","show":"ac-confirm-rr","points":["第三步請求的路徑與欄位不是秘密","網站對第三步只看請求內容，不查角色","alice 帶著自己的 session 送出同樣的請求，也會被執行"]},{"heading":"flow-referer-location","show":["ac-referer-rr","ac-referer-alt-rr"],"points":["伺服器看 \u003ccode\u003eReferer\u003c/code\u003e header 判斷請求從哪裡來","這個 header 由發出請求的人決定","自己填管理頁的網址就通過"]},{"heading":"flow-referer-location","show":"ac-location","points":["location-based：依來源地區限制，例如只開放某些地區","經過代理伺服器或 VPN，伺服器看到的來源換成出口的位置","網站若依用戶端回報的定位判斷，使用者可以自行回報別的位置"]}],"body":"\u003csvg class=\"icon-sprite\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\" focusable=\"false\" style=\"position:absolute;width:0;height:0;overflow:hidden\"\u003e\u003csymbol id=\"icon-admin\" viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"\u003e\u003cpath d=\"M7 43c0-8 7-12 17-12s17 4 17 12z\" fill=\"var(--icon-admin-soft)\"/\u003e\u003ccircle cx=\"24\" cy=\"23\" r=\"10.5\" fill=\"var(--icon-admin-soft)\"/\u003e\u003cpath d=\"M13 14L12 4l8 5 4-6 4 6 8-5-1 10z\" fill=\"var(--icon-admin)\"/\u003e\u003ccircle cx=\"20\" cy=\"24\" r=\"1.9\" fill=\"currentColor\" stroke=\"none\"/\u003e\u003ccircle cx=\"28\" cy=\"24\" r=\"1.9\" fill=\"currentColor\" stroke=\"none\"/\u003e\u003cpath d=\"M21 28.5q3.0 2.5 6 0\" stroke-width=\"2.2\"/\u003e\u003c/symbol\u003e\u003csymbol id=\"icon-app\" viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"\u003e\u003crect x=\"4\" y=\"6\" width=\"40\" height=\"36\" rx=\"9\" fill=\"var(--icon-server-soft)\"/\u003e\u003cpath d=\"M4 17h40\"/\u003e\u003ccircle cx=\"11\" cy=\"11.5\" r=\"1.8\" fill=\"currentColor\" stroke=\"none\"/\u003e\u003ccircle cx=\"17.5\" cy=\"11.5\" r=\"1.8\" fill=\"currentColor\" stroke=\"none\"/\u003e\u003ccircle cx=\"24\" cy=\"30\" r=\"6\" fill=\"var(--icon-server)\"/\u003e\u003ccircle cx=\"24\" cy=\"30\" r=\"1.8\" font-size=\"13.2\" text-anchor=\"middle\" fill=\"currentColor\"\u003e依 ?id=7 取第 7 筆\u003c/text\u003e\n    \u003ctext x=\"504\" y=\"138\" font-size=\"13.2\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003ealice\u003c/text\u003e\n    \u003cuse href=\"#icon-document\" x=\"639\" y=\"56\" width=\"44\" height=\"44\" style=\"color:var(--text)\"/\u003e\n    \u003ctext x=\"661\" y=\"118\" font-size=\"13.2\" text-anchor=\"middle\" fill=\"currentColor\"\u003ealice 的帳號頁\u003c/text\u003e\n    \u003ctext x=\"661\" y=\"138\" font-size=\"13.2\" text-anchor=\"middle\" fill=\"currentColor\" style=\"font-family:var(--font-mono)\"\u003e200 OK\u003c/text\u003e\n    \u003cpath d=\"M168 91 H180\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-account-scene-a)\"/\u003e\n    \u003cpath d=\"M300 91 H312\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-account-scene-a)\"/\u003e\n    \u003cpath d=\"M432 91 H444\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-account-scene-a)\"/\u003e\n    \u003cpath d=\"M564 91 H576\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-account-scene-a)\"/\u003e\n    \u003ctext x=\"83\" y=\"176\" font-size=\"13.2\" text-anchor=\"middle\" fill=\"currentColor\"\u003e開自己的帳號頁\u003c/text\u003e\n    \u003ctext x=\"240\" y=\"176\" font-size=\"13.2\" text-anchor=\"middle\" fill=\"currentColor\"\u003e請求帶編號與 session\u003c/text\u003e\n    \u003ctext x=\"372\" y=\"176\" font-size=\"13.2\" text-anchor=\"middle\" fill=\"currentColor\"\u003esession 認出登入者\u003c/text\u003e\n    \u003ctext x=\"504\" y=\"176\" font-size=\"13.2\" text-anchor=\"middle\" fill=\"currentColor\"\u003e依編號取出資料\u003c/text\u003e\n    \u003ctext x=\"661\" y=\"176\" font-size=\"13.2\" text-anchor=\"middle\" fill=\"currentColor\"\u003e帳號頁回到瀏覽器\u003c/text\u003e\n    \u003cuse href=\"#legend-input\" x=\"270\" y=\"196\"/\u003e\n  \u003c/svg\u003e\n  \u003cfigcaption\u003e\u003cspan class=\"fig-num\"\u003e圖 3.2.0-1\u003c/span\u003e alice 開自己的帳號頁：網站程式依 session 認出她，依 ?id=7 取出第 7 筆資料\u003c/figcaption\u003e\n\u003c/figure\u003e\n\n\u003cp\u003e\u003ca href=\"../authentication/index.html#auth-vs-authz\"\u003e上一節\u003c/a\u003e處理前半：網站怎麼確認請求來自 alice。這一節處理後半：網站已經確認是哪個帳號，接著要決定這個人能不能做這件事。\u003c/p\u003e\n\n\u003ch2 id=\"login-not-enough\"\u003e\u003cspan class=\"num\"\u003e3.2.1\u003c/span\u003e 什麼是存取控制\u003c/h2\u003e\n\u003cp\u003e存取控制（access control）接在身分驗證與 session 後面：前者確認請求來自哪個帳號，後者讓之後每個請求都認得是同一個人，存取控制則對每個請求判斷一次，這個人能不能對這項資源做這件事。身分驗證與 session 都正確，但網站沒有判斷這個人能不能做這件事，alice 仍能做到她不該做的事。\u003c/p\u003e\n\u003cp\u003e存取控制可分為三類：\u003c/p\u003e\n\u003cul\u003e\n  \u003cli\u003e\u003cstrong\u003e垂直\u003c/strong\u003e（vertical）：依使用者類型限制功能。一般會員不能進管理頁，只有管理員能刪除使用者。\u003c/li\u003e\n  \u003cli\u003e\u003cstrong\u003e水平\u003c/strong\u003e（horizontal）：限制使用者只能碰自己的那一部分資源。alice 只能看自己的帳號頁與訂單，看不到 bob 的。\u003c/li\u003e\n  \u003cli\u003e\u003cstrong\u003e依狀態或流程\u003c/strong\u003e（context-dependent）：依應用程式目前的狀態，或使用者走到流程的哪一步來限制。訂單付款之後，就不能再改票數。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e下圖把 alice、bob、admin 和三種資源連起來。每個人存取自己的資源是正常連線；alice 越過角色的界線去碰管理頁，是垂直越權（vertical privilege escalation）；越過資料的界線去碰 bob 的帳號頁，是水平越權（horizontal privilege escalation）。\u003c/p\u003e\n\n\u003cfigure id=\"ac-roles-map\"\u003e\n  \u003csvg viewBox=\"0 0 720 310\" role=\"img\" aria-labelledby=\"ac-roles-map-t\" style=\"color:var(--text)\"\u003e\n    \u003ctitle id=\"ac-roles-map-t\"\u003ealice、bob、admin 三個角色與各自的帳號頁、管理頁：每人存取自己的資源是正常連線；alice 連到 bob 的帳號頁是水平越權，連到管理頁是垂直越權\u003c/title\u003e\n    \u003cdefs\u003e\n      \u003cmarker id=\"ac-roles-map-a\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"\u003e\n        \u003cpath d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\"/\u003e\n      \u003c/marker\u003e\n    \u003c/defs\u003e\n    \u003cuse href=\"#icon-user\" x=\"58\" y=\"25\" width=\"44\" height=\"44\" style=\"color:var(--text)\"/\u003e\u003ctext x=\"80\" y=\"83\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003ealice（會員）\u003c/text\u003e\u003crect x=\"500\" y=\"27\" width=\"210\" height=\"56\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"605\" y=\"59\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003ealice 的帳號頁（id 7）\u003c/text\u003e\u003cpath d=\"M130 55 H496\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-roles-map-a)\"/\u003e\u003cuse href=\"#icon-user\" x=\"58\" y=\"120\" width=\"44\" height=\"44\" style=\"color:var(--text)\"/\u003e\u003ctext x=\"80\" y=\"178\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003ebob（會員）\u003c/text\u003e\u003crect x=\"500\" y=\"122\" width=\"210\" height=\"56\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"605\" y=\"154\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003ebob 的帳號頁（id 3）\u003c/text\u003e\u003cpath d=\"M130 150 H496\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-roles-map-a)\"/\u003e\u003cuse href=\"#icon-admin\" x=\"58\" y=\"215\" width=\"44\" height=\"44\" style=\"color:var(--text)\"/\u003e\u003ctext x=\"80\" y=\"273\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003eadmin（管理員）\u003c/text\u003e\u003crect x=\"500\" y=\"217\" width=\"210\" height=\"56\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"605\" y=\"249\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e管理頁 /admin-panel\u003c/text\u003e\u003cpath d=\"M130 245 H496\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-roles-map-a)\"/\u003e\u003cpath d=\"M130 48 L496 128\" fill=\"none\" stroke=\"var(--warning)\" stroke-width=\"1.6\" stroke-dasharray=\"5 4\" marker-end=\"url(#ac-roles-map-a)\"/\u003e\u003cpath d=\"M130 62 L496 232\" fill=\"none\" stroke=\"var(--warning)\" stroke-width=\"1.6\" stroke-dasharray=\"5 4\" marker-end=\"url(#ac-roles-map-a)\"/\u003e\u003crect x=\"334.0\" y=\"88.0\" width=\"132\" height=\"24\" rx=\"4\" fill=\"var(--surface)\"/\u003e\u003ctext x=\"400\" y=\"105\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e水平越權（應擋下）\u003c/text\u003e\u003crect x=\"354.0\" y=\"173.0\" width=\"132\" height=\"24\" rx=\"4\" fill=\"var(--surface)\"/\u003e\u003ctext x=\"420\" y=\"190\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e垂直越權（應擋下）\u003c/text\u003e\u003cline x1=\"60\" y1=\"292\" x2=\"100\" y2=\"292\" stroke=\"currentColor\" stroke-width=\"1.6\"/\u003e\u003ctext x=\"108\" y=\"296\" font-size=\"12.5\" text-anchor=\"start\" fill=\"currentColor\"\u003e正常存取\u003c/text\u003e\u003cpath d=\"M200 292 H240\" stroke=\"var(--warning)\" stroke-width=\"1.6\" stroke-dasharray=\"5 4\"/\u003e\u003ctext x=\"248\" y=\"296\" font-size=\"12.5\" text-anchor=\"start\" fill=\"currentColor\"\u003e越權\u003c/text\u003e\n    \n  \u003c/svg\u003e\n  \u003cfigcaption\u003e\u003cspan class=\"fig-num\"\u003e圖 3.2.1-1\u003c/span\u003e alice 能走的正常連線，與她越過角色與資料界線的兩個方向\u003c/figcaption\u003e\n\u003c/figure\u003e\n\n\u003cp\u003e登入只發生一次，授權檢查卻發生在每個請求。下圖標出檢查擋在請求與資源之間的位置，三類存取控制各有自己的一道：\u003c/p\u003e\n\n\u003cfigure id=\"ac-check-layers\"\u003e\n  \u003csvg viewBox=\"0 0 720 316\" role=\"img\" aria-labelledby=\"ac-check-layers-t\" style=\"color:var(--text)\"\u003e\n    \u003ctitle id=\"ac-check-layers-t\"\u003e登入通過後，每個請求在到達資源之前還要過一道授權檢查：垂直檢查擋管理頁，水平檢查擋別人的帳號頁與訂單，流程檢查擋跳過的步驟；不通過就回 403\u003c/title\u003e\n    \u003cdefs\u003e\n      \u003cmarker id=\"ac-check-layers-a\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"\u003e\n        \u003cpath d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\"/\u003e\n      \u003c/marker\u003e\n    \u003c/defs\u003e\n    \u003cuse href=\"#icon-user\" x=\"10\" y=\"112\" width=\"44\" height=\"44\" style=\"color:var(--text)\"/\u003e\u003ctext x=\"32\" y=\"172\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003ealice\u003c/text\u003e\u003cpath d=\"M56 134 H88\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-check-layers-a)\"/\u003e\u003crect x=\"90\" y=\"96\" width=\"140\" height=\"76\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003cuse href=\"#icon-session\" x=\"98\" y=\"104\" width=\"30\" height=\"30\" style=\"color:var(--text)\"/\u003e\u003ctext x=\"180\" y=\"124\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\"\u003e登入通過\u003c/text\u003e\u003ctext x=\"160\" y=\"148\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003esession 認出 alice\u003c/text\u003e\u003ctext x=\"160\" y=\"168\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e（authentication）\u003c/text\u003e\u003crect x=\"290\" y=\"24\" width=\"190\" height=\"66\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003cuse href=\"#icon-lock\" x=\"298\" y=\"41\" width=\"32\" height=\"32\" style=\"color:var(--text)\"/\u003e\u003ctext x=\"340\" y=\"52\" font-size=\"12.5\" text-anchor=\"start\" fill=\"currentColor\" font-weight=\"700\"\u003e垂直檢查\u003c/text\u003e\u003ctext x=\"340\" y=\"72\" font-size=\"12.5\" text-anchor=\"start\" fill=\"currentColor\"\u003e角色能用這個功能嗎？\u003c/text\u003e\u003ctext x=\"385\" y=\"106\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e↓ 不通過：403\u003c/text\u003e\u003cpath d=\"M482 57 H538\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-check-layers-a)\"/\u003e\u003crect x=\"540\" y=\"32\" width=\"170\" height=\"50\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"625\" y=\"62\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e管理頁\u003c/text\u003e\u003cpath d=\"M232 134 L288 57\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-check-layers-a)\"/\u003e\u003crect x=\"290\" y=\"118\" width=\"190\" height=\"66\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003cuse href=\"#icon-lock\" x=\"298\" y=\"135\" width=\"32\" height=\"32\" style=\"color:var(--text)\"/\u003e\u003ctext x=\"340\" y=\"146\" font-size=\"12.5\" text-anchor=\"start\" fill=\"currentColor\" font-weight=\"700\"\u003e水平檢查\u003c/text\u003e\u003ctext x=\"340\" y=\"166\" font-size=\"12.5\" text-anchor=\"start\" fill=\"currentColor\"\u003e這筆資料是你的嗎？\u003c/text\u003e\u003ctext x=\"385\" y=\"200\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e↓ 不通過：403\u003c/text\u003e\u003cpath d=\"M482 151 H538\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-check-layers-a)\"/\u003e\u003crect x=\"540\" y=\"126\" width=\"170\" height=\"50\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"625\" y=\"156\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e帳號頁、訂單\u003c/text\u003e\u003cpath d=\"M232 134 L288 151\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-check-layers-a)\"/\u003e\u003crect x=\"290\" y=\"212\" width=\"190\" height=\"66\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003cuse href=\"#icon-lock\" x=\"298\" y=\"229\" width=\"32\" height=\"32\" style=\"color:var(--text)\"/\u003e\u003ctext x=\"340\" y=\"240\" font-size=\"12.5\" text-anchor=\"start\" fill=\"currentColor\" font-weight=\"700\"\u003e流程檢查\u003c/text\u003e\u003ctext x=\"340\" y=\"260\" font-size=\"12.5\" text-anchor=\"start\" fill=\"currentColor\"\u003e流程走到這一步了嗎？\u003c/text\u003e\u003ctext x=\"385\" y=\"294\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e↓ 不通過：403\u003c/text\u003e\u003cpath d=\"M482 245 H538\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-check-layers-a)\"/\u003e\u003crect x=\"540\" y=\"220\" width=\"170\" height=\"50\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\u003ctext x=\"625\" y=\"250\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"currentColor\"\u003e確認步驟\u003c/text\u003e\u003cpath d=\"M232 134 L288 245\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ac-check-layers-a)\"/\u003e\n    \n  \u003c/svg\u003e\n  \u003cfigcaption\u003e\u003cspan class=\"fig-num\"\u003e圖 3.2.1-2\u003c/span\u003e 身分驗證通過之後，每個請求到資源之前的三道授權檢查\u003c/figcaption\u003e\n\u003c/figure\u003e\n\n\u003cp\u003e這三道檢查都要網站自己去做。規則得落在每個頁面、每個 API（供程式呼叫的介面）與每個步驟上，漏掉任何一處，那一處就能被繞過。存取控制設錯或漏掉，稱為 broken access control。OWASP（Open Worldwide Application Security Project，整理常見 Web 風險清單的開放社群）的 Top 10（2021）把 Broken Access Control 列在第一項。\u003c/p\u003e\n\u003cp\u003e上圖的三道檢查不通過時，伺服器回的狀態碼通常是 403。401 與 403 容易記混：\u003c/p\u003e\n\u003cul\u003e\n  \u003cli\u003e\u003cstrong\u003e401 Unauthorized\u003c/strong\u003e：請求沒帶或帶錯身分憑證，伺服器不知道是誰。HTTP 規格（RFC 9110）要求這種回應附上 \u003ccode\u003eWWW-Authenticate\u003c/code\u003e header，告訴用戶端該用哪種方式驗證，\u003ca href=\"../authentication/index.html#basic-auth\"\u003eHTTP Basic 認證\u003c/a\u003e那一節有完整的 401 回應。名稱雖然是 Unauthorized，意思是還沒通過身分驗證。\u003c/li\u003e\n  \u003cli\u003e\u003cstrong\u003e403 Forbidden\u003c/strong\u003e：伺服器已經知道是誰，但這個帳號沒有權限。存取控制擋下請求，回的是這一種。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e實際的網站不一定照規格：有些網站擋下請求時回 404，讓人看不出資源是否存在，有些轉址到登入頁。\u003c/p\u003e\n\u003cp\u003e設計規則時有兩個原則：\u003c/p\u003e\n\u003cul\u003e\n  \u003cli\u003e\u003cstrong\u003e職責分離\u003c/strong\u003e（separation of duties）：敏感操作不由單一角色獨攬。例如退款要由客服提出、管理員核准，兩個角色都同意才會執行。\u003c/li\u003e\n  \u003cli\u003e\u003cstrong\u003e最小權限原則\u003c/strong\u003e（least privilege）：只給完成工作所需的權限。一般會員只碰自己的訂單，客服只看訂單狀態，不需要管理頁。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e這些規則怎麼定，是設計決定：哪個角色能做什麼、哪些資料算誰的，都得由人來
