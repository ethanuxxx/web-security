<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>忘記密碼 - 弦川票務</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="site"></header>
<main>
<form class="panel center" id="f">
<h1>忘記密碼</h1>
<label for="u">帳號</label><input id="u" name="username" autocomplete="username">
<button type="submit" class="wide">寄出重設連結</button>
<p class="note" id="msg" role="status"></p>
</form>
</main>
<footer class="site"></footer>
<script src="static/app.js"></script>
<script src="common.js"></script>
<script>
document.getElementById("f").addEventListener("submit", function (ev) {
  ev.preventDefault();
  var u = ev.target.username.value.trim().toLowerCase();
  if (exists(u)) {
    var a = new Uint8Array(16); crypto.getRandomValues(a);
    var tok = Array.prototype.map.call(a, function (b) { return ("0" + b.toString(16)).slice(-2); }).join("");
    store.set("tok:" + tok, {user: u, exp: Date.now() + 15 * 60000, used: false});
    sendMail(u, "重設密碼", "請在 15 分鐘內點選下列連結重設密碼：", "reset-password.html?token=" + tok);
  }
  document.getElementById("msg").textContent = "已寄出重設連結到帳號的信箱";
});
</script>
</body></html>
