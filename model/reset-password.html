<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>重設密碼 - 弦川票務</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="site"></header>
<main>
<form class="panel center" id="f" hidden>
<h1>重設密碼</h1>
<input type="hidden" name="username" id="hu">
<label for="n">新密碼</label><input id="n" name="new-password" type="password" autocomplete="new-password">
<button type="submit" class="wide">重設密碼</button>
</form>
<p class="note center" id="msg" role="status"></p>
</main>
<footer class="site"></footer>
<script src="static/app.js"></script>
<script src="common.js"></script>
<script>
var token = new URLSearchParams(location.search).get("token") || "";
function validToken(t) {
  var r = store.get("tok:" + t, null);
  return r && !r.used && Date.now() < r.exp ? r : null;
}
var rec = validToken(token), f = document.getElementById("f"), msg = document.getElementById("msg");
if (!rec) { msg.textContent = "重設連結無效或已過期"; }
else {
  f.hidden = false;
  document.getElementById("hu").value = rec.user;
  f.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var r = validToken(token);   // 只確認 token 存在、未過期、未使用，不比對它屬於哪個帳號
    if (!r) { f.hidden = true; msg.textContent = "重設連結無效或已過期"; return; }
    var who = f.username.value.trim().toLowerCase(), pw = f["new-password"].value;
    if (!pw) { msg.textContent = "請輸入新密碼"; return; }
    if (has(ACCOUNTS, who)) store.set("pw:" + who, pw);
    r.used = true; store.set("tok:" + token, r);
    f.hidden = true; msg.textContent = "密碼已更新，請重新登入";
  });
}
</script>
</body></html>
