<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>變更密碼 - 弦川票務</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="site"></header>
<main>
<form class="panel center" id="f">
<h1>變更密碼</h1>
<input type="hidden" name="username" id="hu">
<label for="c">目前密碼</label><input id="c" name="current-password" type="password" autocomplete="current-password">
<label for="n1">新密碼</label><input id="n1" name="new-password-1" type="password" autocomplete="new-password">
<label for="n2">再次輸入新密碼</label><input id="n2" name="new-password-2" type="password" autocomplete="new-password">
<button type="submit" class="wide">變更密碼</button>
<p class="note" id="msg" role="status"></p>
</form>
</main>
<footer class="site"></footer>
<script src="static/app.js"></script>
<script src="common.js"></script>
<script>
document.getElementById("hu").value = currentUser() || "";
document.getElementById("f").addEventListener("submit", function (ev) {
  ev.preventDefault();
  var f = ev.target, msg = document.getElementById("msg");
  var who = f.username.value.trim().toLowerCase();   // 不檢查是否登入，直接依隱藏欄位的帳號處理
  if (!exists(who) || !has(ACCOUNTS, who) || passwordOf(who) !== f["current-password"].value) { msg.textContent = "目前密碼錯誤"; return; }
  var a = f["new-password-1"].value, b = f["new-password-2"].value;
  if (a !== b) { msg.textContent = "新密碼不一致"; return; }
  if (!a) { msg.textContent = "請輸入新密碼"; return; }
  store.set("pw:" + who, a);
  msg.textContent = "密碼已更新";
});
</script>
</body></html>
