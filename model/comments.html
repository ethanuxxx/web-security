<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>討論區 - 弦川票務</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="site"></header>
<main>
<h1 id="h">討論區</h1>
<p class="meta"><a id="back">回活動頁</a></p>
<div class="past" id="list" style="margin-top:14px"></div>
</main>
<footer class="site"></footer>
<script src="static/app.js"></script>
<script src="common.js"></script>
<script src="data.js"></script>
<script>
var COMMENTS = {
  1: [["bob", "去年的爵士夜很棒，今年也會去。"], ["carol", "有人知道有沒有學生票的座位限制嗎？"]],
  2: [["carol", "上週預展先去看了，燈光很漂亮。"], ["alice", "週末人多嗎？想帶朋友去。"]],
  3: [["bob", "露天場地建議帶薄外套，傍晚會起風。"], ["carol", "期待壓軸的薩克斯風獨奏。"], ["alice", "我已經買到票了！"], ["admin", "場地入口與驗票動線已調整，請於開演前 30 分鐘入場。"]],
  4: [["bob", "跨年場次的交通接駁有消息嗎？"]]
};
var id = new URLSearchParams(location.search).get("eventId");
var e = has(EVENTS, id) ? EVENTS[id] : null;
var list = document.getElementById("list");
if (!e) { document.getElementById("h").textContent = "找不到活動"; }
else {
  document.getElementById("h").textContent = e.title + " 討論區";
  document.title = e.title + " 討論區 - 弦川票務";
  document.getElementById("back").href = "event.html?eventId=" + id;
  (COMMENTS[id] || []).forEach(function (c) {
    var d = document.createElement("div"); d.className = "cm";
    d.innerHTML = '<a class="n"></a><span></span>';
    var a = d.querySelector("a"); a.textContent = c[0]; a.href = "account.html?id=" + PEOPLE[c[0]].guid;
    d.querySelector("span").textContent = c[1];
    list.appendChild(d);
  });
}
</script>
</body></html>
